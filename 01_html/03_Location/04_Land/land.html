<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Land-Daten anzeigen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2rem;
      background-color: #f4f4f4;
    }

    h1 {
      color: #333;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background-color: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }

    th {
      background-color: #007bff;
      color: white;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .error {
      color: red;
      margin-top: 1rem;
    }
  </style>
</head>
<body>

  <h1>Länder mit Kontinent-Zuordnung</h1>
  <div id="error" class="error"></div>
  <table id="landTable">
    <thead>
      <tr>
        <th>PK_ADR_KONTINENT</th>
        <th>KONTINENT</th>
        <th>PK_REL_ADR_KONTINENT_LAND</th>
        <th>REL_FK_ADR_KONTINENT</th>
        <th>REL_FK_ADR_LAND</th>
        <th>PK_ADR_LAND</th>
        <th>LAND</th>
        <th>COUNTRY_ISO_2</th>
      </tr>
    </thead>
    <tbody>
      <!-- Dynamisch gefüllt -->
    </tbody>
  </table>

  <script>
    async function loadLandData() {
      const tableBody = document.querySelector("#landTable tbody");
      const errorDiv = document.getElementById("error");

      try {
        const res = await fetch("http://localhost:5000/land");
        if (!res.ok) throw new Error("Fehler beim Abrufen der Daten");

        const data = await res.json();
        tableBody.innerHTML = "";

        data.forEach(item => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${item.PK_ADR_KONTINENT || ""}</td>
            <td>${item.KONTINENT || ""}</td>
            <td>${item.PK_REL_ADR_KONTINENT_LAND || ""}</td>
            <td>${item.REL_FK_ADR_KONTINENT || ""}</td>
            <td>${item.REL_FK_ADR_LAND || ""}</td>
            <td>${item.PK_ADR_LAND || ""}</td>
            <td>${item.LAND || ""}</td>
            <td>${item.COUNTRY_ISO_2 || ""}</td>
          `;
          tableBody.appendChild(row);
        });

      } catch (err) {
        errorDiv.textContent = "❌ Fehler: " + err.message;
      }
    }

    loadLandData();
  </script>

</body>
</html>
