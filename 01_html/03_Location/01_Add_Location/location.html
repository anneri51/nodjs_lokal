<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standortverwaltung mit Geokodierung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 600px;
            width: 100%;
            border-radius: 8px;
            margin-top: 20px;
            z-index: 1;
        }
        .data-table {
            font-size: 0.85rem;
        }
        .table-responsive {
            max-height: 400px;
            overflow-y: auto;
        }
        .loading-spinner {
            display: none;
            width: 3rem;
            height: 3rem;
        }
        .location-marker {
            background-color: #0d6efd;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: block;
            transform: translate(-50%, -50%);
        }
        .leaflet-popup-content {
            min-width: 200px;
        }
        .search-container {
            margin-bottom: 20px;
        }
        .map-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .geocode-progress {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            text-align: center;
        }
        .marker-cluster-small {
            background-color: rgba(181, 226, 140, 0.6);
        }
        .marker-cluster-small div {
            background-color: rgba(110, 204, 57, 0.6);
        }
        .marker-cluster-medium {
            background-color: rgba(241, 211, 87, 0.6);
        }
        .marker-cluster-medium div {
            background-color: rgba(240, 194, 12, 0.6);
        }
        .marker-cluster-large {
            background-color: rgba(253, 156, 115, 0.6);
        }
        .marker-cluster-large div {
            background-color: rgba(241, 128, 23, 0.6);
        }
    </style>
</head>
<body>
    <!-- Geocoding Progress Modal -->
    <div class="geocode-progress" id="geocode-progress">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2">Standorte werden geokodiert...</p>
        <div id="geocode-status">0 von 0 Standorten verarbeitet</div>
        <div id="geocode-errors" class="text-danger small mt-2"></div>
    </div>

    <div class="container mt-4">
        <h1 class="mb-4">Standortverwaltung</h1>
        
        <div class="card mb-4">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Standortliste</h5>
                    <div class="spinner-border text-primary loading-spinner" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="alert alert-danger d-none" id="error-alert" role="alert"></div>
                <div class="alert alert-success d-none" id="success-alert" role="alert"></div>
                
                <div class="search-container">
                    <div class="row">
                        <div class="col-md-6">
                            <input type="text" class="form-control" id="search-input" placeholder="Suche nach Standort, Ort oder PLZ...">
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-primary" id="search-btn">Suchen</button>
                            <button class="btn btn-outline-secondary" id="reset-btn">Zurücksetzen</button>
                        </div>
                        <div class="col-md-3 text-end">
                            <span id="item-count">0</span> Einträge gefunden
                        </div>
                    </div>
                </div>
                
                <div class="table-responsive">
                    <table class="table table-striped table-hover data-table">
                        <thead class="table-dark sticky-top">
                            <tr>
                                <th>ID</th>
                                <th>Standort</th>
                                <th>Typ</th>
                                <th>Straße</th>
                                <th>PLZ</th>
                                <th>Ort</th>
                                <th>Land</th>
                                <th>Aktionen</th>
                            </tr>
                        </thead>
                        <tbody id="location-table-body">
                            <!-- Data will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h5>Kartenansicht</h5>
                    <button class="btn btn-sm btn-success" id="geocode-btn">Standorte auf Karte anzeigen</button>
                </div>
            </div>
            <div class="card-body position-relative">
                <div id="map"></div>
                <div class="map-controls">
                    <button class="btn btn-sm btn-outline-primary mb-1" id="zoom-fit-btn">Alle Marker anzeigen</button>
                    <button class="btn btn-sm btn-outline-secondary" id="clear-markers-btn">Marker löschen</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for detailed view -->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Standortdetails</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="detail-modal-body">
                    <!-- Details will be inserted here -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Schließen</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // DOM elements
            const tableBody = document.getElementById('location-table-body');
            const errorAlert = document.getElementById('error-alert');
            const successAlert = document.getElementById('success-alert');
            const loadingSpinner = document.querySelector('.loading-spinner');
            const itemCount = document.getElementById('item-count');
            const searchInput = document.getElementById('search-input');
            const searchBtn = document.getElementById('search-btn');
            const resetBtn = document.getElementById('reset-btn');
            const geocodeBtn = document.getElementById('geocode-btn');
            const zoomFitBtn = document.getElementById('zoom-fit-btn');
            const clearMarkersBtn = document.getElementById('clear-markers-btn');
            const geocodeProgress = document.getElementById('geocode-progress');
            const geocodeStatus = document.getElementById('geocode-status');
            const geocodeErrors = document.getElementById('geocode-errors');
            const detailModal = new bootstrap.Modal(document.getElementById('detailModal'));
            
            // Map variables
            let map;
            let markers = [];
            let markerCluster;
            let currentData = [];
            
            // Initialize map with better defaults
            function initMap() {
                map = L.map('map', {
                    zoomControl: false,
                    preferCanvas: true
                }).setView([51.1657, 10.4515], 6);
                
                // Add tile layer
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                    maxZoom: 18
                }).addTo(map);
                
                // Add custom zoom control
                L.control.zoom({
                    position: 'topright'
                }).addTo(map);
                
                // Initialize marker cluster group
                markerCluster = L.markerClusterGroup({
                    maxClusterRadius: 80,
                    iconCreateFunction: function(cluster) {
                        const count = cluster.getChildCount();
                        let size = 'small';
                        if (count > 20) size = 'large';
                        else if (count > 10) size = 'medium';
                        
                        return L.divIcon({
                            html: '<div><span>' + count + '</span></div>',
                            className: 'marker-cluster-' + size,
                            iconSize: L.point(40, 40)
                        });
                    }
                });
                map.addLayer(markerCluster);
            }
            
            // Fetch locations from API
            async function fetchLocations(searchTerm = '') {
                loadingSpinner.style.display = 'block';
                errorAlert.classList.add('d-none');
                successAlert.classList.add('d-none');
                
                try {
                    const url = searchTerm 
                        ? `http://localhost:5000/location?search=${encodeURIComponent(searchTerm)}` 
                        : 'http://localhost:5000/location';
                    
                    const response = await fetch(url);
                    
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    
                    const data = await response.json();
                    currentData = data;
                    
                    renderTable();
                    itemCount.textContent = data.length;
                    
                    if (searchTerm) {
                        successAlert.textContent = `${data.length} Standorte gefunden für "${searchTerm}"`;
                        successAlert.classList.remove('d-none');
                    }
                    
                } catch (error) {
                    console.error('Error fetching data:', error);
                    errorAlert.textContent = 'Fehler beim Laden der Daten: ' + error.message;
                    errorAlert.classList.remove('d-none');
                } finally {
                    loadingSpinner.style.display = 'none';
                }
            }
            
            // Render location table
            function renderTable() {
                tableBody.innerHTML = '';
                
                if (currentData.length === 0) {
                    const row = document.createElement('tr');
                    row.innerHTML = '<td colspan="8" class="text-center">Keine Standorte gefunden</td>';
                    tableBody.appendChild(row);
                    return;
                }
                
                currentData.forEach(location => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${location.PK_LOC_LOCATION || '-'}</td>
                        <td>${location.LOCATION || '-'}</td>
                        <td>${location.LOCATION_TYPE || '-'}</td>
<td>${location.FK_ADR_ADRESSE || '-'}</td>
                        <td>${location.STRASSE || '-'} ${location.HSNR || ''}</td>
                        <td>${location.PLZ || '-'}</td>
                        <td>${location.ORT || '-'}</td>
                        <td>${location.LAND || '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-info view-details" data-id="${location.PK_LOC_LOCATION}">
                                Details
                            </button>
                            ${location.latitude && location.longitude ? `
                            <button class="btn btn-sm btn-outline-primary view-on-map" 
                                    data-lat="${location.latitude}" 
                                    data-lng="${location.longitude}">
                                Auf Karte
                            </button>
                            ` : ''}
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
                
                // Add event listeners
                document.querySelectorAll('.view-details').forEach(btn => {
                    btn.addEventListener('click', () => showDetails(btn.dataset.id));
                });
                
                document.querySelectorAll('.view-on-map').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const lat = parseFloat(btn.dataset.lat);
                        const lng = parseFloat(btn.dataset.lng);
                        if (!isNaN(lat) && !isNaN(lng)) {
                            map.setView([lat, lng], 15);
                            // Find and open the corresponding marker's popup
                            markerCluster.getLayers().forEach(layer => {
                                if (layer.getLatLng().lat === lat && layer.getLatLng().lng === lng) {
                                    layer.openPopup();
                                }
                            });
                        }
                    });
                });
            }
            
            // Geocode locations using Nominatim (OpenStreetMap)
            async function geocodeLocations() {
                if (currentData.length === 0) {
                    errorAlert.textContent = 'Keine Standorte zum Geokodieren gefunden';
                    errorAlert.classList.remove('d-none');
                    return;
                }
                
                geocodeProgress.style.display = 'block';
                geocodeErrors.textContent = '';
                let geocodedCount = 0;
                let errorCount = 0;
                const errorMessages = [];
                
                // Clear existing markers
                clearMarkers();
                
                // Process each location
                for (const location of currentData) {
                    try {
                        geocodeStatus.textContent = `${++geocodedCount} von ${currentData.length} Standorten verarbeitet`;
                        
                        // Skip if already has coordinates
                        if (location.latitude && location.longitude) {
                            addMarker(location);
                            continue;
                        }
                        
                        // Build search query - prioritize complete address
                        let query = [
                            location.STRASSE,
                            location.HSNR,
                            location.PLZ,
                            location.ORT,
                            location.LAND
                        ].filter(Boolean).join(', ');
                        
                        // Fallback to location name if no address
                        if (!query && location.LOCATION) {
                            query = location.LOCATION;
                            if (location.LAND) query += `, ${location.LAND}`;
                        }
                        
                        if (!query) {
                            errorCount++;
                            errorMessages.push(`Standort ${location.PK_LOC_LOCATION}: Keine Adressdaten vorhanden`);
                            continue;
                        }
                        
                        // Call Nominatim API
                        const response = await fetch(
                            `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&addressdetails=1`
                        );
                        
                        if (!response.ok) throw new Error('Geocoding failed');
                        
                        const results = await response.json();
                        
                        if (results.length > 0) {
                            // Update location with coordinates
                            location.latitude = parseFloat(results[0].lat);
                            location.longitude = parseFloat(results[0].lon);
                            addMarker(location);
                        } else {
                            errorCount++;
                            errorMessages.push(`Standort ${location.PK_LOC_LOCATION}: Keine Ergebnisse für "${query}"`);
                        }
                        
                        // Respect Nominatim's rate limit (1 request/second)
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        
                    } catch (error) {
                        errorCount++;
                        errorMessages.push(`Standort ${location.PK_LOC_LOCATION}: ${error.message}`);
                        console.error(`Geocoding failed for location ${location.PK_LOC_LOCATION}:`, error);
                    }
                }
                
                geocodeProgress.style.display = 'none';
                geocodeErrors.textContent = errorMessages.slice(0, 3).join('; ') + 
                    (errorMessages.length > 3 ? `; und ${errorMessages.length - 3} weitere Fehler` : '');
                
                // Fit map to markers if any
                if (markers.length > 0) {
                    zoomToMarkers();
                    successAlert.textContent = `${markers.length} Standorte auf der Karte angezeigt (${errorCount} Fehler)`;
                    successAlert.classList.remove('d-none');
                } else {
                    errorAlert.textContent = `Keine Standorte konnten geokodiert werden (${errorCount} Fehler)`;
                    errorAlert.classList.remove('d-none');
                }
            }
            
            // Add marker to map
            function addMarker(location) {
                if (!location.latitude || !location.longitude) return;
                
                const lat = parseFloat(location.latitude);
                const lng = parseFloat(location.longitude);
                
                if (isNaN(lat) || isNaN(lng)) return;
                
                const marker = L.marker([lat, lng], {
                    icon: L.divIcon({
                        className: 'location-marker',
                        iconSize: [20, 20]
                    })
                });
                
                marker.bindPopup(`
                    <b>${location.LOCATION || 'Standort'}</b><br>
                    ${location.LOCATION_TYPE ? `Typ: ${location.LOCATION_TYPE}<br>` : ''}
                    ${location.STRASSE || ''} ${location.HSNR || ''}<br>
                    ${location.PLZ || ''} ${location.ORT || ''}<br>
                    ${location.LAND || ''}
                `);
                
                markers.push(marker);
                markerCluster.addLayer(marker);
            }
            
            // Clear all markers
            function clearMarkers() {
                markerCluster.clearLayers();
                markers = [];
                successAlert.classList.add('d-none');
            }
            
            // Zoom to fit all markers
            function zoomToMarkers() {
                if (markers.length === 0) return;
                map.fitBounds(markerCluster.getBounds().pad(0.2));
            }
            
            // Show location details
            async function showDetails(locationId) {
                try {
                    const response = await fetch(`http://localhost:5000/location/${locationId}`);
                    
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    
                    const location = await response.json();
                    const modalBody = document.getElementById('detail-modal-body');
                    
                    modalBody.innerHTML = `
                        <div class="row">
                            <div class="col-md-6">
                                <dl>
                                    <dt>Standort ID</dt>
                                    <dd>${location.PK_LOC_LOCATION || '-'}</dd>
                                    
                                    <dt>Standortname</dt>
                                    <dd>${location.LOCATION || '-'}</dd>
                                    
                                    <dt>Standorttyp</dt>
                                    <dd>${location.LOCATION_TYPE || '-'} (${location.PK_BAS_LOC_LOCATION_TYPE || '-'})</dd>
                                    
                                    <dt>Adress-ID</dt>
                                    <dd>${location.FK_ADR_ADRESSE || '-'}</dd>
                                    
                                    <dt>Straße</dt>
                                    <dd>${location.STRASSE || '-'} ${location.HSNR || ''}</dd>
                                    
                                    <dt>Postfach</dt>
                                    <dd>${location.POSTFACH || '-'}</dd>
                                </dl>
                            </div>
                            <div class="col-md-6">
                                <dl>
                                    <dt>PLZ</dt>
                                    <dd>${location.PLZ || '-'}</dd>
                                    
                                    <dt>Ort</dt>
                                    <dd>${location.ORT || '-'} (${location.PK_ADR_ORT || '-'})</dd>
                                    
                                    <dt>Land</dt>
                                    <dd>${location.LAND || '-'} (${location.PK_ADR_LAND || '-'})</dd>
                                    
                                    <dt>Beschreibung</dt>
                                    <dd>${location.BESCHREIBUNG || '-'}</dd>
                                    
                                    <dt>Kommentar</dt>
                                    <dd>${location.COMM || '-'}</dd>
                                    
                                    <dt>Mandant</dt>
                                    <dd>${location.FK_MDT_MANDANT || '-'}</dd>
                                </dl>
                            </div>
                        </div>
                        ${location.latitude && location.longitude ? `
                        <div class="mt-3">
                            <div id="detail-map" style="height: 300px; width: 100%;"></div>
                        </div>
                        ` : ''}
                        <div class="mt-3">
                            <small class="text-muted">Erstellt am: ${location.CREATED_AT || '-'} von ${location.CREATED_BY || '-'}</small><br>
                            <small class="text-muted">Geändert am: ${location.MODIFIED_AT || '-'} von ${location.MODIFIED_BY || '-'}</small>
                        </div>
                    `;
                    
                    // Initialize map in modal if coordinates exist
                    if (location.latitude && location.longitude) {
                        setTimeout(() => {
                            const detailMap = L.map('detail-map').setView(
                                [location.latitude, location.longitude], 
                                15
                            );
                            
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
                            }).addTo(detailMap);
                            
                            L.marker([location.latitude, location.longitude], {
                                icon: L.divIcon({
                                    className: 'location-marker',
                                    iconSize: [20, 20]
                                })
                            }).addTo(detailMap)
                            .bindPopup(`
                                <b>${location.LOCATION || 'Standort'}</b><br>
                                ${location.STRASSE || ''} ${location.HSNR || ''}<br>
                                ${location.PLZ || ''} ${location.ORT || ''}
                            `)
                            .openPopup();
                        }, 100);
                    }
                    
                    detailModal.show();
                    
                } catch (error) {
                    console.error('Error fetching details:', error);
                    errorAlert.textContent = 'Fehler beim Laden der Details: ' + error.message;
                    errorAlert.classList.remove('d-none');
                }
            }
            
            // Event listeners
            searchBtn.addEventListener('click', () => {
                if (searchInput.value.trim()) {
                    fetchLocations(searchInput.value.trim());
                }
            });
            
            resetBtn.addEventListener('click', () => {
                searchInput.value = '';
                fetchLocations();
                successAlert.classList.add('d-none');
            });
            
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && searchInput.value.trim()) {
                    fetchLocations(searchInput.value.trim());
                }
            });
            
            geocodeBtn.addEventListener('click', geocodeLocations);
            zoomFitBtn.addEventListener('click', zoomToMarkers);
            clearMarkersBtn.addEventListener('click', clearMarkers);
            
            // Initialize
            initMap();
            fetchLocations();
        });
    </script>
</body>
</html>
