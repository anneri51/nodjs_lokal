<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Neuen Standort anlegen</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem;
      display: flex;
      gap: 2rem;
    }

    form {
      flex: 2;
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      max-width: 600px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    select, input, button {
      padding: 0.5rem;
      font-size: 1rem;
      width: 100%;
      margin-top: 5px;
    }

    button {
      margin-top: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .message {
      margin-top: 20px;
      font-weight: bold;
    }

    .success { color: green; }
    .error { color: red; }

    #matchedAddresses {
      flex: 1;
      background: #f9f9f9;
      padding: 1rem;
      border: 1px solid #ccc;
      max-height: 90vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .tab-buttons {
      display: flex;
      margin-bottom: 1rem;
    }

    .tab-buttons button {
      flex: 1;
      padding: 10px;
      cursor: pointer;
      background: #e0e0e0;
      border: none;
      font-weight: bold;
    }

    .tab-buttons button.active {
      background: #ccc;
    }

    .tab-content {
      display: none;
      flex: 1;
      overflow-y: auto;
    }

    .tab-content.active {
      display: block;
    }

    .search-box {
      margin-bottom: 10px;
    }

    ul {
      padding-left: 1rem;
      list-style-type: none;
    }

    li {
      padding: 8px;
      margin: 4px 0;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    li:hover {
      background-color: #e9e9e9;
    }

    li.selected {
      background-color: #d4f1d4;
      border-color: #28a745;
    }

    /* Table styles for address details */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
      position: sticky;
      top: 0;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .address-details {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background-color: #f9f9f9;
      max-height: 40vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<form id="locationForm">
  <h1>Neuen Standort anlegen</h1>

  <label for="locationName">Location</label>
  <input type="text" id="PK_LOC_LOCATION" name="locationName" required>

  <label for="locationName">Standortname</label>
  <input type="text" id="locationName" name="locationName" required>

  <label for="locationType" style="color: red;">Standorttyp</label>
  <select id="locationType" name="locationType" required>
    <option value="">-- bitte wählen --</option>
  </select>

  <label for="Adresse">Adresse</label>
  <select id="Adresse" name="Adresse" required>
    <option value="">-- bitte wählen --</option>
  </select>

  <label for="country">Land</label>
  <select id="country" name="country" required>
    <option value="">-- bitte wählen --</option>
  </select>

  <label for="city">Ort</label>
  <select id="city" name="city" required>
    <option value="">-- bitte wählen --</option>
  </select>

  <label for="street">Straße</label>
  <select id="street" name="street" required>
    <option value="">-- bitte wählen --</option>
  </select>

  <label for="houseNumber">Hausnummer</label>
  <select id="houseNumber" name="houseNumber">
    <option value="">-- bitte wählen --</option>
  </select>

  <label for="ort">ORT</label>
  <input type="text" id="ort" name="ort" required>
  <button type="submit">Neuer Ort</button>

  <label for="plzOrt">PLZ / Ort</label>
  <select id="plzOrt" name="plzOrt" required>
    <option value="PK_ADR_PLZ_ORT">-- bitte wählen --</option>
  </select>

  <label for="plz">PLZ</label>
  <input type="text" id="plz" name="plz" required>
  <button type="submit">Neue PLZ</button>

  <button type="submit">Speichern Adresse</button>
  <div class="message" id="formMessage_adresse"></div>

  <button type="submit">Speichern Location</button>
  <div class="message" id="formMessage_location"></div>
</form>

<div id="matchedAddresses">
  <div class="tab-buttons">
    <button id="tab1Btn" class="active" onclick="switchTab(1)">Adressen</button>
    <button id="tab2Btn" onclick="switchTab(2)">Standorte</button>
  </div>

  <div id="tab1" class="tab-content active">
    <input class="search-box" type="text" id="searchAddress" placeholder="🔍 Adresse suchen..." oninput="filterAddresses()">
    <ul id="addressesList">
      <li>Lade Adressen...</li>
    </ul>
  </div>

  <div id="tab2" class="tab-content">
    <input class="search-box" type="text" id="searchLocation" placeholder="🔍 Standort suchen..." oninput="filterLocations()">
    <ul id="locationsList">
      <li>Lade Standorte...</li>
    </ul>
  </div>

  <div id="addressDetails" class="address-details" style="display: none;">
    <h3>Adressdetails</h3>
    <table id="addressDetailsTable">
      <thead>
        <tr>
          <th>PK_ADR_ADRESSE</th>
          <th>PK_REL_ADR_PLZ_STRASSE</th>
          <th>str_fk_adr_ort</th>
          <th>FK_ADR_STRASSE</th>
          <th>FK_ADR_PLZ_ORT</th>
          <th>PK_ADR_PLZ_ORT</th>
          <th>FK_ADR_ORT</th>
          <th>PK_ADR_STRASSE</th>
          <th>PLZ</th>
          <th>Straße</th>
          <th>HSNR</th>
        </tr>
      </thead>
      <tbody>
        <!-- Data will be inserted here -->
      </tbody>
    </table>
  </div>
</div>

<script>
  let locationTypes = [], addresses = [], countries = [], cities = [], plzOrtList = [], locations = [], streets = [], houseNumbers = [];

  async function init() {
    try {
      await Promise.all([
        loadLocationTypes(),
        loadAddresses(),
        loadCountries(),
        loadLocations()
      ]);
      populateAddressDropdown();
      displayAddresses();
      displayLocations();
    } catch (err) {
      showMessage("❌ Fehler beim Laden: " + err.message, true);
    }
  }

  async function loadLocationTypes() {
    const res = await fetch("http://localhost:5000/location_type");
    locationTypes = await res.json();
    const select = document.getElementById("locationType");
    locationTypes.forEach(type => {
      const opt = document.createElement("option");
      opt.value = type.PK_BAS_LOC_LOCATION_TYPE;
      opt.textContent = `${type.LOCATION_TYPE} (PK: ${type.PK_BAS_LOC_LOCATION_TYPE})`;
      select.appendChild(opt);
    });
  }

  async function loadAddresses() {
    const res = await fetch("http://localhost:5000/adresse");
    addresses = await res.json();
  }

  async function loadCountries() {
    const res = await fetch("http://localhost:5000/land");
    countries = await res.json();
    const select = document.getElementById("country");
    countries.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c.PK_ADR_LAND;
      opt.textContent = `${c.LAND} (PK: ${c.PK_ADR_LAND})`;
      select.appendChild(opt);
    });
  }

  async function loadCities(countryId) {
    const res = await fetch(`http://localhost:5000/ort?FK_ADR_LAND=${countryId}`);
    cities = await res.json();
    const select = document.getElementById("city");
    select.innerHTML = '<option value="">-- bitte wählen --</option>';
    cities.forEach(city => {
      const opt = document.createElement("option");
      opt.value = city.PK_ADR_ORT;
      opt.textContent = `${city.ORT} (PK: ${city.PK_ADR_ORT})`;
      select.appendChild(opt);
    });
  }

  async function loadStreets(cityId) {
    const res = await fetch(`http://localhost:5000/strasse/${cityId}`);
    streets = await res.json();
    const select = document.getElementById("street");
    select.innerHTML = '<option value="">-- bitte wählen --</option>';
    streets.forEach(street => {
      const opt = document.createElement("option");
      opt.value = street.PK_ADR_STRASSE;
      opt.textContent = `${street.Straße} (PK: ${street.PK_ADR_STRASSE})`;
      select.appendChild(opt);
    });
  }

  async function loadHouseNumbers(streetId) {
    const res = await fetch(`http://localhost:5000/strasse_hsnr/${streetId}`);
    houseNumbers = await res.json();
    const select = document.getElementById("houseNumber");
    select.innerHTML = '<option value="">-- bitte wählen --</option>';
    houseNumbers.forEach(hsnr => {
      const opt = document.createElement("option");
      opt.value = hsnr.PK_ADR_STRASSE_HSNR;
      opt.textContent = `${hsnr.HSNR} (PK: ${hsnr.PK_ADR_STRASSE_HSNR})`;
      select.appendChild(opt);
    });
  }

  async function loadPlzOrt(cityId) {
    const res = await fetch(`http://localhost:5000/plz_ort?FK_ADR_ORT=${cityId}`);
    plzOrtList = await res.json();
    const select = document.getElementById("plzOrt");
    select.innerHTML = '<option value="">-- bitte wählen --</option>';
    plzOrtList.forEach(po => {
      const opt = document.createElement("option");
      opt.value = po.PK_ADR_PLZ_ORT;
      opt.textContent = `${po.PLZ} (ORT: ${po.FK_ADR_ORT}) (PK: ${po.PK_ADR_PLZ_ORT})`;
      select.appendChild(opt);
    });
  }

  async function loadLocations() {
    const res = await fetch("http://localhost:5000/location");
    locations = await res.json();
  }

  function populateAddressDropdown() {
    const select = document.getElementById("Adresse");
    select.innerHTML = '<option value="">-- bitte wählen --</option>';
    addresses.forEach(addr => {
      const opt = document.createElement("option");
      opt.value = addr.PK_ADR_ADRESSE;
      opt.textContent = `${addr.STRASSE} ${addr.HSNR}, ${addr.PLZ} (${addr.PK_ADR_PLZ_ORT}) ${addr.ORT} (${addr.PK_ADR_ORT})`;
      select.appendChild(opt);
    });
  }

  function displayAddresses() {
    const ul = document.getElementById("addressesList");
    ul.innerHTML = "";
    addresses.forEach(addr => {
      const li = document.createElement("li");
      li.textContent = `${addr.STRASSE} ${addr.HSNR}, ${addr.PLZ} ${addr.ORT} (${addr.LAND}) - ${addr.PK_ADR_ADRESSE }`;
      li.dataset.search = li.textContent.toLowerCase();
      li.dataset.id = addr.PK_ADR_ADRESSE;
      li.addEventListener("click", () => {
        selectAddress(li, addr);
        showAddressDetails(addr.PK_ADR_ADRESSE);
      });
      ul.appendChild(li);
    });
  }

  async function showAddressDetails(addressId) {
    try {
      const res = await fetch(`http://localhost:5000/strasse/hsnr/${addressId}`);
      const data = await res.json();
      
      const detailsDiv = document.getElementById("addressDetails");
      const tableBody = document.querySelector("#addressDetailsTable tbody");
      
      tableBody.innerHTML = "";
      
      if (Array.isArray(data)) {
        data.forEach(item => {
          const row = document.createElement("tr");
          
          // Create cells for each property
          const properties = [
            'PK_ADR_ADRESSE', 'PK_REL_ADR_PLZ_STRASSE', 'str_fk_adr_ort', 
            'FK_ADR_STRASSE', 'FK_ADR_PLZ_ORT', 'PK_ADR_PLZ_ORT',
            'FK_ADR_ORT', 'PK_ADR_STRASSE', 'PLZ','Straße', 'HSNR'
          ];
          
          properties.forEach(prop => {
            const cell = document.createElement("td");
            cell.textContent = item[prop] !== null ? item[prop] : 'NULL';
            row.appendChild(cell);
          });
          
          tableBody.appendChild(row);
        });
        
        detailsDiv.style.display = "block";
      } else {
        // Handle single object response
        const row = document.createElement("tr");
        
        const properties = [
          'PK_ADR_ADRESSE', 'PK_REL_ADR_PLZ_STRASSE', 
          'FK_ADR_STRASSE', 'FK_ADR_PLZ_ORT', 'PK_ADR_PLZ_ORT','str_fk_adr_ort',
          'FK_ADR_ORT', 'PK_ADR_STRASSE','PLZ',  'Straße',  'HSNR'
        ];
        
        properties.forEach(prop => {
          const cell = document.createElement("td");
          cell.textContent = data[prop] !== null ? data[prop] : 'NULL';
          row.appendChild(cell);
        });
        
        tableBody.appendChild(row);
        detailsDiv.style.display = "block";
      }
    } catch (err) {
      console.error("Error loading address details:", err);
      const detailsDiv = document.getElementById("addressDetails");
      detailsDiv.style.display = "none";
    }
  }

  function displayLocations() {
    const ul = document.getElementById("locationsList");
    ul.innerHTML = "";
    locations.forEach(loc => {
      const li = document.createElement("li");
      li.innerHTML = `#${loc.PK_LOC_LOCATION}: <strong>${loc.LOCATION}</strong> [Typ: ${loc.LOCATION_TYPE}] <small>(${loc.STRASSE} ${loc.HSNR}, ${loc.PLZ} ${loc.ORT} (${loc.LAND}) - ${loc.PK_LOC_LOCATION})</small>`;
      li.dataset.search = li.textContent.toLowerCase();
      ul.appendChild(li);
    });
  }

  function filterAddresses() {
    const query = document.getElementById("searchAddress").value.toLowerCase();
    document.querySelectorAll("#addressesList li").forEach(li => {
      li.style.display = li.dataset.search.includes(query) ? "" : "none";
    });
  }

  function filterLocations() {
    const query = document.getElementById("searchLocation").value.toLowerCase();
    document.querySelectorAll("#locationsList li").forEach(li => {
      li.style.display = li.dataset.search.includes(query) ? "" : "none";
    });
  }

  async function selectAddress(li, addr) {
    document.querySelectorAll('#addressesList li').forEach(el => el.classList.remove('selected'));
    li.classList.add('selected');
    
    // Set basic address fields
    document.getElementById('plz').value = addr.PLZ;
    document.getElementById('plzOrt').value = addr.PK_ADR_PLZ_ORT;
    document.getElementById('Adresse').value = addr.PK_ADR_ADRESSE;
    document.getElementById('country').value = addr.PK_ADR_LAND;
    document.getElementById('ort').value = addr.ORT;

    // Load dependent dropdowns
    await loadCities(addr.PK_ADR_LAND);
    document.getElementById('city').value = addr.PK_ADR_ORT;
    
    await loadStreets(addr.PK_ADR_ORT);
    document.getElementById('street').value = addr.PK_ADR_STRASSE;
    
    await loadHouseNumbers(addr.PK_ADR_STRASSE);
    document.getElementById('houseNumber').value = addr.PK_ADR_STRASSE_HSNR;
    
    await loadPlzOrt(addr.PK_ADR_ORT);
  }

  function switchTab(n) {
    document.querySelectorAll(".tab-buttons button").forEach(btn => btn.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(tab => tab.classList.remove("active"));
    document.getElementById("tab" + n).classList.add("active");
    document.getElementById("tab" + n + "Btn").classList.add("active");
  }

  function showMessage(msg, error = false) {
    const el = document.getElementById("formMessage_location");
    el.textContent = msg;
    el.className = "message " + (error ? "error" : "success");
  }

  // Event listeners
  document.getElementById("country").addEventListener("change", e => loadCities(e.target.value));
  document.getElementById("city").addEventListener("change", async e => {
    await loadStreets(e.target.value);
    await loadPlzOrt(e.target.value);
  });
  document.getElementById("street").addEventListener("change", e => loadHouseNumbers(e.target.value));
  document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
