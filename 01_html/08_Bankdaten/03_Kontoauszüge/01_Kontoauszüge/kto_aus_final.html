<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Update</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #errorDisplay {
            color: red;
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ffb3b3;
            border-radius: 4px;
            background-color: #ffeeee;
            display: none;
        }
        #successDisplay {
            color: green;
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #b3ffb3;
            border-radius: 4px;
            background-color: #eeffee;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Update Account</h1>
    
    <div class="form-group">
        <label for="accountId">Account ID:</label>
        <input type="number" id="accountId" value="1982">
    </div>
    
    <div class="form-group">
        <label for="finalCnt">Final Count:</label>
        <input type="number" id="finalCnt" value="4">
    </div>
    
    <div class="form-group">
        <label for="finalAmount">Final Amount:</label>
        <input type="number" id="finalAmount" value="0" step="0.01">
    </div>
    
    <button onclick="sendPutRequest()">Update Account</button>
    
    <div id="errorDisplay"></div>
    <div id="successDisplay"></div>
    
    <script>
        function displayError(message) {
            const errorDiv = document.getElementById('errorDisplay');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            document.getElementById('successDisplay').style.display = 'none';
        }
        
        function displaySuccess(message) {
            const successDiv = document.getElementById('successDisplay');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            document.getElementById('errorDisplay').style.display = 'none';
        }
        
        async function sendPutRequest() {
            const accountId = document.getElementById('accountId').value;
            const finalCnt = document.getElementById('finalCnt').value;
            const finalAmount = document.getElementById('finalAmount').value;
            
            // Basic validation
            if (!finalCnt || isNaN(finalCnt)) {
                displayError('Please enter a valid final count');
                return;
            }
            
            if (isNaN(finalAmount)) {
                displayError('Please enter a valid final amount');
                return;
            }
            
            const url = `http://localhost:5000/accounts/final/${accountId}`;
            const data = {
                final_cnt: parseInt(finalCnt),
                final_amount: parseFloat(finalAmount)
            };
            
            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! Status: ${response.status}`);
                }
                
                const result = await response.json();
                displaySuccess('Account updated successfully!');
                console.log("Success:", result);
            } catch (error) {
                console.error("Error:", error);
                displayError(error.message || 'Failed to update account');
            }
        }
    </script>
</body>
</html>
