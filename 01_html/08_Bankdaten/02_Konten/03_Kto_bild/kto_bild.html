<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Data Viewer with PDF Display</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .data-section {
            flex: 1;
            min-width: 300px;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .data-row {
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .data-label {
            font-weight: bold;
            color: #555;
        }
        .data-value {
            margin-top: 5px;
            word-break: break-word;
        }
        #accountIdInput {
            padding: 8px;
            margin-right: 10px;
            width: 100px;
        }
        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #loading {
            display: none;
            margin: 20px 0;
        }
        #error {
            color: red;
            margin: 20px 0;
        }
        .pdf-section {
            width: 100%;
        }
        .pdf-container {
            width: 100%;
            height: 600px;
            border: 1px solid #ddd;
            margin-top: 10px;
            overflow: auto;
        }
        .pdf-toolbar {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .page-navigation {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }
        canvas {
            margin: 0 auto;
            display: block;
        }
        .section-title {
            color: #2c3e50;
            margin-top: 0;
        }
    </style>
</head>
<body>
    <h1>Account Data Viewer</h1>
    <div>
        <input type="number" id="accountIdInput" placeholder="Enter Account ID">
        <button onclick="fetchAndDisplayData()">Fetch Data</button>
    </div>
    <div id="loading">Loading data...</div>
    <div id="error"></div>
    <div id="dataDisplay" class="container"></div>

    <!-- PDF.js library for rendering PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script>
        // Initialize PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';

        // Global variables for PDF handling
        let currentPdf = null;
        let currentPageNum = 1;
        let currentPageRendering = false;
        let currentPageNumPending = null;
        let scale = 1.5;

        async function selectItems(accountId) {
            const url = `http://localhost:5000/accounts/bild/1/${accountId}`;
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.json();
        }

        function createPdfSection(data) {
            if (!data.FILECONTENT) return null;
            
            const section = document.createElement('div');
            section.className = 'data-section pdf-section';
            section.innerHTML = '<h2 class="section-title">Document PDF</h2>';
            
            // PDF metadata
            const metaData = document.createElement('div');
            metaData.className = 'data-row';
            metaData.innerHTML = `
                <div class="data-label">FILENAME</div>
                <div class="data-value">${data.FILENAME || 'N/A'}</div>
                <div class="data-label">SEITE</div>
                <div class="data-value">${data.SEITE || 'N/A'}</div>
            `;
            section.appendChild(metaData);
            
            // PDF toolbar
            const toolbar = document.createElement('div');
            toolbar.className = 'pdf-toolbar';
            toolbar.innerHTML = `
                <button id="prevPage">Previous</button>
                <button id="nextPage">Next</button>
                <span>Page: <span id="page_num">1</span> / <span id="page_count">0</span></span>
                <button id="zoomIn">Zoom In (+)</button>
                <button id="zoomOut">Zoom Out (-)</button>
                <button id="downloadPdf">Download PDF</button>
            `;
            section.appendChild(toolbar);
            
            // PDF container
            const pdfContainer = document.createElement('div');
            pdfContainer.className = 'pdf-container';
            pdfContainer.id = 'pdf-container';
            section.appendChild(pdfContainer);
            
            // Page navigation
            const pageNav = document.createElement('div');
            pageNav.className = 'page-navigation';
            pageNav.innerHTML = `
                <input type="number" id="pageNumber" value="1" min="1" style="width: 50px;">
                <button id="goToPage">Go to Page</button>
            `;
            section.appendChild(pageNav);
            
            return section;
        }

        function setupPdfControls() {
            document.getElementById('prevPage').addEventListener('click', () => {
                if (currentPageNum <= 1) return;
                currentPageNum--;
                queueRenderPage(currentPageNum);
            });

            document.getElementById('nextPage').addEventListener('click', () => {
                if (currentPageNum >= currentPdf.numPages) return;
                currentPageNum++;
                queueRenderPage(currentPageNum);
            });

            document.getElementById('zoomIn').addEventListener('click', () => {
                scale += 0.25;
                queueRenderPage(currentPageNum);
            });

            document.getElementById('zoomOut').addEventListener('click', () => {
                if (scale <= 0.5) return;
                scale -= 0.25;
                queueRenderPage(currentPageNum);
            });

            document.getElementById('goToPage').addEventListener('click', () => {
                const pageNumber = parseInt(document.getElementById('pageNumber').value);
                if (pageNumber > 0 && pageNumber <= currentPdf.numPages) {
                    currentPageNum = pageNumber;
                    queueRenderPage(currentPageNum);
                }
            });

            document.getElementById('downloadPdf').addEventListener('click', downloadPdf);
        }

        function queueRenderPage(num) {
            if (currentPageRendering) {
                currentPageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        async function renderPage(num) {
            currentPageRendering = true;
            const page = await currentPdf.getPage(num);
            
            const viewport = page.getViewport({ scale });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.height = viewport.height;
            canvas.width = viewport.width;
            
            const pdfContainer = document.getElementById('pdf-container');
            pdfContainer.innerHTML = '';
            pdfContainer.appendChild(canvas);
            
            const renderContext = {
                canvasContext: context,
                viewport: viewport
            };
            
            await page.render(renderContext).promise;
            
            currentPageRendering = false;
            updatePageDisplay(num);
            
            if (currentPageNumPending !== null) {
                renderPage(currentPageNumPending);
                currentPageNumPending = null;
            }
        }

        function updatePageDisplay(num) {
            document.getElementById('page_num').textContent = num;
            document.getElementById('page_count').textContent = currentPdf.numPages;
            document.getElementById('pageNumber').value = num;
        }

        function downloadPdf() {
            if (!currentPdf) return;
            
            const binaryString = atob(currentPdf.base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            const blob = new Blob([bytes], { type: 'application/pdf' });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = currentPdf.filename || 'document.pdf';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }

        async function renderPdf(base64Data, filename) {
            try {
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const loadingTask = pdfjsLib.getDocument({data: bytes});
                currentPdf = await loadingTask.promise;
                currentPdf.base64 = base64Data;
                currentPdf.filename = filename;
                
                updatePageCountDisplay();
                await renderPage(1);
                setupPdfControls();
                
            } catch (error) {
                console.error('PDF rendering error:', error);
                showPdfError(error);
            }
        }

        function updatePageCountDisplay() {
            document.getElementById('page_count').textContent = currentPdf.numPages;
        }

        function showPdfError(error) {
            const errorMsg = document.createElement('div');
            errorMsg.textContent = 'Failed to render PDF: ' + error.message;
            errorMsg.style.color = 'red';
            document.getElementById('pdf-container').appendChild(errorMsg);
        }

        function formatValue(value) {
            if (value === null || value === undefined) return 'N/A';
            if (typeof value === 'boolean') return value ? 'Yes' : 'No';
            if (value instanceof Date) return value.toLocaleString();
            return value;
        }

        function displayData(data) {
            const container = document.getElementById('dataDisplay');
            container.innerHTML = '';
            
            renderPdfSection(data, container);
            renderAccountSection(data, container);
            renderAdditionalDataSection(data, container);
        }

        function renderPdfSection(data, container) {
            const pdfSection = createPdfSection(data);
            if (pdfSection) {
                container.appendChild(pdfSection);
                if (data.FILECONTENT) {
                    renderPdf(data.FILECONTENT, data.FILENAME);
                }
            }
        }

        function renderAccountSection(data, container) {
            const accountSection = document.createElement('div');
            accountSection.className = 'data-section';
            accountSection.innerHTML = '<h2 class="section-title">Account Information</h2>';
            
            const accountFields = [
                'PK_KTO_KONTO_AUSZUG', 'FK_KTO_BANKKONTO', 'JAHR', 'MONAT',
                'ANFANGSDATUM', 'ENDDATUM', 'ABHOLDATUM', 'IBAN',
                'ANFANGSBETRAG', 'ENDBETRAG', 'KOMMENTAR'
            ];
            
            accountFields.forEach(field => {
                if (data[field] !== undefined) {
                    accountSection.appendChild(createDataRow(field, data[field]));
                }
            });
            container.appendChild(accountSection);
        }

        function renderAdditionalDataSection(data, container) {
            const additionalFields = Object.keys(data).filter(key => 
                ![
                    'PK_KTO_KONTO_AUSZUG', 'FK_KTO_BANKKONTO', 'JAHR', 'MONAT',
                    'ANFANGSDATUM', 'ENDDATUM', 'ABHOLDATUM', 'IBAN',
                    'ANFANGSBETRAG', 'ENDBETRAG', 'KOMMENTAR',
                    'FILECONTENT', 'FILENAME', 'SEITE'
                ].includes(key)
            );
            
            if (additionalFields.length > 0) {
                const additionalSection = document.createElement('div');
                additionalSection.className = 'data-section';
                additionalSection.innerHTML = '<h2 class="section-title">Additional Information</h2>';
                
                additionalFields.forEach(field => {
                    additionalSection.appendChild(createDataRow(field, data[field]));
                });
                
                container.appendChild(additionalSection);
            }
        }

        function createDataRow(label, value) {
            const row = document.createElement('div');
            row.className = 'data-row';
            row.innerHTML = `
                <div class="data-label">${label}</div>
                <div class="data-value">${formatValue(value)}</div>
            `;
            return row;
        }

        async function fetchAndDisplayData() {
            const accountId = document.getElementById('accountIdInput').value;
            if (!accountId) {
                document.getElementById('error').textContent = 'Please enter an Account ID';
                return;
            }
            
            resetDisplay();
            
            try {
                const data = await selectItems(accountId);
                displayData(data);
            } catch (error) {
                showError(error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function resetDisplay() {
            document.getElementById('error').textContent = '';
            document.getElementById('loading').style.display = 'block';
            document.getElementById('dataDisplay').innerHTML = '';
        }

        function showError(error) {
            document.getElementById('error').textContent = `Error: ${error.message}`;
            console.error('Error:', error);
        }
    </script>
</body>
</html>
