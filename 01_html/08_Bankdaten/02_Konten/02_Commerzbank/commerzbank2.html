<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Commerzbank Transaction Viewer</title>
</head>
<body>
  <h1>Commerzbank Transaction Viewer</h1>
  <button id="connectBtn">Connect to Bank</button>
  <pre id="transactions">Transaction data will appear here...</pre>

  <script>
    document.getElementById('connectBtn').addEventListener('click', () => {
      // Redirect user to Commerzbank OAuth2 consent screen (fake URL for now)
      const clientId = "YOUR_CLIENT_ID";
      const redirectUri = "https://your-site.com/callback";
      const scope = "AIS"; // Account Info Service
      const state = "xyz123";
      const authUrl = `https://api.commerzbank.com/auth/authorize?response_type=code&client_id=${clientId}&redirect_uri=${encodeURIComponent(redirectUri)}&scope=${scope}&state=${state}`;
      
      window.location.href = authUrl;
    });

    // After redirection, you'd handle the OAuth2 callback, get token, and fetch data.
    // This part should be handled by your secure backend.
  </script>
</body>
</html>
