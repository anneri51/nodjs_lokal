<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Erweiterte Multiselect-Filter | Jahr, Monat, Tag | Transaktionsanalyse</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            padding: 28px 24px;
            color: #0a2540;
        }
        .dashboard {
            max-width: 1600px;
            margin: 0 auto;
        }
        .main-card {
            background: white;
            border-radius: 36px;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.12);
            overflow: hidden;
        }
        .tabs-header {
            display: flex;
            flex-wrap: wrap;
            background: #ffffff;
            border-bottom: 1px solid #e6edf4;
            padding: 8px 28px 0 28px;
            gap: 8px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 14px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4a5b7a;
            cursor: pointer;
            border-radius: 40px;
            transition: 0.2s;
        }
        .tab-btn:hover { background: #eff3f9; color: #1f3a6b; }
        .tab-btn.active {
            background: #eef2ff;
            color: #1f4fcf;
            box-shadow: inset 0 -1px 0 #1f4fcf;
        }
        .tab-pane {
            display: none;
            padding: 28px 30px 36px 30px;
            animation: fade 0.2s ease;
        }
        .tab-pane.active-pane { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* Multiselect Container */
        .multiselect-group {
            background: #fafdff;
            border-radius: 32px;
            padding: 20px 24px;
            margin-bottom: 28px;
            border: 1px solid #e9f0f5;
        }
        .multiselect-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            margin-bottom: 20px;
            align-items: flex-start;
        }
        .multiselect-item {
            flex: 1;
            min-width: 220px;
        }
        .multiselect-item label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #2c456e;
            display: block;
            margin-bottom: 8px;
        }
        .searchable-select {
            position: relative;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 32px;
            border: 1px solid #d4e0ec;
            background: white;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .dropdown-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 220px;
            overflow-y: auto;
            background: white;
            border: 1px solid #d4e0ec;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            z-index: 100;
            display: none;
            margin-top: 4px;
        }
        .dropdown-list.show { display: block; }
        .dropdown-search {
            padding: 8px 12px;
            border-bottom: 1px solid #eef2f8;
            position: sticky;
            top: 0;
            background: white;
        }
        .dropdown-search input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 30px;
            border: 1px solid #dce3ec;
            font-size: 0.75rem;
        }
        .dropdown-option {
            padding: 8px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            transition: 0.1s;
        }
        .dropdown-option:hover { background: #eef2ff; }
        .dropdown-option input { margin: 0; width: 16px; height: 16px; cursor: pointer; }
        .selected-badge {
            display: inline-flex;
            background: #eef2ff;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            margin: 4px 4px 0 0;
            align-items: center;
            gap: 6px;
        }
        .remove-badge {
            cursor: pointer;
            font-weight: bold;
            color: #1f4fcf;
        }
        .filter-actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        button {
            background: #1f4fcf;
            border: none;
            padding: 8px 24px;
            border-radius: 40px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        button.secondary {
            background: #eef2ff;
            color: #1f2b48;
            border: 1px solid #cddfef;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 24px;
            margin-bottom: 28px;
        }
        .chart-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 18px;
            border: 1px solid #eef2fa;
        }
        .chart-title {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 16px;
            padding-left: 8px;
            border-left: 3px solid #1f4fcf;
        }
        canvas { max-height: 250px; width: 100%; }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 24px;
            border: 1px solid #edf2f9;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        th, td {
            padding: 12px 12px;
            text-align: left;
            border-bottom: 1px solid #eff3f8;
        }
        th { background: #f8fbfe; font-weight: 700; }
        .positive { color: #2b7e3a; font-weight: 600; }
        .negative { color: #c2410c; }
        .subnote { font-size: 0.7rem; color: #6f7c91; text-align: center; margin-top: 20px; }
        .kpi-row {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: #f8fafd;
            border-radius: 24px;
            padding: 14px 18px;
            flex: 1;
            text-align: center;
        }
        .kpi-value { font-size: 1.6rem; font-weight: 800; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="main-card">
        <div class="tabs-header">
            <button class="tab-btn active" data-tab="filter">🔍 Multiselect Filter (Jahr / Monat / Tag)</button>
            <button class="tab-btn" data-tab="stats">📊 Statistiken & Diagramme</button>
            <button class="tab-btn" data-tab="transactions">📋 Transaktionsliste</button>
        </div>

        <!-- Panel 1: Multiselect Filter -->
        <div id="filterPane" class="tab-pane active-pane">
            <div class="multiselect-group">
                <div class="multiselect-row">
                    <!-- Jahre Multiselect -->
                    <div class="multiselect-item">
                        <label>📆 Jahre (mehrfach)</label>
                        <div class="searchable-select" id="yearSelect">
                            <div class="search-input" id="yearSearchInput">Jahre auswählen...</div>
                            <div class="dropdown-list" id="yearDropdown">
                                <div class="dropdown-search"><input type="text" id="yearSearch" placeholder="Suchen..."></div>
                                <div id="yearOptions"></div>
                            </div>
                        </div>
                        <div id="selectedYears" class="selected-badges" style="margin-top: 8px;"></div>
                    </div>
                    <!-- Jahr-Monat Multiselect -->
                    <div class="multiselect-item">
                        <label>📅 Jahr-Monat (YYYY-MM)</label>
                        <div class="searchable-select" id="monthSelect">
                            <div class="search-input" id="monthSearchInput">Monate auswählen...</div>
                            <div class="dropdown-list" id="monthDropdown">
                                <div class="dropdown-search"><input type="text" id="monthSearch" placeholder="Suchen..."></div>
                                <div id="monthOptions"></div>
                            </div>
                        </div>
                        <div id="selectedMonths" class="selected-badges" style="margin-top: 8px;"></div>
                    </div>
                    <!-- Jahr-Monat-Tag Multiselect -->
                    <div class="multiselect-item">
                        <label>🌞 Jahr-Monat-Tag (YYYY-MM-DD)</label>
                        <div class="searchable-select" id="daySelect">
                            <div class="search-input" id="daySearchInput">Tage auswählen...</div>
                            <div class="dropdown-list" id="dayDropdown">
                                <div class="dropdown-search"><input type="text" id="daySearch" placeholder="Suchen..."></div>
                                <div id="dayOptions"></div>
                            </div>
                        </div>
                        <div id="selectedDays" class="selected-badges" style="margin-top: 8px;"></div>
                    </div>
                </div>
                <div class="filter-actions">
                    <button id="applyMultiselectFilter">Filter anwenden</button>
                    <button id="clearAllSelections" class="secondary">Alle Auswahl zurücksetzen</button>
                </div>
            </div>

            <!-- KPIs und Diagramme für gefilterte Daten -->
            <div class="kpi-row" id="filterKpis"></div>
            <div class="stats-grid">
                <div class="chart-card"><div class="chart-title">📈 Einnahmen / Ausgaben</div><canvas id="filterIncomeExpenseChart"></canvas></div>
                <div class="chart-card"><div class="chart-title">💰 Betrag vs. Offener Betrag</div><canvas id="filterAmountOpenChart"></canvas></div>
                <div class="chart-card"><div class="chart-title">🏦 Top Konten</div><canvas id="filterAccountChart"></canvas></div>
            </div>
            <div class="subnote">✅ Wählen Sie beliebig viele Jahre, Monate oder Tage. Die Filter wirken kombinierend (ODER innerhalb jeder Kategorie).</div>
        </div>

        <!-- Panel 2: Statistiken -->
        <div id="statsPane" class="tab-pane">
            <div class="kpi-row" id="statsKpis"></div>
            <canvas id="statsMainChart" style="max-height: 320px;"></canvas>
        </div>

        <!-- Panel 3: Transaktionsliste -->
        <div id="transactionsPane" class="tab-pane">
            <div class="table-wrapper"><table id="txListTable"><thead><tr><th>Datum</th><th>Betrag</th><th>Offen</th><th>Konto</th><th>Owner</th><th>Beschreibung</th></tr></thead><tbody id="txListBody"></tbody></table></div>
        </div>
    </div>
</div>

<script>
    // ---------- Globale Daten ----------
    let allTransactions = [];
    let filteredData = [];
    
    // State für Multiselect
    let selectedYears = new Set();
    let selectedMonths = new Set();
    let selectedDays = new Set();
    
    // verfügbare Optionen
    let availableYears = [];
    let availableMonths = [];
    let availableDays = [];
    
    // Chart Instanzen
    let filterIncomeChart, filterAmountChart, filterAccountChart, statsChart;

    // ---------- Webservice Fetch ----------
    async function fetchTransactions() {
        try {
            const res = await fetch('http://localhost:5000/transactions');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();
            allTransactions = data;
            allTransactions.forEach(t => {
                if (t.OFFENER_BETRAG === undefined) t.OFFENER_BETRAG = t.BETRAG || 0;
                if (t.BETRAG === undefined) t.BETRAG = 0;
                if (t.BUCHUNGSTAG) t.BUCHUNGSTAG = t.BUCHUNGSTAG.split('T')[0];
                if (!t.KTO_BEZEICHNUNG) t.KTO_BEZEICHNUNG = "Unbekannt";
                if (!t.OWNER1) t.OWNER1 = "Standard";
            });
        } catch (err) {
            console.warn("Webservice nicht verfügbar, Demo-Daten", err);
            allTransactions = generateDemoData();
        }
        extractAvailableOptions();
        renderDropdowns();
        applyMultiselectFilter(); // initial anwenden
    }

    function generateDemoData() {
        const demo = [];
        const owners = ["Alpha GmbH", "Beta KG"];
        const accounts = ["Girokonto", "Business", "Tagesgeld"];
        for (let i = 1; i <= 280; i++) {
            const year = 2022 + (i % 3);
            const month = 1 + (i % 12);
            const day = 1 + (i % 28);
            const dateStr = `${year}-${month.toString().padStart(2,'0')}-${day.toString().padStart(2,'0')}`;
            const amount = (Math.random() * 1200 - 450).toFixed(2);
            const open = (amount * (0.2 + Math.random() * 0.8)).toFixed(2);
            demo.push({
                ID: i,
                BUCHUNGSTAG: dateStr,
                BETRAG: parseFloat(amount),
                OFFENER_BETRAG: parseFloat(open),
                BUCHUNGSTEXT: `Transaktion ${i}`,
                KTO_BEZEICHNUNG: accounts[i % accounts.length],
                OWNER1: owners[i % owners.length],
                BANK: "Demo"
            });
        }
        return demo;
    }

    // Extrahiere alle verfügbaren Jahre, Monate, Tage aus Transaktionen
    function extractAvailableOptions() {
        const yearsSet = new Set();
        const monthsSet = new Set();
        const daysSet = new Set();
        allTransactions.forEach(t => {
            if (t.BUCHUNGSTAG) {
                const year = t.BUCHUNGSTAG.slice(0,4);
                const yearMonth = t.BUCHUNGSTAG.slice(0,7);
                const fullDate = t.BUCHUNGSTAG;
                yearsSet.add(year);
                monthsSet.add(yearMonth);
                daysSet.add(fullDate);
            }
        });
        availableYears = Array.from(yearsSet).sort((a,b)=>b-a);
        availableMonths = Array.from(monthsSet).sort().reverse();
        availableDays = Array.from(daysSet).sort().reverse();
    }

    // Rendering der Dropdowns mit Suchfunktion
    function renderDropdowns() {
        renderYearDropdown();
        renderMonthDropdown();
        renderDayDropdown();
        updateBadges();
    }

    function renderYearDropdown() {
        const container = document.getElementById('yearOptions');
        container.innerHTML = availableYears.map(year => `
            <div class="dropdown-option" data-value="${year}">
                <input type="checkbox" value="${year}" ${selectedYears.has(year) ? 'checked' : ''}> ${year}
            </div>
        `).join('');
        attachDropdownEvents('yearOptions', selectedYears, updateYears, renderYearDropdown);
        document.getElementById('yearSearch').addEventListener('input', (e) => filterDropdown('yearOptions', e.target.value));
    }

    function renderMonthDropdown() {
        const container = document.getElementById('monthOptions');
        container.innerHTML = availableMonths.map(month => `
            <div class="dropdown-option" data-value="${month}">
                <input type="checkbox" value="${month}" ${selectedMonths.has(month) ? 'checked' : ''}> ${month}
            </div>
        `).join('');
        attachDropdownEvents('monthOptions', selectedMonths, updateMonths, renderMonthDropdown);
        document.getElementById('monthSearch').addEventListener('input', (e) => filterDropdown('monthOptions', e.target.value));
    }

    function renderDayDropdown() {
        const container = document.getElementById('dayOptions');
        container.innerHTML = availableDays.slice(0, 200).map(day => `
            <div class="dropdown-option" data-value="${day}">
                <input type="checkbox" value="${day}" ${selectedDays.has(day) ? 'checked' : ''}> ${day}
            </div>
        `).join('');
        attachDropdownEvents('dayOptions', selectedDays, updateDays, renderDayDropdown);
        document.getElementById('daySearch').addEventListener('input', (e) => filterDropdown('dayOptions', e.target.value));
    }

    function attachDropdownEvents(containerId, selectedSet, updateFunc, rerenderFunc) {
        const container = document.getElementById(containerId);
        if (!container) return;
        container.querySelectorAll('.dropdown-option').forEach(opt => {
            const cb = opt.querySelector('input');
            const val = opt.getAttribute('data-value');
            cb.addEventListener('change', (e) => {
                if (cb.checked) selectedSet.add(val);
                else selectedSet.delete(val);
                updateFunc();
                rerenderFunc();
                updateBadges();
            });
        });
    }

    function filterDropdown(containerId, searchTerm) {
        const container = document.getElementById(containerId);
        const options = container.querySelectorAll('.dropdown-option');
        options.forEach(opt => {
            const text = opt.innerText.toLowerCase();
            opt.style.display = text.includes(searchTerm.toLowerCase()) ? 'flex' : 'none';
        });
    }

    function updateYears() { /* state bereits geändert */ }
    function updateMonths() { }
    function updateDays() { }

    function updateBadges() {
        const yearsDiv = document.getElementById('selectedYears');
        yearsDiv.innerHTML = Array.from(selectedYears).map(y => `<span class="selected-badge">${y} <span class="remove-badge" data-type="year" data-val="${y}">✖</span></span>`).join('');
        const monthsDiv = document.getElementById('selectedMonths');
        monthsDiv.innerHTML = Array.from(selectedMonths).map(m => `<span class="selected-badge">${m} <span class="remove-badge" data-type="month" data-val="${m}">✖</span></span>`).join('');
        const daysDiv = document.getElementById('selectedDays');
        daysDiv.innerHTML = Array.from(selectedDays).map(d => `<span class="selected-badge">${d} <span class="remove-badge" data-type="day" data-val="${d}">✖</span></span>`).join('');
        
        document.querySelectorAll('.remove-badge').forEach(el => {
            el.addEventListener('click', (e) => {
                const type = el.getAttribute('data-type');
                const val = el.getAttribute('data-val');
                if (type === 'year') { selectedYears.delete(val); renderYearDropdown(); }
                if (type === 'month') { selectedMonths.delete(val); renderMonthDropdown(); }
                if (type === 'day') { selectedDays.delete(val); renderDayDropdown(); }
                updateBadges();
                applyMultiselectFilter();
            });
        });
    }

    // Multiselect Filter Logik (Jahr ODER Monat ODER Tag)
    function applyMultiselectFilter() {
        let filtered = [...allTransactions];
        if (selectedYears.size > 0) {
            filtered = filtered.filter(t => t.BUCHUNGSTAG && selectedYears.has(t.BUCHUNGSTAG.slice(0,4)));
        }
        if (selectedMonths.size > 0) {
            filtered = filtered.filter(t => t.BUCHUNGSTAG && selectedMonths.has(t.BUCHUNGSTAG.slice(0,7)));
        }
        if (selectedDays.size > 0) {
            filtered = filtered.filter(t => t.BUCHUNGSTAG && selectedDays.has(t.BUCHUNGSTAG));
        }
        filteredData = filtered;
        renderFilterStatistics();
        renderTransactionList();
        renderStatsTab();
    }

    function renderFilterStatistics() {
        const totalSum = filteredData.reduce((s,t)=>s+(t.BETRAG||0),0);
        const totalOpen = filteredData.reduce((s,t)=>s+(t.OFFENER_BETRAG||0),0);
        const income = filteredData.reduce((s,t)=>s+(t.BETRAG>0?t.BETRAG:0),0);
        const expense = filteredData.reduce((s,t)=>s+(t.BETRAG<0?Math.abs(t.BETRAG):0),0);
        const net = income - expense;
        document.getElementById('filterKpis').innerHTML = `
            <div class="kpi-card"><div class="kpi-label">Summe Betrag</div><div class="kpi-value">${totalSum.toFixed(2)} €</div></div>
            <div class="kpi-card"><div class="kpi-label">Offener Betrag</div><div class="kpi-value">${totalOpen.toFixed(2)} €</div></div>
            <div class="kpi-card"><div class="kpi-label positive">Einnahmen</div><div class="kpi-value positive">${income.toFixed(2)} €</div></div>
            <div class="kpi-card"><div class="kpi-label negative">Ausgaben</div><div class="kpi-value negative">${expense.toFixed(2)} €</div></div>
            <div class="kpi-card"><div class="kpi-label">Differenz</div><div class="kpi-value ${net>=0?'positive':'negative'}">${net.toFixed(2)} €</div></div>
        `;
        
        // Diagramme
        if (filterIncomeChart) filterIncomeChart.destroy();
        const ctx1 = document.getElementById('filterIncomeExpenseChart').getContext('2d');
        filterIncomeChart = new Chart(ctx1, { type: 'bar', data: { labels: ['Einnahmen', 'Ausgaben'], datasets: [{ data: [income, expense], backgroundColor: ['#2b7e3a','#c2410c'] }] } });
        
        if (filterAmountChart) filterAmountChart.destroy();
        const ctx2 = document.getElementById('filterAmountOpenChart').getContext('2d');
        filterAmountChart = new Chart(ctx2, { type: 'bar', data: { labels: ['Summe Betrag', 'Offener Betrag'], datasets: [{ data: [totalSum, totalOpen], backgroundColor: ['#1f4fcf','#f4a261'] }] } });
        
        // Top Konten
        const accountMap = new Map();
        filteredData.forEach(t => {
            const acc = t.KTO_BEZEICHNUNG;
            accountMap.set(acc, (accountMap.get(acc) || 0) + (t.BETRAG||0));
        });
        const sortedAcc = Array.from(accountMap.entries()).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,5);
        if (filterAccountChart) filterAccountChart.destroy();
        const ctx3 = document.getElementById('filterAccountChart').getContext('2d');
        filterAccountChart = new Chart(ctx3, { type: 'bar', data: { labels: sortedAcc.map(a=>a[0]), datasets: [{ label: 'Summe Betrag', data: sortedAcc.map(a=>a[1]), backgroundColor: '#1f4fcf' }] } });
    }

    function renderTransactionList() {
        const tbody = document.getElementById('txListBody');
        tbody.innerHTML = filteredData.slice(0, 200).map(t => `
            <tr>
                <td>${t.BUCHUNGSTAG || ''}</td>
                <td class="${t.BETRAG<0?'negative':'positive'}">${(t.BETRAG||0).toFixed(2)} €</td>
                <td>${(t.OFFENER_BETRAG||0).toFixed(2)} €</td>
                <td>${t.KTO_BEZEICHNUNG || ''}</td>
                <td>${t.OWNER1 || ''}</td>
                <td>${t.BUCHUNGSTEXT || ''}</td>
            </tr>
        `).join('');
    }

    function renderStatsTab() {
        const income = filteredData.reduce((s,t)=>s+(t.BETRAG>0?t.BETRAG:0),0);
        const expense = filteredData.reduce((s,t)=>s+(t.BETRAG<0?Math.abs(t.BETRAG):0),0);
        const sum = filteredData.reduce((s,t)=>s+(t.BETRAG||0),0);
        const open = filteredData.reduce((s,t)=>s+(t.OFFENER_BETRAG||0),0);
        document.getElementById('statsKpis').innerHTML = `
            <div class="kpi-card"><div class="kpi-label">Summe</div><div class="kpi-value">${sum.toFixed(2)} €</div></div>
            <div class="kpi-card"><div class="kpi-label">Offen</div><div class="kpi-value">${open.toFixed(2)} €</div></div>
            <div class="kpi-card"><div class="kpi-label positive">Einnahmen</div><div class="kpi-value positive">${income.toFixed(2)} €</div></div>
            <div class="kpi-card"><div class="kpi-label negative">Ausgaben</div><div class="kpi-value negative">${expense.toFixed(2)} €</div></div>
        `;
        if (statsChart) statsChart.destroy();
        const ctx = document.getElementById('statsMainChart').getContext('2d');
        statsChart = new Chart(ctx, { type: 'bar', data: { labels: ['Einnahmen', 'Ausgaben', 'Differenz'], datasets: [{ data: [income, expense, income-expense], backgroundColor: ['#2b7e3a','#c2410c','#1f4fcf'] }] } });
    }

    // Dropdown Toggle Logik
    function initDropdowns() {
        const yearSelectDiv = document.getElementById('yearSelect');
        const yearDropdown = document.getElementById('yearDropdown');
        const yearInput = document.getElementById('yearSearchInput');
        yearInput.addEventListener('click', (e) => { e.stopPropagation(); yearDropdown.classList.toggle('show'); });
        document.addEventListener('click', (e) => { if (!yearSelectDiv.contains(e.target)) yearDropdown.classList.remove('show'); });
        
        const monthSelectDiv = document.getElementById('monthSelect');
        const monthDropdown = document.getElementById('monthDropdown');
        const monthInput = document.getElementById('monthSearchInput');
        monthInput.addEventListener('click', (e) => { e.stopPropagation(); monthDropdown.classList.toggle('show'); });
        document.addEventListener('click', (e) => { if (!monthSelectDiv.contains(e.target)) monthDropdown.classList.remove('show'); });
        
        const daySelectDiv = document.getElementById('daySelect');
        const dayDropdown = document.getElementById('dayDropdown');
        const dayInput = document.getElementById('daySearchInput');
        dayInput.addEventListener('click', (e) => { e.stopPropagation(); dayDropdown.classList.toggle('show'); });
        document.addEventListener('click', (e) => { if (!daySelectDiv.contains(e.target)) dayDropdown.classList.remove('show'); });
    }

    // Reset aller Selektionen
    function clearAllSelections() {
        selectedYears.clear();
        selectedMonths.clear();
        selectedDays.clear();
        renderYearDropdown();
        renderMonthDropdown();
        renderDayDropdown();
        updateBadges();
        applyMultiselectFilter();
    }

    // Tabs
    function initTabs() {
        const btns = document.querySelectorAll('.tab-btn');
        const panes = document.querySelectorAll('.tab-pane');
        btns.forEach(btn => {
            btn.addEventListener('click', () => {
                const id = btn.getAttribute('data-tab');
                btns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                panes.forEach(p => p.classList.remove('active-pane'));
                document.getElementById(`${id}Pane`).classList.add('active-pane');
                if (id === 'stats') renderStatsTab();
                if (id === 'transactions') renderTransactionList();
            });
        });
    }

    document.getElementById('applyMultiselectFilter')?.addEventListener('click', applyMultiselectFilter);
    document.getElementById('clearAllSelections')?.addEventListener('click', clearAllSelections);
    
    fetchTransactions();
    initDropdowns();
    initTabs();
</script>
</body>
</html>
