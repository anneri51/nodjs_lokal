<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personennavigation mit PDF-Scroll</title>
    <script>
        let storedData = [];
        let currentIndex = 0;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    storedData = JSON.parse(e.target.result);
                    updatePerson(); // Erst nach dem Laden der Daten aktualisieren
                    console.log("Stored JSON:", storedData);
                } catch (error) {
                    console.error("Fehler beim JSON-Parsing:", error);
                }
            };
            reader.onerror = function() {
                console.error("Fehler beim Lesen der Datei");
            };
            reader.readAsText(file);
        });

        function updatePerson() {
            if (!storedData.length) return;

            const person = storedData[currentIndex];
            document.getElementById("profile-image").src = person.image;
            document.getElementById("pdf-viewer").src = person.pdf;
            document.getElementById("name").textContent = person.name;
            document.getElementById("age").textContent = person.age;
            document.getElementById("jobs").innerHTML = person.jobs.map(job => `<li>${job.title} (${job.subregion})</li>`).join("");
            document.getElementById("locations").innerHTML = person.locations.map(loc => `<li>${loc.city}, ${loc.region}</li>`).join("");
        }

function displayPersonList() {
    const listContainer = document.getElementById("person-list");
    listContainer.innerHTML = "";
    storedData.forEach((person, index) => {
        const listItem = document.createElement("li");
        listItem.innerHTML = `<button onclick="setPerson(${index})">${person.name}</button>`;
        listContainer.appendChild(listItem);
    });
}

function setPerson(index) {
    currentIndex = index;
    updatePerson();
}

        function nextPerson() {
            if (!storedData.length) return;
            currentIndex = (currentIndex + 1) % storedData.length;
            updatePerson();
        }

        function previousPerson() {
            if (!storedData.length) return;
            currentIndex = (currentIndex - 1 + storedData.length) % storedData.length;
            updatePerson();
        }
    </script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .pdf-container {
            width: 100%;
            height: 500px;
            overflow-y: scroll;
            border: 1px solid #ccc;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h2>Personennavigation</h2>
    <input type="file" id="fileInput" accept=".json">
  <button onclick="updatePerson()">Update List</button>
    <button onclick="previousPerson()">⟨ Vorherige</button>
    <button onclick="nextPerson()">Nächste ⟩</button>

<h3>Alle Personen</h3>
<ul id="person-list"></ul>

    <br>
    <img id="profile-image" src="" alt="Personenbild">
    <br>
    <div class="pdf-container">
        <iframe id="pdf-viewer" src="" title="PDF-Dokument"></iframe>
    </div>

    <table>
        <tr>
            <th>Name</th>
            <th>Alter</th>
            <th>Berufe</th>
            <th>Wohnorte</th>
        </tr>
        <tr>
            <td id="name"></td>
            <td id="age"></td>
            <td><ul id="jobs"></ul></td>
            <td><ul id="locations"></ul></td>
        </tr>
    </table>
</body>
</html>
