<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personennavigation</title>
    <script>
        let people = [];
        let currentIndex = 0;

        async function loadPeople() {
            const response = await fetch("file:///C:/Daten/eigene_Skripte/tool/personen.json");
            people = await response.json();
            updatePerson();
        }

        function updatePerson() {
            const person = people[currentIndex];
            document.getElementById("profile-image").src = person.image;
            document.getElementById("pdf-viewer").src = person.pdf;
            document.getElementById("name").textContent = person.name;
            document.getElementById("age").textContent = person.age;
            document.getElementById("jobs").innerHTML = person.jobs.map(job => `<li>${job.title} (${job.subregion})</li>`).join("");
            document.getElementById("locations").innerHTML = person.locations.map(loc => `<li>${loc.city}, ${loc.region}</li>`).join("");
        }

        function nextPerson() {
            currentIndex = (currentIndex + 1) % people.length;
            updatePerson();
        }

        function previousPerson() {
            currentIndex = (currentIndex - 1 + people.length) % people.length;
            updatePerson();
        }

        window.onload = loadPeople;
    </script>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .pdf-container {
            width: 100%;
            height: 500px;
            overflow-y: scroll;
            border: 1px solid #ccc;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <h2>Personennavigation</h2>
<button onclick="loadPeople()">Load</button>
    <button onclick="previousPerson()">⟨ Vorherige</button>
    <button onclick="nextPerson()">Nächste ⟩</button>

    <br>
    <img id="profile-image" src="" alt="Personenbild">
    <br>
    <div class="pdf-container">
        <iframe id="pdf-viewer" src="" title="PDF-Dokument"></iframe>
    </div>

    <table>
        <tr>
            <th>Name</th>
            <th>Alter</th>
            <th>Berufe</th>
            <th>Wohnorte</th>
        </tr>
        <tr>
            <td id="name"></td>
            <td id="age"></td>
            <td><ul id="jobs"></ul></td>
            <td><ul id="locations"></ul></td>
        </tr>
    </table>

</body>
</html>
