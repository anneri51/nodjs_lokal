<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belege Explorer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f5f5f5;
        }
        .header {
            background-color: #2c3e50;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .panel {
            height: 100%;
            overflow-y: auto;
            padding: 15px;
            background-color: white;
        }
        .left-panel {
            width: 30%;
            border-right: 1px solid #ddd;
        }
        .middle-panel {
            width: 40%;
            border-right: 1px solid #ddd;
        }
        .right-panel {
            width: 30%;
            display: flex;
            flex-direction: column;
        }
        .beleg-group {
            margin-bottom: 15px;
        }
        .group-header {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 4px;
            font-weight: bold;
        }
        .group-header:hover {
            background-color: #2980b9;
        }
        .group-count {
            background-color: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.9em;
        }
        .beleg-list {
            list-style-type: none;
            margin-top: 5px;
            padding-left: 0;
            display: none;
        }
        .beleg-group.expanded .beleg-list {
            display: block;
        }
        .beleg-item {
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .beleg-item:hover {
            background-color: #f8f9fa;
        }
        .beleg-item.active {
            background-color: #e3f2fd;
            font-weight: bold;
        }
        .beleg-id {
            font-weight: bold;
            color: #2c3e50;
        }
        .beleg-page {
            color: #7f8c8d;
        }
        .beleg-details {
            margin-top: 20px;
        }
        .detail-header {
            font-size: 1.5em;
            margin-bottom: 15px;
            color: #2c3e50;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }
        .detail-row {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        .detail-label {
            font-weight: bold;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
        .detail-value {
            font-size: 1.1em;
        }
        .images-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        .image-item {
            width: 100%;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 10px;
            background-color: #f9f9f9;
        }
        .image-item img {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            margin-bottom: 10px;
            border: 1px solid #eee;
        }
        .image-info {
            font-size: 13px;
            color: #555;
        }
        .image-info div {
            margin-bottom: 5px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        .error {
            color: #e74c3c;
            padding: 10px;
            background-color: #fadbd8;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .search-container {
            margin-bottom: 15px;
            position: relative;
        }
        #searchInput {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        .toggle-all {
            background-color: #f1f1f1;
            color: #333;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 0.9em;
        }
        .toggle-all:hover {
            background-color: #e1e1e1;
        }
        .image-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #2c3e50;
        }
        .loading-images {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .no-images {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
        .images-status {
            margin-bottom: 10px;
            font-size: 0.9em;
        }
        .images-status.loading {
            color: #3498db;
        }
        .images-status.success {
            color: #27ae60;
        }
        .images-status.error {
            color: #e74c3c;
        }
        .broken-image {
            background-color: #f8d7da;
            color: #721c24;
            padding: 20px;
            text-align: center;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Belege Explorer</h1>
    </div>
    
    <div class="container">
        <div class="panel left-panel">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search belege...">
            </div>
            <div id="belegeList">
                <div class="loading">Loading belege...</div>
            </div>
            <button class="toggle-all" onclick="toggleAllGroups()">Toggle All Groups</button>
        </div>
        
        <div class="panel middle-panel">
            <div id="belegDetails">
                <div class="loading">Select a beleg to view details</div>
            </div>
        </div>
        
        <div class="panel right-panel">
            <div class="images-status" id="imagesStatus"></div>
            <div id="belegImages">
                <div class="no-images">Select a beleg to view images</div>
            </div>
            <button class="toggle-all" id="refreshImagesBtn" onclick="refreshImages()">Refresh Images</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('searchInput');
            const belegeListDiv = document.getElementById('belegeList');
            const belegDetailsDiv = document.getElementById('belegDetails');
            const belegImagesDiv = document.getElementById('belegImages');
            const imagesStatusElement = document.getElementById('imagesStatus');
            const refreshImagesBtn = document.getElementById('refreshImagesBtn');
            
            let allBelege = [];
            let currentBelegId = null;
            let blobUrls = []; // To store blob URLs for cleanup
            
            // Fetch all belege data
            fetchBelege();
            
            // Search functionality
            searchInput.addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                const belegItems = document.querySelectorAll('.beleg-item');
                
                belegItems.forEach(item => {
                    const belegText = item.textContent.toLowerCase();
                    if (belegText.includes(searchTerm)) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
                
                // Show/hide groups based on whether they have visible items
                const groups = document.querySelectorAll('.beleg-group');
                groups.forEach(group => {
                    const visibleItems = group.querySelectorAll('.beleg-item[style="display: flex"]').length;
                    if (visibleItems > 0 || searchTerm === '') {
                        group.style.display = 'block';
                    } else {
                        group.style.display = 'none';
                    }
                });
            });
            
            function fetchBelege() {
                fetch('http://localhost:5000/belege')
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(data => {
                        allBelege = data;
                        displayBelegeList(allBelege);
                    })
                    .catch(error => {
                        belegeListDiv.innerHTML = `
                            <div class="error">
                                Failed to load belege: ${error.message}
                            </div>
                            <button class="toggle-all" onclick="fetchBelege()">Retry</button>
                        `;
                        console.error('Error fetching belege:', error);
                    });
            }
            
            function displayBelegeList(belegeData) {
                if (!belegeData || belegeData.length === 0) {
                    belegeListDiv.innerHTML = '<div class="error">No belege found</div>';
                    return;
                }
                
                // Group belege by FK_MEDIA_BUCH_BUCH (or another relevant field)
                const groups = {};
                belegeData.forEach(beleg => {
                    const groupKey = beleg.FK_MEDIA_BUCH_BUCH || 'Other';
                    if (!groups[groupKey]) {
                        groups[groupKey] = [];
                    }
                    groups[groupKey].push(beleg);
                });
                
                // Create HTML for each group
                let html = '';
                for (const [groupName, groupBelege] of Object.entries(groups)) {
                    html += `
                        <div class="beleg-group">
                            <div class="group-header" onclick="toggleGroup(this.parentElement)">
                                <span>${groupName || 'No Group'}</span>
                                <span class="group-count">${groupBelege.length}</span>
                            </div>
                            <ul class="beleg-list">
                                ${groupBelege.map(beleg => `
                                    <li class="beleg-item" 
                                        data-id="${beleg.PK_INP_BELEGE_ALL}"
                                        onclick="loadBelegDetails(${beleg.PK_INP_BELEGE_ALL}, this)">
                                        <span class="beleg-id">${beleg.PK_INP_BELEGE_ALL}</span>
                                        <span class="beleg-page">${beleg.BELEGNUMMER || 'N/A'}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                    `;
                }
                
                belegeListDiv.innerHTML = html;
                
                // Expand the first group by default
                const firstGroup = document.querySelector('.beleg-group');
                if (firstGroup) {
                    firstGroup.classList.add('expanded');
                }
            }
            
            window.toggleGroup = function(groupElement) {
                groupElement.classList.toggle('expanded');
            };
            
            window.toggleAllGroups = function() {
                const groups = document.querySelectorAll('.beleg-group');
                const allExpanded = Array.from(groups).every(group => group.classList.contains('expanded'));
                
                groups.forEach(group => {
                    if (allExpanded) {
                        group.classList.remove('expanded');
                    } else {
                        group.classList.add('expanded');
                    }
                });
            };
            
            window.refreshImages = function() {
                if (currentBelegId) {
                    fetchDocumentImages();
                }
            };
            
            window.loadBelegDetails = function(belegId, element) {
                // Update active item styling
                document.querySelectorAll('.beleg-item').forEach(item => {
                    item.classList.remove('active');
                });
                if (element) {
                    element.classList.add('active');
                    // Scroll to the item
                    element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
                
                currentBelegId = belegId;
                
                // Load beleg details
                fetch(`http://localhost:5000/beleg/${belegId}`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Network response was not ok');
                        }
                        return response.json();
                    })
                    .then(belegData => {
                        displayBelegDetails(belegData);
                    })
                    .catch(error => {
                        belegDetailsDiv.innerHTML = `
                            <div class="error">
                                Failed to load beleg details: ${error.message}
                            </div>
                        `;
                        console.error('Error fetching beleg details:', error);
                    });
                
                // Load beleg images
                fetchDocumentImages();
            };
            
            function displayBelegDetails(belegData) {
                if (!belegData) {
                    belegDetailsDiv.innerHTML = '<div class="error">No details available</div>';
                    return;
                }
                
                let html = `
                    <div class="detail-header">
                        Beleg ${belegData.PK_INP_BELEGE_ALL || ''}
                    </div>
                    <div class="beleg-details">
                        <div class="detail-row">
                            <div class="detail-label">BELEGNUMMER</div>
                            <div class="detail-value">${belegData.BELEGNUMMER || 'N/A'}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">BEZEICHNUNG</div>
                            <div class="detail-value">${belegData.BEZEICHNUNG || 'N/A'}</div>
                        </div>
                        <div class="detail-row">
                            <div class="detail-label">PK_INP_BELEGE_ALL</div>
                            <div class="detail-value">${belegData.PK_INP_BELEGE_ALL || 'N/A'}</div>
                        </div>
                `;
                
                // Add other important fields
                const importantFields = ['FK_MEDIA_BUCH_BUCH', 'BUCH_JAHR', 'BUCH_BAND'];
                importantFields.forEach(field => {
                    if (belegData[field] !== undefined) {
                        html += `
                            <div class="detail-row">
                                <div class="detail-label">${field}</div>
                                <div class="detail-value">${belegData[field] !== null ? belegData[field] : 'N/A'}</div>
                            </div>
                        `;
                    }
                });
                
                html += `</div>`;
                belegDetailsDiv.innerHTML = html;
            }
            
            async function fetchDocumentImages() {
                if (!currentBelegId) {
                    belegImagesDiv.innerHTML = '<div class="no-images">Select a beleg to view images</div>';
                    return;
                }

                try {
                    imagesStatusElement.textContent = "Loading images...";
                    imagesStatusElement.className = "images-status loading";
                    belegImagesDiv.innerHTML = '<div class="loading-images"><div class="spinner"></div><p>Loading images...</p></div>';
                    refreshImagesBtn.disabled = true;

                    // Clean up previous blob URLs to prevent memory leaks
                    cleanupBlobUrls();

                    // Fetch the list of images for this beleg
                    const response = await fetch(`http://localhost:5000/beleg/bild/${currentBelegId}`);
                    
                    if (!response.ok) {
                        throw new Error(`Server returned ${response.status}`);
                    }
                    
                    const images = await response.json();
                    
                    if (!Array.isArray(images)) {
                        throw new Error('Invalid response format - expected array');
                    }

                    displayDocumentImages(images);
                    imagesStatusElement.textContent = `Found ${images.length} images`;
                    imagesStatusElement.className = "images-status success";

                } catch (error) {
                    console.error('Error fetching document images:', error);
                    imagesStatusElement.textContent = `Error: ${error.message}`;
                    imagesStatusElement.className = "images-status error";
                    belegImagesDiv.innerHTML = '<div class="error">Error loading images</div>';
                } finally {
                    refreshImagesBtn.disabled = false;
                }
            }
            
            function displayDocumentImages(images) {
                if (images.length === 0) {
                    belegImagesDiv.innerHTML = '<div class="no-images">No images found for this beleg</div>';
                    return;
                }
                
                let html = `
                    <div class="images-container">
                `;
                
                images.forEach((image, index) => {
                    let imageUrl;
                    let imageError = false;
                    let fallbackUrl = `http://localhost:5000/images/${image.filename || image.PK_IMAGE_ID}`;
                    
                    if (image.FILECONTENT) {
                        try {
                            // Remove potential data URL prefix if present
                            const base64Data = image.FILECONTENT.startsWith('data:') 
                                ? image.FILECONTENT.split(',')[1] 
                                : image.FILECONTENT;
                            
                            // Check if it looks like Base64
                            if (!/^[A-Za-z0-9+/]+={0,2}$/.test(base64Data)) {
                                throw new Error('Invalid Base64 data');
                            }
                            
                            const contentType = image.filetype || 'image/jpeg';
                            const blob = base64ToBlob(base64Data, contentType);
                            if (blob) {
                                imageUrl = URL.createObjectURL(blob);
                                blobUrls.push(imageUrl); // Store for cleanup
                            } else {
                                throw new Error('Failed to create blob');
                            }
                        } catch (error) {
                            console.error('Error processing Base64 image:', error);
                            imageError = true;
                            imageUrl = fallbackUrl;
                        }
                    } else {
                        imageUrl = fallbackUrl;
                    }
                    
                    html += `
                        <div class="image-item">
                            <div class="image-title">Image ${index + 1}</div>
                            ${imageError ? `
                                <div class="broken-image">
                                    Could not process embedded image<br>
                                    Using fallback URL instead
                                </div>
                            ` : ''}
                            <img src="${imageUrl}" 
                                 alt="Image for Beleg ${currentBelegId}"
                                 onerror="this.onerror=null;this.parentElement.innerHTML+='<div class=\\'broken-image\\'>Failed to load image</div>'">
                            <div class="image-info">
                                <div><strong>Filename:</strong> ${image.filename || 'N/A'}</div>
                                <div><strong>Type:</strong> ${image.filetype || 'N/A'}</div>
                                <div><strong>Size:</strong> ${image.filesize ? formatFileSize(image.filesize) : 'N/A'}</div>
                                ${image.Klassifikation_1 ? `<div><strong>Classification:</strong> ${image.Klassifikation_1}</div>` : ''}
                                ${image.PK_IMAGE_ID ? `<div><strong>Image ID:</strong> ${image.PK_IMAGE_ID}</div>` : ''}
                            </div>
                        </div>
                    `;
                });
                
                html += `</div>`;
                belegImagesDiv.innerHTML = html;
            }
            
            function base64ToBlob(base64Data, contentType = '') {
                try {
                    const byteCharacters = atob(base64Data);
                    const byteArrays = [];
                    
                    for (let offset = 0; offset < byteCharacters.length; offset += 512) {
                        const slice = byteCharacters.slice(offset, offset + 512);
                        const byteNumbers = new Array(slice.length);
                        
                        for (let i = 0; i < slice.length; i++) {
                            byteNumbers[i] = slice.charCodeAt(i);
                        }
                        
                        byteArrays.push(new Uint8Array(byteNumbers));
                    }
                    
                    return new Blob(byteArrays, { type: contentType });
                } catch (error) {
                    console.error('Error decoding Base64:', error);
                    return null;
                }
            }
            
            function cleanupBlobUrls() {
                blobUrls.forEach(url => URL.revokeObjectURL(url));
                blobUrls = [];
            }
            
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        });
    </script>
</body>
</html>
