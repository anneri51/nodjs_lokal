<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kandidaten-Dashboard · nach Wahl & Partei</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 24px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 20px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a5b4fc, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .endpoint-badge {
            background: #1e293b;
            color: #94a3b8;
            font-size: 0.9rem;
            padding: 6px 16px;
            border-radius: 40px;
            font-family: monospace;
            border: 1px solid #334155;
        }

        /* Status / Ladebereich */
        .status-bar {
            background: #1e293b;
            border-radius: 60px;
            padding: 16px 28px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 28px;
            flex-wrap: wrap;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px -8px #00000055;
        }
        .load-btn {
            background: #3b82f6;
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            box-shadow: 0 8px 16px -6px #1e3a8a;
        }
        .load-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        .connection-status {
            background: #2d3748;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid #4a5568;
        }
        .connection-status.connected { background: #065f46; border-color: #10b981; }
        .stats {
            display: flex;
            gap: 24px;
            margin-left: auto;
        }
        .stat-item {
            background: #2d3748;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        /* Filterbereich */
        .filter-section {
            background: #1e293b;
            border-radius: 30px;
            padding: 20px 28px;
            margin-bottom: 32px;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 28px;
            border: 1px solid #334155;
        }
        .filter-group {
            min-width: 200px;
            flex: 1;
        }
        .filter-group label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .filter-group select, .filter-group input {
            width: 100%;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 12px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
        }
        .reset-btn {
            background: #475569;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            height: fit-content;
        }
        .reset-btn:hover { background: #64748b; }

        /* Dashboard Grid - Karten für Parteien */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 24px;
            margin-top: 24px;
        }

        /* Partei-Karte */
        .partei-card {
            background: #1e293b;
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: 0.2s;
            box-shadow: 0 15px 30px -15px #000000aa;
        }
        .partei-card:hover {
            border-color: #4f5b73;
            transform: translateY(-3px);
        }
        .partei-header {
            background: linear-gradient(145deg, #2d3b4f, #1f2a3a);
            padding: 16px 20px;
            border-bottom: 2px solid #3b4b64;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .partei-name {
            font-size: 1.3rem;
            font-weight: 600;
            color: #cbd5e1;
        }
        .partei-id {
            background: #2563eb;
            color: white;
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .partei-body {
            padding: 16px;
        }
        .kandidaten-liste {
            max-height: 280px;
            overflow-y: auto;
        }
        .kandidat-item {
            background: #0f172a;
            border-radius: 20px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-left: 4px solid #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .kandidat-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .kandidat-name {
            font-weight: 600;
            color: #f1f5f9;
        }
        .kandidat-details {
            font-size: 0.8rem;
            color: #94a3b8;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .kandidat-detail-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .kandidat-badge {
            background: #2d3748;
            padding: 2px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            color: #cbd5e1;
        }
        .empty-partei {
            padding: 24px;
            text-align: center;
            color: #64748b;
            font-style: italic;
        }

        /* Tooltip / kleine Helfer */
        .tag {
            background: #374151;
            color: #d1d5db;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
        }

        /* Responsive */
        @media (max-width: 700px) {
            .filter-section { flex-direction: column; align-items: stretch; }
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid #ffffff33;
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                🗳️ Kandidaten-Dashboard
                <span class="endpoint-badge">GET /wahl_kand/1/</span>
            </h1>
            <div class="connection-status" id="connectionStatus">🔌 Verbindung prüfen…</div>
        </div>

        <!-- Statusleiste mit Ladebutton und Statistiken -->
        <div class="status-bar">
            <button class="load-btn" onclick="loadKandidaten()" id="loadBtn">
                <span>📥</span> Kandidaten laden
            </button>
            <div class="stats">
                <span class="stat-item" id="kandidatenCount">0 Kandidaten</span>
                <span class="stat-item" id="parteienCount">0 Parteien</span>
                <span class="stat-item" id="wahlCount">0 Wahlen</span>
            </div>
        </div>

        <!-- Filterbereich: nach FK_WAHL_WAHL und FK_WAHL_PARTEI (optional) -->
        <div class="filter-section">
            <div class="filter-group">
                <label>📋 Filter nach Wahl (FK_WAHL_WAHL)</label>
                <select id="wahlFilter" onchange="applyFilters()">
                    <option value="">Alle Wahlen</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🏛️ Filter nach Partei (FK_WAHL_PARTEI)</label>
                <select id="parteiFilter" onchange="applyFilters()">
                    <option value="">Alle Parteien</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🔍 Suche in Personen (Name/Ort)</label>
                <input type="text" id="searchInput" placeholder="Name oder Ort..." onkeyup="applyFilters()">
            </div>
            <button class="reset-btn" onclick="resetFilters()">⟲ Zurücksetzen</button>
        </div>

        <!-- Dashboard: Karten nach Parteien gruppiert -->
        <div id="dashboardContainer" class="dashboard-grid">
            <div style="grid-column:1/-1; text-align:center; padding:60px; color:#64748b;">
                ⬆️ Klicke auf "Kandidaten laden", um die Daten anzuzeigen
            </div>
        </div>
    </div>

    <script>
        (function() {
            const WS_BASE = 'http://localhost:5000';
            
            // Globale Daten
            let allKandidaten = [];           // alle geladenen Kandidaten
            let filteredKandidaten = [];       // nach Filter gefilterte Kandidaten
            
            // Für Filter-Optionen
            let uniqueWahlen = new Set();
            let uniqueParteien = new Set();
            
            // UI Elemente
            const dashboard = document.getElementById('dashboardContainer');
            const wahlFilter = document.getElementById('wahlFilter');
            const parteiFilter = document.getElementById('parteiFilter');
            const searchInput = document.getElementById('searchInput');
            const kandidatenCountSpan = document.getElementById('kandidatenCount');
            const parteienCountSpan = document.getElementById('parteienCount');
            const wahlCountSpan = document.getElementById('wahlCount');
            const connectionSpan = document.getElementById('connectionStatus');
            const loadBtn = document.getElementById('loadBtn');

            // ----- Helper -----
            function showLoading(loading) {
                if (loading) {
                    loadBtn.innerHTML = '<span class="spinner"></span> Lade…';
                    loadBtn.disabled = true;
                } else {
                    loadBtn.innerHTML = '<span>📥</span> Kandidaten laden';
                    loadBtn.disabled = false;
                }
            }

            function escapeHtml(text) {
                if (!text) return '';
                return String(text).replace(/[&<>"]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    if (m === '"') return '&quot;';
                    return m;
                });
            }

            // ----- Verbindung testen -----
            async function testConnection() {
                try {
                    const r = await fetch(`${WS_BASE}/wahl_kand/1/`, { method: 'HEAD' });
                    if (r.ok) {
                        connectionSpan.innerHTML = '✅ Verbunden mit localhost:5000';
                        connectionSpan.classList.add('connected');
                        return true;
                    }
                    throw new Error();
                } catch {
                    connectionSpan.innerHTML = '❌ Server nicht erreichbar';
                    connectionSpan.classList.remove('connected');
                    return false;
                }
            }

            // ----- Hauptfunktion: Kandidaten laden -----
            window.loadKandidaten = async function() {
                showLoading(true);
                try {
                    const res = await fetch(`${WS_BASE}/wahl_kand/1/`);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    
                    const data = await res.json();
                    console.log('Geladene Kandidaten:', data);
                    
                    // Daten speichern
                    allKandidaten = Array.isArray(data) ? data : [];
                    
                    // Extrahiere unique Wahlen und Parteien für Filter
                    uniqueWahlen.clear();
                    uniqueParteien.clear();
                    
                    allKandidaten.forEach(k => {
                        if (k.FK_WAHL_WAHL) uniqueWahlen.add(k.FK_WAHL_WAHL);
                        if (k.FK_WAHL_PARTEI) uniqueParteien.add(k.FK_WAHL_PARTEI);
                    });
                    
                    // Filter-Dropdowns befüllen
                    populateFilters();
                    
                    // Gefilterte Liste initial = alle
                    filteredKandidaten = [...allKandidaten];
                    
                    // Dashboard rendern
                    renderDashboard();
                    
                    // Statistiken
                    updateStats();
                    
                } catch (err) {
                    console.error('Fehler:', err);
                    dashboard.innerHTML = `<div style="grid-column:1/-1; background:#2d1a1a; padding:40px; border-radius:30px; text-align:center; color:#f87171;">Fehler beim Laden: ${err.message}</div>`;
                } finally {
                    showLoading(false);
                }
            };

            // ----- Filter-Dropdowns füllen -----
            function populateFilters() {
                // Wahl-Filter
                wahlFilter.innerHTML = '<option value="">Alle Wahlen</option>';
                const sortedWahlen = Array.from(uniqueWahlen).sort((a,b) => a - b);
                sortedWahlen.forEach(w => {
                    const opt = document.createElement('option');
                    opt.value = w;
                    opt.textContent = `Wahl ${w}`;
                    wahlFilter.appendChild(opt);
                });
                
                // Parteien-Filter
                parteiFilter.innerHTML = '<option value="">Alle Parteien</option>';
                const sortedParteien = Array.from(uniqueParteien).sort((a,b) => a - b);
                sortedParteien.forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p;
                    opt.textContent = `Partei ${p}`;
                    parteiFilter.appendChild(opt);
                });
            }

            // ----- Filter anwenden -----
            window.applyFilters = function() {
                const wahlValue = wahlFilter.value;
                const parteiValue = parteiFilter.value;
                const searchText = searchInput.value.toLowerCase().trim();
                
                filteredKandidaten = allKandidaten.filter(k => {
                    // Filter nach FK_WAHL_WAHL
                    if (wahlValue && String(k.FK_WAHL_WAHL) !== String(wahlValue)) return false;
                    
                    // Filter nach FK_WAHL_PARTEI
                    if (parteiValue && String(k.FK_WAHL_PARTEI) !== String(parteiValue)) return false;
                    
                    // Textsuche in Personen-Feldern (Vorname, Nachname, Ort, Beruf)
                    if (searchText) {
                        const vorname = (k.VORNAME || '').toLowerCase();
                        const nachname = (k.NACHNAME || '').toLowerCase();
                        const ort = (k.ORT || '').toLowerCase();
                        const beruf = (k.BERUF || '').toLowerCase();
                        const suchString = vorname + ' ' + nachname + ' ' + ort + ' ' + beruf;
                        if (!suchString.includes(searchText)) return false;
                    }
                    
                    return true;
                });
                
                renderDashboard();
                updateStats();
            };

            window.resetFilters = function() {
                wahlFilter.value = '';
                parteiFilter.value = '';
                searchInput.value = '';
                filteredKandidaten = [...allKandidaten];
                renderDashboard();
                updateStats();
            };

            // ----- Dashboard rendern: Gruppierung nach FK_WAHL_PARTEI -----
            function renderDashboard() {
                if (!filteredKandidaten.length) {
                    dashboard.innerHTML = `<div style="grid-column:1/-1; background:#1e293b; padding:50px; border-radius:30px; text-align:center; color:#94a3b8;">
                        🕳️ Keine Kandidaten gefunden für diese Filter
                    </div>`;
                    return;
                }
                
                // Gruppierung nach Partei
                const groups = {};
                filteredKandidaten.forEach(k => {
                    const parteiId = k.FK_WAHL_PARTEI || 'keine Partei';
                    if (!groups[parteiId]) groups[parteiId] = [];
                    groups[parteiId].push(k);
                });
                
                // Sortierte Parteien-IDs (für konsistente Reihenfolge)
                const sortedParteien = Object.keys(groups).sort((a,b) => {
                    if (a === 'keine Partei') return 1;
                    if (b === 'keine Partei') return -1;
                    return Number(a) - Number(b);
                });
                
                let html = '';
                
                sortedParteien.forEach(parteiId => {
                    const kandidaten = groups[parteiId];
                    // Versuche, einen Namen für die Partei zu finden (aus ersten Kandidat? könnte später erweitert werden)
                    // In diesem Beispiel verwenden wir einfach "Partei {id}"
                    const parteiName = (parteiId === 'keine Partei') ? '⚪ Ohne Partei' : `🏛️ Partei ${parteiId}`;
                    
                    html += `
                        <div class="partei-card">
                            <div class="partei-header">
                                <span class="partei-name">${parteiName}</span>
                                <span class="partei-id">${kandidaten.length} Kandidat(en)</span>
                            </div>
                            <div class="partei-body">
                                <div class="kandidaten-liste">
                    `;
                    
                    // Kandidaten dieser Partei auflisten
                    kandidaten.forEach(k => {
                        const vorname = escapeHtml(k.VORNAME || '—');
                        const nachname = escapeHtml(k.NACHNAME || '—');
                        const ort = escapeHtml(k.ORT || '—');
                        const beruf = escapeHtml(k.BERUF || '—');
                        const wahl = k.FK_WAHL_WAHL || '?';
                        const platz = k.PLATZ !== null ? k.PLATZ : '—';
                        const geburtsjahr = k.GEBURTSJAHR || '—';
                        const personId = k.FK_KON_PERSON || '—';
                        
                        html += `
                            <div class="kandidat-item">
                                <div class="kandidat-info">
                                    <div class="kandidat-name">${vorname} ${nachname}</div>
                                    <div class="kandidat-details">
                                        <span class="kandidat-detail-item">📍 ${ort}</span>
                                        <span class="kandidat-detail-item">💼 ${beruf}</span>
                                        <span class="kandidat-detail-item">🎂 ${geburtsjahr}</span>
                                        <span class="kandidat-detail-item">🗳️ Wahl ${wahl}</span>
                                        <span class="kandidat-detail-item">🪑 Platz ${platz}</span>
                                    </div>
                                </div>
                                <div class="kandidat-badge">ID: ${k.PK_WAHL_KANDIDATEN || ''}</div>
                            </div>
                        `;
                    });
                    
                    html += `
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                dashboard.innerHTML = html;
            }

            // ----- Statistik-Updates -----
            function updateStats() {
                kandidatenCountSpan.innerText = `${filteredKandidaten.length} Kandidaten`;
                
                // Anzahl einzigartiger Parteien in gefilterter Liste
                const parteienInFilter = new Set(filteredKandidaten.map(k => k.FK_WAHL_PARTEI).filter(p => p));
                parteienCountSpan.innerText = `${parteienInFilter.size} Parteien`;
                
                // Anzahl einzigartiger Wahlen in gefilterter Liste
                const wahlenInFilter = new Set(filteredKandidaten.map(k => k.FK_WAHL_WAHL).filter(w => w));
                wahlCountSpan.innerText = `${wahlenInFilter.size} Wahlen`;
            }

            // ----- Initialisierung -----
            document.addEventListener('DOMContentLoaded', () => {
                testConnection();
                // Optional: Automatisch laden? Wir lassen den Button klicken
                // loadKandidaten(); // auskommentiert für manuelles Laden
            });
        })();
    </script>
</body>
</html>
