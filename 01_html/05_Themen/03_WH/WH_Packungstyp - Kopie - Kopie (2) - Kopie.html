<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verpackungstyp Übersicht</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        h1 {
            color: #333;
        }
        .search-container {
            margin: 20px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        #searchInput, #packungstypSearch, #currentIdInput {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #searchInput, #packungstypSearch {
            width: 300px;
        }
        #currentIdInput {
            width: 120px;
        }
        .navigation-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        .nav-button {
            padding: 8px 15px;
            background-color: #1E90FF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .nav-button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .go-to-button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
            cursor: pointer;
        }
        .std-name {
            background-color: #1E90FF;
            color: blue;
            font-weight: bold;
        }
        .hidden {
            display: none;
        }
        .std1-name {
            background-color: #1E90FF;
            color: green;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 18px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .highlight {
            background-color: yellow;
        }
        .selected-row {
            background-color: #d4edff !important;
        }
        
        /* Drawer styles */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: none;
        }
        
        .drawer {
            position: fixed;
            top: 0;
            right: -600px;
            width: 600px;
            height: 100%;
            background-color: white;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.1);
            z-index: 101;
            overflow-y: auto;
            transition: right 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .drawer-title {
            margin: 0;
            font-size: 1.5em;
        }
        
        .close-drawer {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
        }
        
        .detail-section {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        
        .detail-section h3 {
            margin-top: 0;
            color: #333;
        }
        
        .detail-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        .detail-table th, .detail-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        
        .detail-table th {
            background-color: #e6f2ff;
        }
        
        .detail-header {
            background-color: #e6f2ff;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .detail-tables-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .composite-group {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #f0f8ff;
            border-radius: 5px;
        }
        
        .composite-group h4 {
            margin-top: 0;
            color: #2a5885;
        }
        
        .loading-section {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .current-id-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }
        
        .current-id-label {
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .drawer {
                width: 90%;
                right: -90%;
            }
            .navigation-buttons {
                flex-wrap: wrap;
            }
            .current-id-container {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <h1>Verpackungstyp Übersicht</h1>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Suche in allen Feldern...">
        <input type="text" id="packungstypSearch" placeholder="Suche nach PACKUNGSTYP...">
    </div>
    <div class="navigation-buttons">
        <button id="prevButton" class="nav-button" disabled>&lt; Vorherige</button>
        <button id="nextButton" class="nav-button" disabled>Nächste &gt;</button>
        
        <div class="current-id-container">

            <span class="current-id-label">Aktuelle ID:</span>

<button id="prevButton1" class="nav-button" >&lt; Vorherige</button>
            <input type="text" id="currentIdInput" placeholder="ID eingeben">
 <button id="nextButton1" class="nav-button" >Nächste &gt;</button>
            <button id="goToButton" class="go-to-button">Gehe zu</button>
        </div>
    </div>
    <div id="loading" class="loading">Daten werden geladen...</div>
    <div id="error" class="error" style="display: none;"></div>
    <div id="table-container"></div>
    
    <!-- Drawer elements -->
    <div id="drawerOverlay" class="drawer-overlay"></div>
    <div id="drawer" class="drawer">
        <div class="drawer-header">
            <h2 class="drawer-title">Verpackungstyp Details</h2>
            <button class="close-drawer" id="closeDrawer">&times;</button>
        </div>
        <div id="detail-container"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            let allData = []; // Store all data for later use
            let currentIndex = 0; // Track current position for navigation
            let filteredData = []; // Store filtered data for navigation
            
            // Drawer elements
            const drawerOverlay = document.getElementById('drawerOverlay');
            const drawer = document.getElementById('drawer');
            const closeDrawerBtn = document.getElementById('closeDrawer');
            const prevButton = document.getElementById('prevButton');
            const nextButton = document.getElementById('nextButton');
            const currentIdInput = document.getElementById('currentIdInput');
            const goToButton = document.getElementById('goToButton');
            
            // Close drawer when overlay is clicked
            drawerOverlay.addEventListener('click', closeDrawer);
            
            // Close drawer when close button is clicked
            closeDrawerBtn.addEventListener('click', closeDrawer);

prevButton1.addEventListener('click',setPrev);
  function setPrev() {document.getElementById('currentIdInput').value = 
    Number(document.getElementById('currentIdInput').value) - 1; }
nextButton1.addEventListener('click',setNext);
  function setNext() {document.getElementById('currentIdInput').value = 
    Number(document.getElementById('currentIdInput').value) +1;}
            
            function closeDrawer() {
                drawer.style.right = '-600px';
                drawerOverlay.style.display = 'none';
                document.body.style.overflow = 'auto';
                
                // Remove selected class from all rows
                const rows = document.querySelectorAll('#table-container tbody tr');
                rows.forEach(row => row.classList.remove('selected-row'));
            }
            
            function openDrawer() {
                drawer.style.right = '0';
                drawerOverlay.style.display = 'block';
                document.body.style.overflow = 'hidden';
            }
            
            // Navigation functions
            function updateNavigationButtons() {
                prevButton.disabled = currentIndex <= 0;
                nextButton.disabled = currentIndex >= filteredData.length - 1;
                
                // Update current ID input if we have filtered data
                if (filteredData.length > 0 && currentIndex >= 0 && currentIndex < filteredData.length) {
                    currentIdInput.value = filteredData[currentIndex].PK_BAS_WH_PKG_PACKUNGSTYP;
                }
            }
            
            function navigateToIndex(index) {
                if (index >= 0 && index < filteredData.length) {
                    currentIndex = index;
                    updateNavigationButtons();
                    
                    // Find the row in the table that matches the current item
                    const currentItem = filteredData[currentIndex];
                    const rows = document.querySelectorAll('#table-container tbody tr');
                    
                    for (let i = 0; i < rows.length; i++) {
                        const rowIndex = parseInt(rows[i].dataset.index);
                        if (allData[rowIndex].PK_BAS_WH_PKG_PACKUNGSTYP === currentItem.PK_BAS_WH_PKG_PACKUNGSTYP) {
                            // Remove selected class from all rows
                            rows.forEach(row => row.classList.remove('selected-row'));
                            
                            // Add selected class to current row
                            rows[i].classList.add('selected-row');
                            
                            // Scroll to the row
                            rows[i].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                            
                            // Show details
                            showDetails(currentItem);
                            openDrawer();
                            break;
                        }
                    }
                }
            }
            
            function goToId(id) {
                // Find the index in filteredData that matches the ID
                const index = filteredData.findIndex(item => 
                    item.PK_BAS_WH_PKG_PACKUNGSTYP.toString() === id.toString()
                );
                
                if (index !== -1) {
                    navigateToIndex(index);
                } else {
                    alert('ID nicht in den gefilterten Daten gefunden');
                }
            }
            
            prevButton.addEventListener('click', function() {
                if (currentIndex > 0) {
                    navigateToIndex(currentIndex - 1);
                }
            });
            
            nextButton.addEventListener('click', function() {
                if (currentIndex < filteredData.length - 1) {
                    navigateToIndex(currentIndex + 1);
                }
            });
            
            goToButton.addEventListener('click', function() {
                const id = currentIdInput.value.trim();
                if (id) {
                    goToId(id);
                }
            });
            
            currentIdInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    const id = currentIdInput.value.trim();
                    if (id) {
                        goToId(id);
                    }
                }
            });
            
            fetch('http://localhost:5000/verpackungstyp')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Netzwerkantwort war nicht ok');
                    }
                    return response.json();
                })
                .then(data => {
                    allData = data; // Store all data
                    filteredData = [...data]; // Initialize filtered data
                    document.getElementById('loading').style.display = 'none';
                    
                    if (data.length === 0) {
                        document.getElementById('error').textContent = 'Keine Daten verfügbar';
                        document.getElementById('error').style.display = 'block';
                        return;
                    }

                    // Columns to hide
                    const hiddenColumns = [
                        'PK_BAS_WH_PKG_PACKUNGSTYP',
                        'PACKUNGSTYP',
                        'FOREIGN_CODE',
                        'FK_STD_PRIORITAET',
                        'COMM',
                        'STD1_NAME',
                        'STD2_NAME',
                        'STD3_NAME',
                        'STD4_NAME',
                        'STD5_NAME',
                        'STD6_NAME',
                        'STD7_NAME',
                        'STD8_NAME',
                        'STD9_NAME',
                        'STD10_NAME',
                        'STD11_NAME',
                        'STD12_NAME', 
                        'STD13_NAME',
                        'STD14_NAME',
                        'STD15_NAME',
                        'pkg2_pk_bas_wh_pkg_packungstyp',
                        'pkg2_packungstyp',
                        'DATUM_KLASSF_OK'
                    ];

                    // Create table
                    const table = document.createElement('table');
                    const thead = document.createElement('thead');
                    const tbody = document.createElement('tbody');
                    
                    // Create header row
                    const headerRow = document.createElement('tr');
                    
                    // Add all columns to header (only those not in hiddenColumns)
                    Object.keys(data[0]).forEach(key => {
                        if (hiddenColumns.includes(key)) {
                            const th = document.createElement('th');
                            th.textContent = key;
                            headerRow.appendChild(th);
                        }
                    });
                    
                    thead.appendChild(headerRow);
                    table.appendChild(thead);
                    
                    // Add data rows with index
                    data.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        tr.dataset.index = index; // Store index for later reference
                        
                        Object.entries(row).forEach(([key, value]) => {
                            // Skip hidden columns
                            if (!hiddenColumns.includes(key)) {
                                return;
                            }
                            
                            const td = document.createElement('td');
                            td.textContent = value !== null ? value : '';
                            
                            // Highlight STD_NAME columns (except STD4_NAME)
                            if ((key.startsWith('STD') && key.endsWith('_NAME') && !key.includes('STD4_NAME'))) {
                                if (value && value !== 'Keine Angabe') {
                                    td.classList.add('std-name');
                                }
                            }

                            // Special style for STD4_NAME
                            if (key.includes('STD4_NAME') || key.includes('DATUM_KLASSF_OK')) {
                                td.classList.add('std1-name');
                            }
                            
                            tr.appendChild(td);
                        });
                        
                        tbody.appendChild(tr);
                    });
                    
                    table.appendChild(tbody);
                    document.getElementById('table-container').appendChild(table);
                    
                    // Add click event to rows to show details
                    const rows = tbody.getElementsByTagName('tr');
                    for (let row of rows) {
                        row.addEventListener('click', function() {
                            // Remove selected class from all rows
                            for (let r of rows) {
                                r.classList.remove('selected-row');
                            }
                            // Add selected class to clicked row
                            this.classList.add('selected-row');
                            
                            // Get the data for this row
                            const rowIndex = parseInt(this.dataset.index);
                            const rowData = data[rowIndex];
                            
                            // Update currentIndex based on filteredData
                            currentIndex = filteredData.findIndex(item => 
                                item.PK_BAS_WH_PKG_PACKUNGSTYP === rowData.PK_BAS_WH_PKG_PACKUNGSTYP
                            );
                            updateNavigationButtons();
                            
                            showDetails(rowData);
                            openDrawer();
                        });
                    }
                    
                    // Add search functionality for general search
                    const searchInput = document.getElementById('searchInput');
                    searchInput.addEventListener('keyup', function() {
                        applyFilters();
                    });
                    
                    // Add search functionality for PACKUNGSTYP search
                    const packungstypSearch = document.getElementById('packungstypSearch');
                    packungstypSearch.addEventListener('keyup', function() {
                        applyFilters();
                    });
                    
                    function applyFilters() {
                        const generalSearchTerm = searchInput.value.toLowerCase();
                        const packungstypSearchTerm = packungstypSearch.value.toLowerCase();
                        
                        filteredData = allData.filter(item => {
                            // General search across all visible fields
                            const generalMatch = generalSearchTerm === '' || 
                                Object.entries(item).some(([key, value]) => {
                                    if (!hiddenColumns.includes(key)) return false;
                                    return value !== null && 
                                        value.toString().toLowerCase().includes(generalSearchTerm);
                                });
                            
                            // PACKUNGSTYP specific search
                            const packungstypMatch = packungstypSearchTerm === '' || 
                                (item.PACKUNGSTYP && 
                                 item.PACKUNGSTYP.toLowerCase().includes(packungstypSearchTerm));
                            
                            return generalMatch && packungstypMatch;
                        });
                        
                        // Update currentIndex if current item is no longer in filtered data
                        if (currentIndex >= filteredData.length) {
                            currentIndex = Math.max(0, filteredData.length - 1);
                        }
                        updateNavigationButtons();
                        
                        // Show/hide rows based on filters
                        const rows = tbody.getElementsByTagName('tr');
                        for (let row of rows) {
                            const rowIndex = parseInt(row.dataset.index);
                            const rowData = allData[rowIndex];
                            
                            // Check if this row should be visible
                            const isVisible = filteredData.some(item => 
                                item.PK_BAS_WH_PKG_PACKUNGSTYP === rowData.PK_BAS_WH_PKG_PACKUNGSTYP
                            );
                            
                            row.style.display = isVisible ? '' : 'none';
                            
                            // Remove previous highlights
                            const cells = row.getElementsByTagName('td');
                            for (let cell of cells) {
                                cell.innerHTML = cell.textContent;
                            }
                            
                            // Highlight general search matches
                            if (generalSearchTerm) {
                                for (let cell of cells) {
                                    const cellText = cell.textContent.toLowerCase();
                                    if (cellText.includes(generalSearchTerm)) {
                                        const regex = new RegExp(generalSearchTerm, 'gi');
                                        cell.innerHTML = cell.textContent.replace(regex, match => 
                                            `<span class="highlight">${match}</span>`);
                                    }
                                }
                            }
                        }
                    }
                    
                    // Enable navigation buttons
                    updateNavigationButtons();
                })
                .catch(error => {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').textContent = 'Fehler beim Laden der Daten: ' + error.message;
                    document.getElementById('error').style.display = 'block';
                    console.error('Fehler:', error);
                });
                
            function showDetails(rowData) {
                const detailContainer = document.getElementById('detail-container');
                detailContainer.innerHTML = '';
                
                // Create main header
                const header = document.createElement('div');
                header.className = 'detail-header';
                header.innerHTML = `
                    <h3>${rowData.PACKUNGSTYP}</h3>
                    <p id="idDetails"><strong>ID:</strong> ${rowData.PK_BAS_WH_PKG_PACKUNGSTYP}</p>
                    <p><strong>Fremdcode:</strong> ${rowData.FOREIGN_CODE || 'N/A'}</p>
                    <p><strong>Priorität:</strong> ${rowData.FK_STD_PRIORITAET || 'N/A'}</p>
                    <p><strong>OK Datum:</strong> <span style="color:green"> ${rowData.DATUM_KLASSF_OK} </span></p>
                `;

                detailContainer.appendChild(header);

                const imageContainer = document.createElement('div');
                imageContainer.className = 'image-container';
                detailContainer.appendChild(imageContainer);
                imageContainer.innerHTML += `<img id="serviceImage" alt="Image from service" style="max-width: 500px;">`;
               
                if (rowData.FILECONTENT && rowData.FILECONTENT.data) {
                    const byteArray = new Uint8Array(rowData.FILECONTENT.data);
                    const blob = new Blob([byteArray], {type: 'image/jpeg'});
                    const imageUrl = URL.createObjectURL(blob);
                    document.getElementById('serviceImage').src = imageUrl;
                }
                    
                // Container for all detail tables
                const tablesContainer = document.createElement('div');
                tablesContainer.className = 'detail-tables-container';
                detailContainer.appendChild(tablesContainer);
                
                // 1. Table for STD names (groups 28-40)
                const stdSection = document.createElement('div');
                stdSection.className = 'detail-section';
                stdSection.innerHTML = '<h3>STD Namen (Gruppen 28-40)</h3>';
                
                const stdTable = document.createElement('table');
                stdTable.className = 'detail-table';
                
                // Create STD table header
                const stdThead = document.createElement('thead');
                const stdHeaderRow = document.createElement('tr');
                ['Gruppe', 'STD Name', 'STD Wert'].forEach(text => {
                    const th = document.createElement('th');
                    th.textContent = text;
                    stdHeaderRow.appendChild(th);
                });
                stdThead.appendChild(stdHeaderRow);
                stdTable.appendChild(stdThead);
                
                // Create STD table body
                const stdTbody = document.createElement('tbody');
                
                // Add STD rows (28-40)
                for (let i = 1; i <= 15; i++) {
                    const stdKey = `STD${i}_NAME`;
                    const valueKey = `STD${i}_VALUE`;
                    const value = rowData[valueKey];
                    const name = rowData[stdKey];
                    
                    if (name && name !== 'Keine Angabe') {
                        const tr = document.createElement('tr');
                        
                        const groupTd = document.createElement('td');
                        groupTd.textContent = i + 27; // Groups start at 28
                        tr.appendChild(groupTd);
                        
                        const nameTd = document.createElement('td');
                        nameTd.innerHTML = value != 0 ? '<strong>' + name + '</strong>' : 'Keine Angabe';
                        tr.appendChild(nameTd);
                        
                        const valueTd = document.createElement('td');
                        valueTd.innerHTML = value != 0  ?  value : '';
                        tr.appendChild(valueTd);
                        
                        stdTbody.appendChild(tr);
                    }
                }
                
                stdTable.appendChild(stdTbody);
                stdSection.appendChild(stdTable);
                tablesContainer.appendChild(stdSection);
                
                // 2. Section for materials (filtered by current ID)
                const materialSection = document.createElement('div');
                materialSection.className = 'detail-section';
                materialSection.innerHTML = '<h3>Materialien (gefiltert nach ID)</h3>';
                materialSection.innerHTML += '<div class="loading-section">Lade Materialien...</div>';
                tablesContainer.appendChild(materialSection);
                
                // Fetch materials for this packaging type
                fetch(`http://localhost:5000/verpackungstyp`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Materialien konnten nicht geladen werden');
                        }
                        return response.json();
                    })
                    .then(materials => {
                        materialSection.querySelector('.loading-section').remove();
                        
                        if (!materials || materials.length === 0) {
                            materialSection.innerHTML += '<p>Keine Materialien gefunden</p>';
                            return;
                        }
                        
                        // Filter materials to only show those matching the current ID
                        const currentId = rowData.PK_BAS_WH_PKG_PACKUNGSTYP;
                        const filteredMaterials = materials.filter(material => 
                            material.PK_BAS_WH_PKG_PACKUNGSTYP === currentId
                        );
                        
                        if (filteredMaterials.length === 0) {
                            materialSection.innerHTML += '<p>Keine Materialien für diese ID gefunden</p>';
                            return;
                        }

                        const materialTable = document.createElement('table');
                        materialTable.className = 'detail-table';
                        
                        // Create material table header
                        const materialThead = document.createElement('thead');
                        const materialHeaderRow = document.createElement('tr');
                        
                        // Only show relevant columns
                        ['PK_BAS_WH_PKG_PACKUNGSTYP', 'PACKUNGSTYP', 'STD13_NAME', 'STD13_VALUE'].forEach(key => {
                            const th = document.createElement('th');
                            th.textContent = key;
                            materialHeaderRow.appendChild(th);
                        });
                        
                        materialThead.appendChild(materialHeaderRow);
                        materialTable.appendChild(materialThead);
                        
                        // Create material table body
                        const materialTbody = document.createElement('tbody');
                        
                        filteredMaterials.forEach(material => {
                            const tr = document.createElement('tr');
                            
                            // Only show relevant columns
                            ['PK_BAS_WH_PKG_PACKUNGSTYP', 'PACKUNGSTYP', 'STD13_NAME', 'STD13_VALUE'].forEach(key => {
                                const td = document.createElement('td');
                                td.textContent = material[key] !== null ? material[key] : '';
                                tr.appendChild(td);
                            });
                            
                            materialTbody.appendChild(tr);
                        });
                        
                        materialTable.appendChild(materialTbody);
                        materialSection.appendChild(materialTable);
                    })
                    .catch(error => {
                        materialSection.querySelector('.loading-section').remove();
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'error';
                        errorDiv.textContent = 'Fehler beim Laden der Materialien: ' + error.message;
                        materialSection.appendChild(errorDiv);
                    });
                
                // 3. Section for composite packaging types (filtered by current ID)
                const compositeSection = document.createElement('div');
                compositeSection.className = 'detail-section';
                compositeSection.innerHTML = '<h3>Zusammengesetzte Verpackungen (gefiltert nach ID)</h3>';
                compositeSection.innerHTML += '<div class="loading-section">Lade zusammengesetzte Verpackungen...</div>';
                tablesContainer.appendChild(compositeSection);
                
                // Fetch composite packaging types for this packaging type
                fetch(`http://localhost:5000/verpackungstyp`)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error('Zusammengesetzte Verpackungen konnten nicht geladen werden');
                        }
                        return response.json();
                    })
                    .then(composites => {
                        compositeSection.querySelector('.loading-section').remove();
                        
                        if (!composites || composites.length === 0) {
                            compositeSection.innerHTML += '<p>Keine zusammengesetzten Verpackungen gefunden</p>';
                            return;
                        }
                        
                        // Filter composites to only show those matching the current ID
                        const currentId = rowData.PK_BAS_WH_PKG_PACKUNGSTYP;
                        const filteredComposites = composites.filter(composite => 
                            composite.PK_BAS_WH_PKG_PACKUNGSTYP === currentId
                        );
                        
                        if (filteredComposites.length === 0) {
                            compositeSection.innerHTML += '<p>Keine zusammengesetzten Verpackungen für diese ID gefunden</p>';
                            return;
                        }
                        
                        // Create a container for all groups
                        const groupsContainer = document.createElement('div');
                        
                        // Create a table for the filtered composites
                        const compositeTable = document.createElement('table');
                        compositeTable.className = 'detail-table';
                        
                        // Create table header
                        const compositeThead = document.createElement('thead');
                        const compositeHeaderRow = document.createElement('tr');
                        
                        // Only show the requested columns
                        ['PK_BAS_WH_PKG_PACKUNGSTYP', 'PACKUNGSTYP', 'pk2_pk_bas_wh_pkg_packungstyp', 'pkg2_packungstyp'].forEach(col => {
                            const th = document.createElement('th');
                            th.textContent = col;
                            compositeHeaderRow.appendChild(th);
                        });
                        
                        compositeThead.appendChild(compositeHeaderRow);
                        compositeTable.appendChild(compositeThead);
                        
                        // Create table body
                        const compositeTbody = document.createElement('tbody');
                        
                        filteredComposites.forEach(composite => {
                            const tr = document.createElement('tr');
                            
                            // Only show the requested columns
                            ['PK_BAS_WH_PKG_PACKUNGSTYP', 'PACKUNGSTYP', 'pk2_PK_BAS_WH_PKG_PACKUNGSTYP', 'pkg2_packungstyp'].forEach(col => {
                                const td = document.createElement('td');
                                td.textContent = composite[col] !== null ? composite[col] : '';
                                tr.appendChild(td);
                            });
                            
                            compositeTbody.appendChild(tr);
                        });
                        
                        compositeTable.appendChild(compositeTbody);
                        groupsContainer.appendChild(compositeTable);
                        compositeSection.appendChild(groupsContainer);
                    })
                    .catch(error => {
                        compositeSection.querySelector('.loading-section').remove();
                        const errorDiv = document.createElement('div');
                        errorDiv.className = 'error';
                        errorDiv.textContent = 'Fehler beim Laden der zusammengesetzten Verpackungen: ' + error.message;
                        compositeSection.appendChild(errorDiv);
                    });

                const commSection = document.createElement('div');
                commSection.className = 'comm-section';
                commSection.innerHTML = `
                    <h3>COMM</h3>
                    <div class="loading-section" id="comm"> ${rowData.COMM || ''} ''</div>
                `;

                detailContainer.appendChild(commSection);
            }
        });
    </script>
</body>
</html>
