
<!DOCTYPE html>
<html>
<head>
    <title>CSV to XLSX Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 0;
        }
        button:hover {
            background-color: #45a049;
        }
        #fileInfo {
            margin: 10px 0;
            padding: 10px;
            border: 1px dashed #ccc;
            border-radius: 4px;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .success {
            color: #4CAF50;
            font-weight: bold;
        }
        .error {
            color: #f44336;
            font-weight: bold;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 10px 0;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CSV to XLSX Converter</h1>
        <p>Select a CSV file to convert to XLSX with added "FK_KTO_BANKKTONTO" column (value 41)</p>
        
        <input type="file" id="csvFile" accept=".csv" />
        <div id="fileInfo">No file selected</div>
        
        <button onclick="processFile()">Process and Download</button>
        
        <div id="preview">
            <h3>Preview (first 5 rows)</h3>
            <div id="tablePreview"></div>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        let csvData = null;
        let fileName = '';
        
        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileName = file.name.replace('.csv', '') + '_converted.xlsx';
                document.getElementById('fileInfo').innerHTML = `Selected file: <strong>${file.name}</strong>`;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const content = e.target.result;
                    csvData = content;
                    previewData(content);
                };
                reader.readAsText(file);
            }
        });
        
        function previewData(csvContent) {
            const lines = csvContent.split('\n').slice(0, 6); // Get first 6 lines (header + 5 rows)
            const table = document.createElement('table');
            
            lines.forEach((line, i) => {
                const row = document.createElement('tr');
                const cells = line.split(',');
                
                // Add FK_KTO_BANKKTONTO column to preview
                if (i === 0) {
                    cells.push('FK_KTO_BANKKTONTO (to be added)');
                } else if (cells.length > 1) {
                    cells.push('41');
                }
                
                cells.forEach(cell => {
                    const td = document.createElement(i === 0 ? 'th' : 'td');
                    td.textContent = cell;
                    row.appendChild(td);
                });
                
                table.appendChild(row);
            });
            
            document.getElementById('tablePreview').innerHTML = '';
            document.getElementById('tablePreview').appendChild(table);
        }
        
        function processFile() {
            if (!csvData) {
                document.getElementById('result').innerHTML = '<p class="error">Please select a CSV file first</p>';
                return;
            }
            
            document.getElementById('result').innerHTML = '<p>Processing file...</p>';
            
            // Simulate processing delay
            setTimeout(() => {
                try {
                    // In a real app, this would be done via a backend
                    // For this demo, we'll simulate the download
                    const simulatedData = csvData.split('\n').map(line => {
                        if (line.trim() === '') return line;
                        return line + ',41'; // Add FK_KTO_BANKKTONTO column
                    }).join('\n');
                    
                    // Create download link
                    const blob = new Blob([simulatedData], { type: 'text/csv' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    
                    document.getElementById('result').innerHTML = `
                        <p class="success">File processed successfully!</p>
                        <p>Download should start automatically. If not, <a href="#" onclick="downloadAgain()">click here</a>.</p>
                        <p>Note: In a real application, this would convert to XLSX format with proper formatting.</p>
                    `;
                } catch (error) {
                    document.getElementById('result').innerHTML = `<p class="error">Error: ${error.message}</p>`;
                }
            }, 1000);
        }
        
        function downloadAgain() {
            processFile();
            return false;
        }
    </script>
</body>
</html>
