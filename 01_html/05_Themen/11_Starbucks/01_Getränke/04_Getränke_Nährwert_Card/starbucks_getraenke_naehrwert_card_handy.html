<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>Starbucks® · Mobile Explorer · Filter & Merkmale</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: system-ui, 'Segoe UI', 'Roboto', -apple-system, 'Helvetica Neue', sans-serif;
            background: #f5efe9;
            color: #2c221b;
            padding: 16px;
            padding-bottom: 32px;
        }

        /* mobile-first container */
        .mobile-container {
            max-width: 700px;
            margin: 0 auto;
        }

        .app-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .app-header h1 {
            font-size: 1.65rem;
            font-weight: 800;
            color: #1e5a3a;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .app-header p {
            font-size: 0.8rem;
            color: #5e4b38;
            margin-top: 8px;
        }

        /* Such- & Filterleiste */
        .search-section {
            background: white;
            border-radius: 32px;
            padding: 12px 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            border: 1px solid #e2d9d2;
        }

        .search-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 14px;
        }

        .search-input-mobile {
            flex: 1;
            padding: 14px 18px;
            border-radius: 60px;
            border: 1px solid #d6cbbc;
            background: #fff9f5;
            font-size: 0.95rem;
            width: 100%;
        }

        .reset-filter-btn, .ctrl-btn-mobile {
            background: #ede3db;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            color: #2c5a2e;
            transition: 0.1s;
            white-space: nowrap;
        }

        .reset-filter-btn:active, .ctrl-btn-mobile:active {
            background: #dacfbe;
            transform: scale(0.97);
        }

        .stats-chip {
            background: #1e7b4b10;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            display: inline-block;
        }

        /* horizontale Merkmal-Chips (touchfreundlich) */
        .merkmale-scroll {
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: thin;
            padding-bottom: 8px;
            margin-top: 6px;
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
        }

        .merkmal-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fefaf5;
            border: 1px solid #ede0d6;
            border-radius: 60px;
            padding: 8px 18px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
            white-space: nowrap;
            color: #2c5a2e;
        }

        .merkmal-chip.active {
            background: #1e7b4b;
            border-color: #1e7b4b;
            color: white;
            box-shadow: 0 2px 10px rgba(30,123,75,0.2);
        }

        .merkmal-chip .count-badge {
            background: rgba(0,0,0,0.1);
            border-radius: 40px;
            padding: 2px 10px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .merkmal-chip.active .count-badge {
            background: rgba(255,255,255,0.25);
            color: white;
        }

        /* Expand/Collapse Buttons */
        .action-row {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-bottom: 16px;
        }

        /* Regionen Baum */
        .regions-tree {
            background: #fefcf9;
            border-radius: 28px;
            border: 1px solid #e2d9d2;
            padding: 12px 8px;
            margin-bottom: 24px;
            max-height: 55vh;
            overflow-y: auto;
        }

        .region-section {
            margin-bottom: 16px;
            border: 1px solid #e9dfd6;
            border-radius: 24px;
            background: white;
            overflow: hidden;
        }

        .region-summary {
            font-weight: 800;
            font-size: 1.1rem;
            background: #cfe9ff;
            padding: 14px 18px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
            color: #1e5a3a;
        }

        .type-accordion {
            margin: 8px 12px 12px 12px;
            border: 1px solid #f0e8e0;
            border-radius: 20px;
            background: #fffdfb;
        }

        .type-header {
            background: #d9f0e0;
            padding: 12px 16px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .groups-flex-row {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 16px;
            padding: 12px 8px 16px 8px;
            scrollbar-width: thin;
        }

        .group-column-card {
            flex: 0 0 280px;
            background: #fefaf5;
            border-radius: 24px;
            border: 1px solid #e9dfd6;
            padding: 12px;
            display: flex;
            flex-direction: column;
            max-height: 520px;
            overflow-y: auto;
        }

        .group-column-header {
            font-weight: 800;
            font-size: 0.8rem;
            background: #e7dfd6;
            padding: 8px;
            border-radius: 40px;
            text-align: center;
            margin-bottom: 12px;
            color: #2c5a2e;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .region-drink-card {
            background: white;
            border-radius: 20px;
            border: 1px solid #ede0d6;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: all 0.12s;
            margin-bottom: 12px;
        }

        .region-drink-card:active {
            background: #f0e7df;
            transform: scale(0.99);
        }

        .region-drink-card.active-region-drink {
            background: #f0e7df;
            border-left: 4px solid #1e7b4b;
        }

        .region-drink-img {
            width: 70px;
            height: 70px;
            background: #e6dbd1;
            border-radius: 20px;
            overflow: hidden;
            margin: 0 auto 6px auto;
            flex-shrink: 0;
        }

        .region-drink-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .region-drink-name {
            font-weight: 800;
            font-size: 0.9rem;
            color: #2c5a2e;
            text-align: center;
            word-break: break-word;
        }

        .region-datum-ok {
            font-size: 0.6rem;
            background: #f0e2d8;
            border-radius: 30px;
            padding: 4px 10px;
            display: inline-block;
            margin-top: 4px;
            font-weight: 600;
            text-align: center;
        }

        .attr-group {
            margin-top: 8px;
            font-size: 0.65rem;
            border-top: 1px dashed #ecdccf;
            padding-top: 6px;
        }

        .attr-title {
            font-weight: 800;
            font-size: 0.65rem;
            display: inline-block;
            margin-right: 6px;
            color: #a5663a;
        }

        .attr-badge {
            background: #f3ede7;
            border-radius: 30px;
            padding: 3px 8px;
            font-size: 0.6rem;
            display: inline-block;
            margin: 2px 3px 2px 0;
            white-space: nowrap;
        }

        /* Explorer-Panel (Attribut + Nährwerte) */
        .explorer-mobile {
            background: #fefcf9;
            border-radius: 28px;
            border: 1px solid #e9e0d8;
            padding: 16px;
            margin-top: 16px;
        }

        .attr-summary {
            background: white;
            border-radius: 24px;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #e9dfd6;
        }

        .nutri-section {
            background: white;
            border-radius: 24px;
            padding: 14px;
            border: 1px solid #e9dfd6;
            overflow-x: auto;
        }

        .nutri-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
            min-width: 500px;
        }

        .nutri-table th, .nutri-table td {
            border: 1px solid #e9dfd6;
            padding: 8px 6px;
            text-align: center;
        }

        .grade-1 { background-color: #a3e4a7; }
        .grade-2 { background-color: #c8f0c0; }
        .grade-3 { background-color: #fff2b5; }
        .grade-4 { background-color: #ffe68f; }
        .grade-5 { background-color: #ffcc80; }
        .grade-6 { background-color: #ffb74d; }
        .grade-7 { background-color: #ffa270; }
        .grade-8 { background-color: #ff8a6f; }
        .grade-9 { background-color: #f56c4e; }
        .grade-10 { background-color: #e33b2c; color: white; }
        .grade-na { background-color: #e9e0d8; }

        .detail-img-card {
            width: 60px;
            height: 60px;
            background: #ede3db;
            border-radius: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .flex-between {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .badge-group {
            background: #e9dfd6;
            border-radius: 40px;
            padding: 4px 12px;
            font-size: 0.7rem;
            display: inline-block;
            margin: 4px 6px 4px 0;
        }

        .empty-placeholder {
            color: #a28e7a;
            text-align: center;
            padding: 32px 16px;
            font-style: italic;
        }

        /* mobile tweaks */
        @media (max-width: 550px) {
            body { padding: 12px; }
            .group-column-card { flex: 0 0 260px; }
            .region-summary { font-size: 1rem; padding: 12px 14px; }
            .merkmal-chip { padding: 6px 14px; font-size: 0.75rem; }
        }
    </style>
</head>
<body>
<div class="mobile-container">
    <div class="app-header">
        <h1>☕ Starbucks® · Mobile Explorer</h1>
        <p>🔍 Merkmale filtern · Temperatur-Badges · Nährwertübersicht</p>
    </div>

    <!-- Suchbereich + Merkmal-Chips -->
    <div class="search-section">
        <div class="search-row">
            <input type="text" id="mobileSearchInput" class="search-input-mobile" placeholder="🍹 Getränk, Hauptname oder Gruppe ..." autocomplete="off">
            <button id="clearMobileSearchBtn" class="reset-filter-btn">✖️ Löschen</button>
        </div>
        <div class="stats-chip" id="filterStatsMobile">🍹 0 Getränke</div>
        <div style="margin-top: 12px;">
            <div style="font-size:0.7rem; font-weight:600; margin-bottom:6px; color:#5e4b38;">🏷️ Merkmale (klickbar filtern)</div>
            <div id="merkmaleChipsContainer" class="merkmale-scroll"></div>
        </div>
    </div>

    <!-- Steuerung aufklappen/zuklappen -->
    <div class="action-row">
        <button id="expandAllMobileBtn" class="ctrl-btn-mobile">➕ Alle aufklappen</button>
        <button id="collapseAllMobileBtn" class="ctrl-btn-mobile">➖ Alle zuklappen</button>
    </div>

    <!-- Dynamische Regionsansicht (Baum) -->
    <div id="mobileRegionTree" class="regions-tree">
        <div class="empty-placeholder">🔄 Lade Getränke ...</div>
    </div>

    <!-- Detailbereich: Attribute + Nährwerte -->
    <div class="explorer-mobile" id="mobileExplorerPanel">
        <div class="attr-summary" id="mobileAttrPanel">
            <div class="empty-placeholder">✨ Tippe auf ein Getränk für Details</div>
        </div>
        <div class="nutri-section" id="mobileNutriPanel">
            <div class="empty-placeholder">📊 Nährwerttabelle erscheint hier</div>
        </div>
    </div>
</div>

<script>
    // ------------------------ API & Globals ---------------------------------
    const API_URL = 'http://localhost:5000/star_starbucks_getraenke/full';
    const NUTRIENT_FIELDS = [
        { dbField: "kalorien_einh_kcal", label: "Kalorien", unit: "kcal", format: v => v ? Math.round(v) : "—" },
        { dbField: "fett_total_einh_g", label: "Fett", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "kohlenhydrate_total_einh_g", label: "Kohlenhydrate", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "davon_zucker_einh_g", label: "Zucker", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "eiweiss_einh_g", label: "Eiweiß", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "koffein_einh_mg", label: "Koffein", unit: "mg", format: v => v ? Math.round(v) : "—" }
    ];
    const SIZE_ORDER = ["mini","short","single","tall","grande","venti","ohne"];
    const SIZE_LABELS = { mini:"Mini", short:"Short",single:"Single", tall:"Tall", grande:"Grande", venti:"Venti", ohne:"Ohne" };

    let allItems = [];
    let typeToDrinksMap = new Map();
    let categoryToTypesMap = new Map();
    let globalNutrientValues = {};
    let drinkAttributesMap = new Map();      // enthält temperature, milch, weitere
    let globalMerkmaleList = [];             // { label, count }

    let currentSelectedMerkmal = null;
    let currentSearchText = "";
    let drinkTypeColsMap = new Map();         // drinkKey -> Set(type_columns)
    let drinkObjectsMap = new Map();          // drinkKey -> { drinkName, mainName, groupId, bildId, datumOk }

    // Hilfsfunktionen
    function getDrinkKey(groupId, mainName, drinkName) { return `${groupId}|${mainName}|${drinkName}`; }
    function escapeHtml(str) { return str ? String(str).replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])) : ''; }
    function parseNumber(v) { if(v===undefined||v===null) return null; let n=parseFloat(String(v).trim().replace(',','.')); return isNaN(n)?null:n; }
    function extractSizeKey(sizeRaw) { if(!sizeRaw) return null; let raw=String(sizeRaw).trim().toLowerCase(); if(raw.includes('mini')) return 'mini'; if(raw.includes('short')) return 'short'; if(raw.includes('tall')) return 'tall'; if(raw.includes('grande')) return 'grande'; if(raw.includes('single')) return 'single'; if(raw.includes('venti')) return 'venti'; if(raw.includes('ohne')) return 'ohne'; return null; }

    // buildDetailedAttributesMap + Temperatur, Milch, Merkmale, Saison
    function buildDetailedAttributesMap(items) {
        const map = new Map();
        const tempRowsByKey = new Map();
        for (let row of items) {
            const groupId = row.PK_STAR_STARBUCKS_GETRAENKE_GROUP || 'unbekannte Gruppe';
            const mainName = (row.MAIN_GETRAENK || row.main_getraenk || 'Allgemein').trim();
            const drinkName = (row.GETRAENK || row.getraenk || 'Unbekannt').trim();
            const key = getDrinkKey(groupId, mainName, drinkName);
            if (!tempRowsByKey.has(key)) tempRowsByKey.set(key, []);
            tempRowsByKey.get(key).push(row);
        }
        const milchKeyMap = { "type_Bestandteile_Hafer__": "🌾 Hafer", "type_Bestandteile_Kokosnuss__": "🥥 Kokos", "type_Bestandteile_Mandel__": "🌰 Mandel", "type_Bestandteile_Soja__": "🌱 Soja", "type_milk_Halbfettmilch__": "🥛 Halbfettmilch", "type_milk_Magermilch__": "🥛 Magermilch", "type_milk_Vollmilch__": "🥛 Vollmilch", "type_milk_Oatmilk__": "🥛 Oatmilk" , "type_milk_milk__":  "🥛 Milk" };
        const seasonMap = { "type_seasonal__": "🍂 seasonal", "type_seasonal_Spring_FY26__": "🌸 Spring FY26" };
        const temperatureMap = { "type_Temperature_Hot__": "🔥 Hot", "type_Temperature_Cold__": "❄️ Cold", "type_Temperature_Iced__": "🧊 Iced" };
        const excludePattern = /(milch|milk|temperatur|temperature|groesse|size|season)/i;
        
        for (let [key, rows] of tempRowsByKey.entries()) {
            const groessenSet = new Set(), milchSet = new Set(), seasonSet = new Set(), temperatureSet = new Set(), weitereSet = new Set();
            for (let row of rows) {
                let groesseRaw = row.getraenk_groesse || row.groesse || '';
                let sizeKey = extractSizeKey(groesseRaw);
                if (sizeKey && SIZE_LABELS[sizeKey]) groessenSet.add(SIZE_LABELS[sizeKey]);
                for (let [col, val] of Object.entries(row)) {
                    if ((val === 1 || val === '1' || val === true) && col.startsWith('type_')) {
                        if (milchKeyMap[col]) { milchSet.add(milchKeyMap[col]); continue; }
                        if (seasonMap[col]) { seasonSet.add(seasonMap[col]); continue; }
                        if (temperatureMap[col]) { temperatureSet.add(temperatureMap[col]); continue; }
                        if (excludePattern.test(col)) continue;
                        let display = col.replace(/^type_/, '').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                        weitereSet.add(`📌 ${display}`);
                    }
                }
            }
            map.set(key, { 
                groessen: Array.from(groessenSet).sort((a,b)=>SIZE_ORDER.indexOf(a.toLowerCase())-SIZE_ORDER.indexOf(b.toLowerCase())), 
                season: Array.from(seasonSet), 
                temperature: Array.from(temperatureSet), 
                milchvarianten: Array.from(milchSet), 
                weitere: Array.from(weitereSet).sort() 
            });
        }
        return map;
    }

    function buildGlobalMerkmaleList(attributesMap) {
        const countMap = new Map();
        for (let attrs of attributesMap.values()) {
            for (let m of attrs.weitere) countMap.set(m, (countMap.get(m) || 0) + 1);
        }
        return Array.from(countMap.entries()).map(([label, count]) => ({ label, count })).sort((a,b) => a.label.localeCompare(b.label));
    }

    function buildDrinkTypeAndObjectMaps(items, typeColumns) {
        const drinkTypeMap = new Map();
        const drinkObjMap = new Map();
        for (let row of items) {
            const groupId = row.PK_STAR_STARBUCKS_GETRAENKE_GROUP || 'unbekannte Gruppe';
            const mainName = (row.MAIN_GETRAENK || row.main_getraenk || 'Allgemein').trim();
            const drinkName = (row.GETRAENK || row.getraenk || 'Unbekannt').trim();
            const key = getDrinkKey(groupId, mainName, drinkName);
            if (!drinkObjMap.has(key)) {
                drinkObjMap.set(key, { drinkName, mainName, groupId, bildId: row.FK_BILD_BILDER || row.si_fk_bild_bilder || '—', datumOk: row.DATUM_OK || row.datum_ok || '—' });
            }
            if (!drinkTypeMap.has(key)) drinkTypeMap.set(key, new Set());
            const typeSet = drinkTypeMap.get(key);
            for (let col of typeColumns) {
                if (row[col] === 1 || row[col] === '1' || row[col] === true) typeSet.add(col);
            }
        }
        return { drinkTypeMap, drinkObjMap };
    }

    function rebuildGlobalRanges(items) { 
        for(let nut of NUTRIENT_FIELDS) globalNutrientValues[nut.dbField] = []; 
        for(let row of items) { for(let nut of NUTRIENT_FIELDS) { let val = parseNumber(row[nut.dbField]); if(val !== null) globalNutrientValues[nut.dbField].push(val); } } 
        for(let nut of NUTRIENT_FIELDS) globalNutrientValues[nut.dbField].sort((a,b)=>a-b); 
    }

    function getGradeClass(nutrientDbField, value) { 
        if(value === null || value === '—' || isNaN(value)) return 'grade-na'; 
        let numeric = parseFloat(value); let arr = globalNutrientValues[nutrientDbField] || []; 
        if(!arr.length) return 'grade-na'; 
        let rank = arr.findIndex(v => v >= numeric); if(rank === -1) rank = arr.length-1; 
        let percentile = (rank+1)/arr.length; let grade = Math.min(10, Math.max(1, Math.ceil(percentile*10))); 
        const gradeMap = {1:'grade-1',2:'grade-2',3:'grade-3',4:'grade-4',5:'grade-5',6:'grade-6',7:'grade-7',8:'grade-8',9:'grade-9',10:'grade-10'}; 
        return gradeMap[grade]; 
    }

    async function fetchImageAndDisplay(bildId, container, clickable=true) {
        if(!bildId || bildId === '—') { container.innerHTML='<div style="font-size:10px;">📷 kein Bild</div>'; return; }
        try { container.innerHTML='<div>⏳</div>'; let resp = await fetch(`http://localhost:5000/bild/1/${bildId}`); 
        if(resp.ok) { let imgData = await resp.json(); 
            if(imgData[0]?.FILECONTENT?.data) { 
                let byteArray = new Uint8Array(imgData[0].FILECONTENT.data); 
                let blob = new Blob([byteArray], {type: imgData[0].MIMETYPE || 'image/jpeg'}); 
                let url = URL.createObjectURL(blob); let img = document.createElement('img'); 
                img.src = url; img.style.width = '100%'; img.style.height = '100%'; img.style.objectFit = 'cover'; 
                container.innerHTML = ''; container.appendChild(img); 
                if(clickable) { img.style.cursor = 'pointer'; img.onclick = (e) => { e.stopPropagation(); let modal = document.createElement('div'); modal.style.position='fixed'; modal.style.top=0; modal.style.left=0; modal.style.width='100%'; modal.style.height='100%'; modal.style.background='rgba(0,0,0,0.85)'; modal.style.display='flex'; modal.style.alignItems='center'; modal.style.justifyContent='center'; modal.style.zIndex=20000; let bigImg=document.createElement('img'); bigImg.src=url; bigImg.style.maxWidth='90vw'; bigImg.style.maxHeight='90vh'; bigImg.style.borderRadius='24px'; modal.appendChild(bigImg); modal.onclick=()=>modal.remove(); document.body.appendChild(modal); }; } 
                img.onload = () => URL.revokeObjectURL(url); 
            } else container.innerHTML='<div>📷 leer</div>'; 
        } else container.innerHTML='<div>❌ Fehler</div>'; } catch(e) { container.innerHTML='<div>⚠️ Netzwerk</div>'; }
    }

    // Nährwerte und Attribut-Anzeige
    async function showDrinkDetails(drinkKey, groupId, mainName, drinkName, bildId) {
        // Attribute in linkem Panel anzeigen
        const attrs = drinkAttributesMap.get(drinkKey) || { groessen:[], temperature:[], season:[], milchvarianten:[], weitere:[] };
        let attrHtml = `<div><strong style="color:#1e5a3a;">🍹 ${escapeHtml(drinkName)}</strong><br><span style="font-size:0.7rem;">${escapeHtml(mainName)} · ${escapeHtml(groupId)}</span><hr>`;
        if(attrs.groessen.length) attrHtml+=`<div>📏 Größen: ${attrs.groessen.map(s=>`<span class="badge-group">${s}</span>`).join('')}</div>`;
        if(attrs.temperature.length) attrHtml+=`<div>🌡️ Temperatur: ${attrs.temperature.map(t=>`<span class="badge-group">${t}</span>`).join('')}</div>`;
        if(attrs.season.length) attrHtml+=`<div>🌿 Saison: ${attrs.season.map(s=>`<span class="badge-group">${s}</span>`).join('')}</div>`;
        if(attrs.milchvarianten.length) attrHtml+=`<div>🥛 Milchvarianten: ${attrs.milchvarianten.map(m=>`<span class="badge-group">${m}</span>`).join('')}</div>`;
        if(attrs.weitere.length) attrHtml+=`<div>✨ Merkmale: ${attrs.weitere.slice(0,20).map(w=>`<span class="badge-group">${w}</span>`).join('')}${attrs.weitere.length>20?' …':''}</div>`;
        document.getElementById('mobileAttrPanel').innerHTML = attrHtml;

        // Nährwerte
        const relevantRows = allItems.filter(row => { let g = (row.GETRAENK || row.getraenk || '').trim(); let grp = (row.PK_STAR_STARBUCKS_GETRAENKE_GROUP || ''); let main = (row.MAIN_GETRAENK || row.main_getraenk || ''); return g === drinkName && String(grp) === groupId && main === mainName; });
        if(!relevantRows.length) { document.getElementById('mobileNutriPanel').innerHTML = `<div class="empty-placeholder">⚠️ Keine Nährwerte</div>`; return; }
        let milkSizeMap = new Map();
        for(let row of relevantRows) { 
            let milchart = row.MILCHART || row.milchart || 'Standard'; 
            let groesseRaw = row.getraenk_groesse || row.groesse || ''; 
            let sizeKey = extractSizeKey(groesseRaw); if(!sizeKey) continue; 
            let nutrition = {}; for(let n of NUTRIENT_FIELDS) nutrition[n.dbField] = parseNumber(row[n.dbField]); 
            let key = `${milchart}|${sizeKey}`; if(!milkSizeMap.has(key)) milkSizeMap.set(key, { milchart, sizeKey, nutrition }); 
        }
        let tableRows = Array.from(milkSizeMap.values()).sort((a,b) => (SIZE_ORDER.indexOf(a.sizeKey)-SIZE_ORDER.indexOf(b.sizeKey)) || a.milchart.localeCompare(b.milchart));
        let nutriHtml = `<table class="nutri-table"><thead><tr><th>Milchart</th><th>Größe</th>${NUTRIENT_FIELDS.map(n => `<th>${n.label}<br>(${n.unit})</th>`).join('')}</tr></thead><tbody>`+
            tableRows.map(entry=>`<tr><td>${escapeHtml(entry.milchart)}</td><td>${SIZE_LABELS[entry.sizeKey]||entry.sizeKey}</td>${NUTRIENT_FIELDS.map(n=>{let val=entry.nutrition[n.dbField]; let cls=getGradeClass(n.dbField,val); return `<td class="${cls}">${n.format(val)}</td>`;}).join('')}</tr>`).join('')+
            `</tbody></table>`;
        const imgContainerId = `detailImgMobile-${Date.now()}`;
        const datum = relevantRows[0]?.DATUM_OK || relevantRows[0]?.datum_ok || '—';
        let headerHtml = `<div class="flex-between"><div id="${imgContainerId}" class="detail-img-card"></div><div><div><strong>${escapeHtml(drinkName)}</strong></div><div style="font-size:0.7rem;">Datum: ${escapeHtml(datum)}</div></div></div>`;
        document.getElementById('mobileNutriPanel').innerHTML = `<div>${headerHtml}<hr>${nutriHtml}</div>`;
        const imgContainerElem = document.getElementById(imgContainerId); 
        if(imgContainerElem && bildId && bildId !== '—') await fetchImageAndDisplay(bildId, imgContainerElem, true);
        else if(imgContainerElem) imgContainerElem.innerHTML = '<div>📷</div>';
    }

    // Haupt-Rendering (mobile optimierter Baum + Merkmal-Chips)
    function renderMobileRegionView() {
        // Gefilterte Drinks basierend auf Merkmal + Suchtext
        let filteredDrinkKeys = new Set();
        for (let [drinkKey, obj] of drinkObjectsMap.entries()) {
            let matchesMerkmal = true;
            if (currentSelectedMerkmal) {
                const attrs = drinkAttributesMap.get(drinkKey);
                if (!attrs || !attrs.weitere.includes(currentSelectedMerkmal)) matchesMerkmal = false;
            }
            let matchesSearch = true;
            if (currentSearchText.trim() !== "") {
                const searchLower = currentSearchText.toLowerCase();
                const drinkNameMatch = obj.drinkName.toLowerCase().includes(searchLower);
                const mainMatch = obj.mainName.toLowerCase().includes(searchLower);
                const groupMatch = obj.groupId.toLowerCase().includes(searchLower);
                if (!(drinkNameMatch || mainMatch || groupMatch)) matchesSearch = false;
            }
            if (matchesMerkmal && matchesSearch) filteredDrinkKeys.add(drinkKey);
        }
        document.getElementById('filterStatsMobile').innerHTML = `🍹 Gefiltert: ${filteredDrinkKeys.size} Getränke`;

        // Merkmal-Chips
        const chipsContainer = document.getElementById('merkmaleChipsContainer');
        if (globalMerkmaleList.length) {
            let chipsHtml = '';
            globalMerkmaleList.forEach(m => {
                const activeClass = (currentSelectedMerkmal === m.label) ? 'active' : '';
                chipsHtml += `<div class="merkmal-chip ${activeClass}" data-merkmal="${escapeHtml(m.label)}"><span>${escapeHtml(m.label)}</span><span class="count-badge">${m.count}</span></div>`;
            });
            chipsContainer.innerHTML = chipsHtml;
            // event chips
            document.querySelectorAll('.merkmal-chip').forEach(chip => {
                chip.addEventListener('click', (e) => { e.stopPropagation(); const merkmal = chip.getAttribute('data-merkmal'); currentSelectedMerkmal = (currentSelectedMerkmal === merkmal) ? null : merkmal; renderMobileRegionView(); });
            });
        } else { chipsContainer.innerHTML = '<div class="empty-placeholder" style="padding:8px">Keine Merkmale</div>'; }

        // Baumstruktur
        let regionTreeHtml = '';
        for (let [regionName, typeCols] of categoryToTypesMap.entries()) {
            let regionHasDrinks = false;
            let regionContent = `<details class="region-section" open><summary class="region-summary"><span>🏷️ ${escapeHtml(regionName)}</span><span>▼</span></summary><div>`;
            for (let typeCol of typeCols) {
                const drinksForType = [];
                for (let drinkKey of filteredDrinkKeys) {
                    const typeSet = drinkTypeColsMap.get(drinkKey);
                    if (typeSet && typeSet.has(typeCol)) {
                        const obj = drinkObjectsMap.get(drinkKey);
                        if (obj) drinksForType.push({ drinkKey, ...obj });
                    }
                }
                if (drinksForType.length === 0) continue;
                regionHasDrinks = true;
                let displayType = typeCol.replace(/^type_/, '').replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                regionContent += `<details class="type-accordion" open><summary class="type-header"><span>📌 ${escapeHtml(displayType)}</span><span class="card-count">${drinksForType.length}</span></summary><div class="groups-flex-row">`;
                const groupMap = new Map();
                for (let drink of drinksForType) { if (!groupMap.has(drink.groupId)) groupMap.set(drink.groupId, []); groupMap.get(drink.groupId).push(drink); }
                for (let [groupId, groupDrinks] of groupMap.entries()) {
                    regionContent += `<div class="group-column-card"><div class="group-column-header">🍽️ ${escapeHtml(groupId)} (${groupDrinks.length})</div>`;
                    for (let drink of groupDrinks) {
                        const imgId = `region_img_${Date.now()}_${Math.random().toString(36).substr(2, 6)}`;
                        const drinkKeyFull = getDrinkKey(drink.groupId, drink.mainName, drink.drinkName);
                        const attrs = drinkAttributesMap.get(drinkKeyFull) || { groessen:[], season:[], temperature:[], milchvarianten:[], weitere:[] };
                        const temperatureHtml = attrs.temperature.length ? `<div class="attr-group"><span class="attr-title">🌡️ Temperatur:</span> ${attrs.temperature.map(t => `<span class="attr-badge">${escapeHtml(t)}</span>`).join('')}</div>` : '';
                        const milchHtml = attrs.milchvarianten.length ? `<div class="attr-group"><span class="attr-title">🥛 Milch:</span> ${attrs.milchvarianten.map(m => `<span class="attr-badge">${escapeHtml(m)}</span>`).join('')}</div>` : '';
                        const weitereHtml = attrs.weitere.length ? `<div class="attr-group"><span class="attr-title">✨ Merkmale:</span> ${attrs.weitere.slice(0,6).map(w => `<span class="attr-badge">${escapeHtml(w)}</span>`).join('')}${attrs.weitere.length>6?' …':''}</div>` : '';
                        regionContent += `<div class="region-drink-card" data-group="${escapeHtml(drink.groupId)}" data-main="${escapeHtml(drink.mainName)}" data-drink="${escapeHtml(drink.drinkName)}" data-bild="${escapeHtml(drink.bildId)}" data-drinkkey="${escapeHtml(drinkKeyFull)}">
                                            <div class="region-drink-img" id="${imgId}"></div>
                                            <div class="region-drink-info"><div class="region-drink-name">${escapeHtml(drink.drinkName)}</div><div class="region-datum-ok">📅 ${escapeHtml(drink.datumOk)}</div></div>
                                            ${temperatureHtml}${milchHtml}${weitereHtml}
                                        </div>`;
                        setTimeout(() => { const imgContainer = document.getElementById(imgId); if(imgContainer && drink.bildId && drink.bildId !== '—') fetchImageAndDisplay(drink.bildId, imgContainer, false); else if(imgContainer) imgContainer.innerHTML = '<div>📷</div>'; }, 10);
                    }
                    regionContent += `</div>`;
                }
                regionContent += `</div></details>`;
            }
            regionContent += `</div></details>`;
            if (regionHasDrinks) regionTreeHtml += regionContent;
        }
        if (!regionTreeHtml) regionTreeHtml = '<div class="empty-placeholder">🍃 Keine Getränke mit dieser Filterung</div>';
        document.getElementById('mobileRegionTree').innerHTML = regionTreeHtml;

        // Event-Listener für Getränkekarten
        document.querySelectorAll('#mobileRegionTree .region-drink-card').forEach(card => {
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                const group = card.getAttribute('data-group');
                const main = card.getAttribute('data-main');
                const drinkNameAttr = card.getAttribute('data-drink');
                const bildId = card.getAttribute('data-bild');
                const drinkKey = card.getAttribute('data-drinkkey');
                if(drinkNameAttr && group && main) {
                    showDrinkDetails(drinkKey, group, main, drinkNameAttr, bildId);
                    document.querySelectorAll('#mobileRegionTree .region-drink-card').forEach(c => c.classList.remove('active-region-drink'));
                    card.classList.add('active-region-drink');
                }
            });
        });
    }

    // Globale Initialisierung nach Datenladung
    async function initMobileApp() {
        try {
            const resp = await fetch(API_URL); if(!resp.ok) throw new Error(`HTTP ${resp.status}`);
            let data = await resp.json(); 
            allItems = (data.data && Array.isArray(data.data)) ? data.data : (Array.isArray(data) ? data : []); 
            if(!allItems.length) throw new Error("Keine Daten");
            rebuildGlobalRanges(allItems);
            const typeColumns = extractTypeColumnsFromData(allItems);
            if(!typeColumns.length) throw new Error("Keine type_* Spalten");
            categoryToTypesMap = groupColumnsByPrefix(typeColumns);
            typeToDrinksMap = buildTypeDrinksMap(allItems, typeColumns);
            drinkAttributesMap = buildDetailedAttributesMap(allItems);
            globalMerkmaleList = buildGlobalMerkmaleList(drinkAttributesMap);
            const { drinkTypeMap, drinkObjMap } = buildDrinkTypeAndObjectMaps(allItems, typeColumns);
            drinkTypeColsMap = drinkTypeMap;
            drinkObjectsMap = drinkObjMap;
            // Such- & Reset Events
            const searchInput = document.getElementById('mobileSearchInput');
            const clearBtn = document.getElementById('clearMobileSearchBtn');
            const expandBtn = document.getElementById('expandAllMobileBtn');
            const collapseBtn = document.getElementById('collapseAllMobileBtn');
            if (searchInput) searchInput.addEventListener('input', (e) => { currentSearchText = e.target.value; renderMobileRegionView(); });
            if (clearBtn) clearBtn.addEventListener('click', () => { currentSearchText = ""; if(searchInput) searchInput.value = ""; renderMobileRegionView(); });
            if (expandBtn) expandBtn.onclick = () => { document.querySelectorAll('#mobileRegionTree details').forEach(el => { if(el.tagName === 'DETAILS') el.open = true; }); };
            if (collapseBtn) collapseBtn.onclick = () => { document.querySelectorAll('#mobileRegionTree details').forEach(el => { if(el.tagName === 'DETAILS') el.open = false; }); };
            renderMobileRegionView();
        } catch(err) { 
            console.error(err); 
            document.getElementById('mobileRegionTree').innerHTML = `<div class="empty-placeholder">❌ Fehler: ${err.message}<br>API auf Port 5000 erforderlich.</div>`;
        }
    }

    function extractTypeColumnsFromData(items) { if(!items.length) return []; const cols = new Set(); for(let row of items) Object.keys(row).forEach(k => { if(k.startsWith('type_')) cols.add(k); }); return Array.from(cols).sort(); }
    function groupColumnsByPrefix(typeColumns) { const groups = new Map(); for(let col of typeColumns) { const prefix = getTypePrefix(col); if(!groups.has(prefix)) groups.set(prefix, []); groups.get(prefix).push(col); } const order = ["Latte", "Getränketypen", "Temperatur", "Geschmack", "Size", "Type", "Coffeein", "Merkmal", "Frucht", "Topping", "Tea", "Zucker", "Milch", "Bestandteile", "Seasonal", "Sonstige"]; const sortedGroups = new Map(); for(let key of order) { if(groups.has(key)) { sortedGroups.set(key, groups.get(key)); groups.delete(key); } } for(let key of Array.from(groups.keys()).sort()) sortedGroups.set(key, groups.get(key)); return sortedGroups; }
    function getTypePrefix(columnName) { const match = columnName.match(/^type_([^_]+)/); if (match && match[1]) { let prefix = match[1]; const special = { "Getränketypen":"Getränketypen", "Tea":"Tea", "Coffeein":"Coffeein", "Geschmack":"Geschmack", "Temperature":"Temperatur", "Merkmal":"Merkmal", "Frucht":"Frucht", "Topping":"Topping", "Bestandteile":"Bestandteile", "seasonal":"Seasonal", "sugar":"Zucker", "milk":"Milch" }; if(special[prefix]) return special[prefix]; return prefix.charAt(0).toUpperCase() + prefix.slice(1); } return "Sonstige"; }
    function buildTypeDrinksMap(items, typeColumns) { const map = new Map(); for(let col of typeColumns) map.set(col, new Map()); for(let row of items) { const groupId = row.PK_STAR_STARBUCKS_GETRAENKE_GROUP || 'unbekannte Gruppe'; const mainName = (row.MAIN_GETRAENK || row.main_getraenk || 'Allgemein').trim(); const drinkName = (row.GETRAENK || row.getraenk || 'Unbekannt').trim(); const uniqueKey = `${groupId}|${mainName}|${drinkName}`; for(let col of typeColumns) { let val = row[col]; if(val === 1 || val === '1' || val === true) { const innerMap = map.get(col); if(!innerMap.has(uniqueKey)) { innerMap.set(uniqueKey, { groupId, mainName, drinkName, bildId: row.FK_BILD_BILDER || row.si_fk_bild_bilder || '—', datumOk: row.DATUM_OK || row.datum_ok || '—' }); } } } } const result = new Map(); for(let [col, innerMap] of map.entries()) result.set(col, Array.from(innerMap.values())); return result; }

    initMobileApp();
</script>
