<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Starbucks® – Webservice: Pump-Sizes & Flat Data Table | Zwei Tabs</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5efe9;
            color: #2c221b;
            height: 100vh;
            overflow: hidden;
        }

        /* Tab navigation */
        .tab-bar {
            background: white;
            border-bottom: 1px solid #e2d9d2;
            padding: 0 24px;
            display: flex;
            gap: 8px;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.02);
            z-index: 20;
        }
        .tab-button {
            background: none;
            border: none;
            padding: 14px 24px;
            font-size: 0.9rem;
            font-weight: 700;
            color: #5e4b38;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab-button.active {
            color: #1e5a3a;
            border-bottom-color: #1e7b4b;
            background: #fefcf9;
        }
        .tab-button:hover:not(.active) {
            background: #f3ede7;
            color: #2c5a2e;
        }
        .panes {
            flex: 1;
            overflow: hidden;
            position: relative;
        }
        .pane {
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: none;
        }
        .pane.active {
            display: flex;
            flex-direction: column;
        }

        /* original layout inside pane1 */
        .app-container {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .sidebar {
            width: 400px;
            background: white;
            border-right: 1px solid #e2d9d2;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px 16px 12px;
            border-bottom: 2px solid #1e7b4b;
            background: #ffffff;
        }
        .sidebar-header h2 {
            font-size: 1.3rem;
            font-weight: 800;
            color: #1e5a3a;
        }
        .filter-section {
            padding: 12px 16px;
            background: #fefcf9;
            border-bottom: 1px solid #e9e0d8;
            position: sticky;
            top: 82px;
        }
        .filter-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .searchable-dropdown input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 40px;
            border: 1px solid #d6cbbc;
            font-size: 0.85rem;
        }
        .tree-container {
            padding: 12px;
            flex: 1;
            overflow-y: auto;
        }
        .tree, .tree ul {
            list-style: none;
            padding-left: 20px;
        }
        .tree { padding-left: 0; }
        .tree li { margin: 4px 0; }
        .tree .node {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 8px;
            border-radius: 28px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .tree .node:hover { background: #ede3db; }
        .tree .node.selected { background: #c8e6d9; font-weight: 600; border-left: 3px solid #1e7b4b; }
        .toggle-icon { width: 18px; cursor: pointer; color: #1e7b4b; }
        .node-badge { background: #e2d9d2; border-radius: 30px; padding: 0 8px; font-size: 0.65rem; }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: #faf7f3;
        }

        .detail-header {
            margin-bottom: 20px;
            border-bottom: 2px solid #d4c9be;
            padding-bottom: 10px;
        }
        .detail-header h1 { font-size: 1.8rem; font-weight: 800; color: #1e5a3a; }

        .table-wrapper {
            overflow-x: auto;
            background: white;
            border-radius: 28px;
            border: 1px solid #e2d9d2;
            margin-top: 12px;
            font-size: 0.7rem;
        }
        .nutrition-master-table {
            width: max-content;
            min-width: 100%;
            border-collapse: collapse;
        }
        .nutrition-master-table th, .nutrition-master-table td {
            border: 1px solid #e9dfd6;
            padding: 6px 8px;
            vertical-align: top;
            text-align: center;
        }
        .nutrition-master-table th {
            background: #f3ede7;
            font-weight: 800;
            color: #2c5a2e;
            position: sticky;
            top: 0;
            white-space: nowrap;
        }
        .size-group-header { background: #e8dfd7; }
        .allergen-group { background: #fff3eb; border-left: 2px solid #d4bca8; }
        .zusatz-group { background: #fef5ed; border-left: 2px solid #b8a38c; }
        .subnutrient { font-size: 0.65rem; font-weight: normal; display: block; color: #6b4e2e; }
        .pk-badge { font-family: monospace; background: #ebe1d7; padding: 2px 6px; border-radius: 20px; }
        .final-value { font-weight: 500; }
        .text-left { text-align: left; }
        .empty-message, .error-message { text-align: center; padding: 48px; color: #a28e78; font-style: italic; }
        
        .sortable-col {
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
            position: relative;
        }
        .sortable-col:hover {
            background: #dcd0c5;
        }
        .sort-indicator {
            display: inline-block;
            margin-left: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .sortable-col.sorted-column {
            background: #b7d9c4;
            box-shadow: inset 0 -2px 0 #1e7b4b;
            color: #0a3522;
        }
        
        /* flat table pane (pane2) styles */
        .flat-data-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #faf7f3;
            padding: 20px 24px;
            gap: 16px;
            overflow: hidden;
        }
        .flat-search-bar {
            background: white;
            border-radius: 48px;
            padding: 8px 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            border: 1px solid #e2d9d2;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
        }
        .flat-search-bar input {
            flex: 1;
            border: none;
            padding: 12px 8px;
            font-size: 0.9rem;
            outline: none;
            background: transparent;
            font-weight: 500;
        }
        .flat-search-bar span {
            background: #ede3db;
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .flat-table-wrapper {
            flex: 1;
            overflow: auto;
            background: white;
            border-radius: 24px;
            border: 1px solid #e2d9d2;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }
        .flat-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
            min-width: 1200px;
        }
        .flat-data-table th {
            position: sticky;
            top: 0;
            background: #2c5a2e;
            color: white;
            padding: 8px 6px;
            font-weight: 700;
            white-space: nowrap;
            border-right: 1px solid #4a7c4c;
            cursor: pointer;
            user-select: none;
        }
        .flat-data-table th:hover {
            background: #1e7b4b;
        }
        .flat-data-table td {
            padding: 5px 6px;
            border-bottom: 1px solid #ecdfd5;
            white-space: nowrap;
        }
        .flat-data-table tr:hover td {
            background-color: #fef3e8;
        }
        .record-count {
            font-size: 0.75rem;
            font-weight: 600;
            background: #e9dfd7;
            padding: 6px 12px;
            border-radius: 24px;
        }
        .status-badge {
            background: #e9dfd7;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            display: inline-block;
            margin-left: 12px;
            font-weight: normal;
        }
        @media (max-width: 800px) { .sidebar { width: 280px; } }
    </style>
</head>
<body>
<div style="display: flex; flex-direction: column; height: 100vh;">
    <div class="tab-bar">
        <button class="tab-button active" data-tab="tab1">🍹 Getränke-Explorer (Pump-Sizes & Nährwerte)</button>
        <button class="tab-button" data-tab="tab2">📊 Alle Webservice-Daten (Flat Table / Suche)</button>
    </div>
    <div class="panes">
        <!-- Tab 1: Original Explorer -->
        <div id="paneExplorer" class="pane active">
            <div class="app-container">
                <div class="sidebar">
                    <div class="sidebar-header">
                        <h2>📁 Getränke-Explorer <span id="apiStatusBadge" class="status-badge">⚡ Live API</span></h2>
                        <p>🔁 Pump-Sizes (1-5 Pump) | sortierbare Milchart + sort_db</p>
                    </div>
                    <div class="filter-section">
                        <div class="filter-label">
                            <span>🔍 SPRINGEN ZU GETRÄNK</span>
                            <span id="drinkCountBadge" style="background:#e2d9d2; padding:2px 8px; border-radius:20px;">0</span>
                        </div>
                        <div class="searchable-dropdown">
                            <input type="text" id="getraenkSearchInput" placeholder="🔎 Getränk suchen / auswählen ..." list="getraenkList" autocomplete="off">
                            <datalist id="getraenkList"></datalist>
                        </div>
                    </div>
                    <div class="tree-container" id="treeContainer">🌿 Lade Daten von Webservice...</div>
                </div>
                <div class="main-content">
                    <div id="detailContent">✨ Wählen Sie ein Getränk aus der Baumstruktur oder der Suche</div>
                </div>
            </div>
        </div>
        <!-- Tab 2: Flat Data mit Suche -->
        <div id="paneAllData" class="pane">
            <div class="flat-data-container">
                <div class="flat-search-bar">
                    <input type="text" id="flatSearchInput" placeholder="🔍 Suchen in allen Daten (Getränk, Milchart, Zusatzstoffe, Nährwerte, PK...)" autocomplete="off">
                    <span>🔎 live filter</span>
                    <span id="flatRecordCount" class="record-count">0 Einträge</span>
                </div>
                <div class="flat-table-wrapper" id="flatTableWrapper">
                    <div class="empty-message">📡 Daten werden geladen ...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ================================ WEBSERVICE ONLY =================================
    const API_URL = 'http://localhost:5000/star_starbucks_getraenke/full';
    let allItems = [];
    let apiError = false;
    
    // Globale Strukturen für Tab1
    let structuredData = new Map();
    let drinkToVariants = new Map();
    let milkNutritionMap = new Map();
    let extraAttributesMap = new Map();
    let allGetraenkNames = [];
    
    // Sortierstatus Tab1
    let currentSortColumn = "milk";
    let currentSortOrder = "asc";
    let currentGetraenk = null;
    
    // Globale Rohdaten für Tab2 Flat Table
    let flatRawData = [];        // Alle Original-Items (jede Zeile = eine Größen-Kombination)
    let filteredFlatData = [];
    let flatSortField = "PK_STAR_STARBUCKS_GETRAENKE_SIMPLE";
    let flatSortDirection = "asc";
    
    // ========== Hilfsfunktionen ==========
    const SIZE_ORDER = ["mini", "short", "single", "doppio", "tall", "grande", "venti", "1 Pump", "2 Pump", "3 Pump", "4 Pump", "5 Pump", "ohne"];
    const SIZE_LABELS = { mini:"Mini", short:"Short", single:"Single", doppio:"Doppio", tall:"Tall", grande:"Grande", venti:"Venti", "1 Pump":"1 Pump", "2 Pump":"2 Pump", "3 Pump":"3 Pump", "4 Pump":"4 Pump", "5 Pump":"5 Pump", ohne:"Ohne" };

    const NUTRIENT_MAPPING = [
        { dbField: "groesse_kilojoules_einh_kj", label: "kJ", unit: "kJ", format: v => v ? Math.round(v) : "—" },
        { dbField: "kalorien_einh_kcal", label: "kcal", unit: "kcal", format: v => v ? Math.round(v) : "—" },
        { dbField: "fett_total_einh_g", label: "Fett", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "davon_gesaettigte_fettsaeuren_einh_g", label: "ges.Fetts.", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "kohlenhydrate_total_einh_g", label: "Kohlenhydr.", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "davon_zucker_einh_g", label: "Zucker", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "ballaststoffe_einh_g", label: "Ballastst.", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "eiweiss_einh_g", label: "Eiweiß", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "salzgeh_alt_einh_g", label: "Salz", unit: "g", format: v => v ? v.toFixed(2) : "—" },
        { dbField: "koffein_einh_mg", label: "Koffein", unit: "mg", format: v => v ? Math.round(v) : "—" }
    ];

    const META_COLUMNS = [
        { id: "VEGAN", label: "🌱 Vegan" }, { id: "VEGETARISCH", label: "🥚 Vegetarisch" }, { id: "koffeinhinweis", label: "☕ Koff." },
        { id: "flavoured_flag", label: "🍬 Flavoured" }, { id: "latte", label: "🥛 Latte" }, { id: "seasonal", label: "🎄 Seasonal" },
        { id: "season", label: "📅 Season" }, { id: "sugar_free", label: "🚫 Sugar free" }, { id: "protein", label: "💪 Protein" }, { id: "sahne", label: "🍦 Sahne" }
    ];
    const ALLERGEN_FIELDS = [
        { key: "ALLERGENE_Glutenhaltige_Getreide", label: "Glutenhaltig", icon: "🌾" }, { key: "ALLERGENE_Milch_Laktose", label: "Milch_Laktos", icon: "🥛" },
        { key: "ALLERGENE_Ei", label: "Ei", icon: "🥚" }, { key: "ALLERGENE_Soja", label: "Soja", icon: "🫘" }, { key: "ALLERGENE_Schalenfrüchte", label: "Schalenfrüch", icon: "🌰" },
        { key: "ALLERGENE_SO2_und_Sulphite", label: "SO2_und_Sulp", icon: "⚗️" }, { key: "ALLERGENE_Sesam", label: "Sesam", icon: "🌿" }, { key: "ALLERGENE_Erdnuesse", label: "Erdnuesse", icon: "🥜" },
        { key: "ALLERGENE_Senf", label: "Senf", icon: "🌱" }, { key: "ALLERGENE_Sellerie", label: "Sellerie", icon: "🥬" }, { key: "ALLERGENE_Lupinen", label: "Lupinen", icon: "🌼" },
        { key: "ALLERGENE_Krebs", label: "Krebs", icon: "🦀" }, { key: "ALLERGENE_Weichtiere", label: "Weichtiere", icon: "🐚" }, { key: "ALLERGENE_Fisch", label: "Fisch", icon: "🐟" }
    ];
    const ZUSATZSTOFF_FIELDS = [
        { key: "ZUSATZSTOFFE_Konservierungsmittel", label: "Konservi", icon: "🧪" }, { key: "ZUSATZSTOFFE_geschwaerzt", label: "geschwae", icon: "⚫" },
        { key: "ZUSATZSTOFFE_Geschmacksverstaerker", label: "Geschmac", icon: "👅" }, { key: "ZUSATZSTOFFE_Antioxidationsmittel", label: "Antioxid", icon: "🛡️" },
        { key: "ZUSATZSTOFFE_Farbstoffe", label: "Farbstof", icon: "🎨" }, { key: "ZUSATZSTOFFE_geschwefelt", label: "geschwef", icon: "💨" },
        { key: "ZUSATZSTOFFE_Phosphat", label: "Phosphat", icon: "🧂" }, { key: "ZUSATZSTOFFE_mit_Suessungsmitteln", label: "mit_Sues", icon: "🍬" }
    ];

    function escapeHtml(s) { return s ? String(s).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])) : ''; }
    function parseNumber(val) { if (val === undefined || val === null) return null; let num = parseFloat(String(val).trim().replace(',','.')); return isNaN(num) ? null : num; }
    function formatBooleanFlag(val) {
        if (val === undefined || val === null || val === '') return '—';
        const str = String(val).toLowerCase();
        if (str === 'ja' || str === 'true' || str === '1' || str === '✅') return '✅';
        if (str === 'nein' || str === 'false' || str === '2' || str === '0' || str === '❌') return '❌';
        return String(val);
    }

    function extractSizeKey(sizeRaw) {
        if (!sizeRaw) return null;
        const raw = String(sizeRaw).trim().toLowerCase();
        if (raw.includes('mini')) return 'mini'; if (raw.includes('short')) return 'short'; if (raw.includes('single')) return 'single';
        if (raw.includes('doppio')) return 'doppio'; if (raw.includes('tall')) return 'tall'; if (raw.includes('grande')) return 'grande';
        if (raw.includes('venti')) return 'venti'; if (raw.includes('ohne')) return 'ohne';
        const pumpMatch = raw.match(/(\d+)\s*pump/i);
        if (pumpMatch) { let num = pumpMatch[1]; if (num >= 1 && num <= 5) return `${num} Pump`; return '1 Pump'; }
        if (raw.includes('pump')) return '1 Pump';
        return null;
    }

    function extractAllAttributes(row) {
        let attrs = {};
        for (let m of META_COLUMNS) attrs[m.id] = (row[m.id] !== undefined && row[m.id] !== null && row[m.id] !== '') ? formatBooleanFlag(row[m.id]) : '—';
        attrs.temperatur = (row.temperature || row.Temperature || row.temperatur) ? formatBooleanFlag(row.temperature || row.Temperatur) : '—';
        attrs.sort_db = (row.sort_db !== undefined && row.sort_db !== null && row.sort_db !== '') ? String(row.sort_db) : '—';
        for (let a of ALLERGEN_FIELDS) attrs[a.key] = (row[a.key] !== undefined && row[a.key] !== null && row[a.key] !== '') ? formatBooleanFlag(row[a.key]) : '—';
        for (let z of ZUSATZSTOFF_FIELDS) attrs[z.key] = (row[z.key] !== undefined && row[z.key] !== null && row[z.key] !== '') ? formatBooleanFlag(row[z.key]) : '—';
        let combined = [];
        if (row.Merkmale && row.Merkmale !== '') combined.push(row.Merkmale);
        if (row.Allergene && row.Allergene !== '') combined.push(row.Allergene);
        attrs.freitext = combined.join(' · ') || '—';
        return attrs;
    }

    function buildDataStructures(items) {
        structuredData.clear(); drinkToVariants.clear(); milkNutritionMap.clear(); extraAttributesMap.clear();
        const tempDrinkSet = new Set();
        for (let row of items) {
            const pk = row.PK_STAR_STARBUCKS_GETRAENKE_SIMPLE || row.pk;
            if (!pk) continue;
            const getraenk = (row.GETRAENK || row.getraenk || 'Unbekannt').trim();
            let mainGroup = row.MAIN_GETRAENK || row.main_getraenk || 'Andere';
            let milk = row.MILCHART || row.milchart || '--- (keine Milchart)';
            let flavouredRaw = (row.flavoured !== undefined && row.flavoured !== null) ? String(row.flavoured) : '';
            let sizeRaw = (row.getraenk_groesse || row.groesse || '').trim();
            let sizeKey = extractSizeKey(sizeRaw);
            if (!sizeKey) continue;
            tempDrinkSet.add(getraenk);
            let nutrition = {};
            for (let n of NUTRIENT_MAPPING) { let val = parseNumber(row[n.dbField]); nutrition[n.dbField] = (val !== null && !isNaN(val)) ? val : null; }
            const mapKey = `${pk}|${milk}|${sizeKey}`;
            milkNutritionMap.set(mapKey, nutrition);
            const extraKey = `${pk}|${milk}|${sizeKey}|${flavouredRaw}`;
            extraAttributesMap.set(extraKey, extractAllAttributes(row));
            if (!structuredData.has(mainGroup)) structuredData.set(mainGroup, new Map());
            const getraenkMap = structuredData.get(mainGroup);
            if (!getraenkMap.has(getraenk)) getraenkMap.set(getraenk, new Map());
            const milkMap = getraenkMap.get(getraenk);
            if (!milkMap.has(milk)) milkMap.set(milk, new Set());
            milkMap.get(milk).add(flavouredRaw);
            if (!drinkToVariants.has(getraenk)) drinkToVariants.set(getraenk, new Map());
            const variantMap = drinkToVariants.get(getraenk);
            if (!variantMap.has(milk)) variantMap.set(milk, new Map());
            const flavMap = variantMap.get(milk);
            if (!flavMap.has(flavouredRaw)) flavMap.set(flavouredRaw, { pk, sizes: new Set(), extraBySize: new Map() });
            const info = flavMap.get(flavouredRaw);
            info.sizes.add(sizeKey);
            info.extraBySize.set(sizeKey, extraKey);
        }
        for (let [getraenk, milkMap] of drinkToVariants.entries()) {
            for (let [milk, flavMap] of milkMap.entries()) {
                for (let [flav, info] of flavMap.entries()) info.sizesArray = Array.from(info.sizes).sort((a,b) => SIZE_ORDER.indexOf(a) - SIZE_ORDER.indexOf(b));
            }
        }
        allGetraenkNames = Array.from(tempDrinkSet).sort((a,b) => a.localeCompare(b, 'de'));
    }

    // Tab1 Render/Table
    function renderFullTable(getraenkName) {
        const variantMap = drinkToVariants.get(getraenkName);
        if (!variantMap || variantMap.size === 0) return `<div class="empty-message">⚠️ Keine Daten für ${escapeHtml(getraenkName)}</div>`;
        let allSizesSet = new Set();
        for (let [milk, flavMap] of variantMap.entries()) for (let [flav, info] of flavMap.entries()) info.sizesArray.forEach(s => allSizesSet.add(s));
        const availableSizes = SIZE_ORDER.filter(s => allSizesSet.has(s));
        if (availableSizes.length === 0) return `<div class="empty-message">Keine Größeninformationen (inkl. Pump-Sizes 1-5 Pump)</div>`;
        let rows = [];
        for (let [milk, flavMap] of variantMap.entries()) for (let [flavouredRaw, { pk, sizesArray, extraBySize }] of flavMap.entries()) {
            const firstSize = sizesArray[0]; let extra = (firstSize && extraBySize.has(firstSize)) ? extraAttributesMap.get(extraBySize.get(firstSize)) || {} : {};
            rows.push({ milk, flavouredRaw, pk, sizesArray, extraBySize, sortDbValue: extra.sort_db || '—' });
        }
        rows.sort((a,b) => {
            if (currentSortColumn === "milk") return currentSortOrder === "asc" ? a.milk.localeCompare(b.milk) : b.milk.localeCompare(a.milk);
            else {
                let va = a.sortDbValue === '—' ? '' : a.sortDbValue, vb = b.sortDbValue === '—' ? '' : b.sortDbValue;
                let na = parseFloat(va), nb = parseFloat(vb);
                if (!isNaN(na) && !isNaN(nb)) return currentSortOrder === "asc" ? na - nb : nb - na;
                return currentSortOrder === "asc" ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
            }
        });
        let header = `<thead><tr><th rowspan="3">🔑 PK</th><th rowspan="3" class="sortable-col" id="sortableMilkHeader">🥛 MILCHART <span class="sort-indicator">${currentSortColumn==="milk"?(currentSortOrder==="asc"?"▲":"▼"):"⚬"}</span></th><th rowspan="3">🍬 flavoured</th><th rowspan="3">📏 Verfügbare Größen</th><th rowspan="3">🌡️ TEMPERATUR</th><th rowspan="3" class="sortable-col" id="sortableSortDbHeader">⚙️ sort_db <span class="sort-indicator">${currentSortColumn==="sort_db"?(currentSortOrder==="asc"?"▲":"▼"):"⚬"}</span></th>`;
        for (let sz of availableSizes) header += `<th colspan="${NUTRIENT_MAPPING.length}" rowspan="2" class="size-group-header">${SIZE_LABELS[sz] || sz}</th>`;
        for (let m of META_COLUMNS) header += `<th rowspan="3">${m.label}</th>`;
        header += `<th colspan="${ALLERGEN_FIELDS.length}" rowspan="2" class="allergen-group">🌿 Allergene</th><th colspan="${ZUSATZSTOFF_FIELDS.length}" rowspan="2" class="zusatz-group">🧪 Zusatzstoffe</th><th rowspan="3">📝 Merkmale+Allergene</th></tr><tr>`;
        for (let sz of availableSizes) for (let nut of NUTRIENT_MAPPING) header += `<th>${nut.label}<span class="subnutrient">${nut.unit}</span></th>`;
        header += `</tr><tr>`;
        for (let i=0;i<availableSizes.length*NUTRIENT_MAPPING.length;i++) header += `<th></th>`;
        for(let a of ALLERGEN_FIELDS) header += `<th class="allergen-group">${a.icon} ${a.label}</th>`;
        for(let z of ZUSATZSTOFF_FIELDS) header += `<th class="zusatz-group">${z.icon} ${z.label}</th>`;
        header += `</tr></thead>`;
        let body = '';
        for (let row of rows) {
            let cells = `<td class="text-left"><span class="pk-badge">🔑 ${escapeHtml(row.pk)}</span></td><td class="text-left"><strong>${escapeHtml(row.milk)}</strong></td><td>${row.flavouredRaw ? escapeHtml(row.flavouredRaw) : '❌'}</td><td class="text-left">${row.sizesArray.map(s=>SIZE_LABELS[s]||s).join(', ')}</td>`;
            let firstExtra = (row.sizesArray[0] && row.extraBySize.has(row.sizesArray[0])) ? extraAttributesMap.get(row.extraBySize.get(row.sizesArray[0])) || {} : {};
            cells += `<td>${escapeHtml(firstExtra.temperatur || '—')}</td><td>${escapeHtml(firstExtra.sort_db || '—')}</td>`;
            for (let sz of availableSizes) {
                if (!row.sizesArray.includes(sz)) { for(let n of NUTRIENT_MAPPING) cells += `<td>—</td>`; continue; }
                const mapKey = `${row.pk}|${row.milk}|${sz}`;
                const nutrition = milkNutritionMap.get(mapKey) || {};
                for (let n of NUTRIENT_MAPPING) cells += `<td>${n.format(nutrition[n.dbField])}</td>`;
            }
            for(let m of META_COLUMNS) cells += `<td>${escapeHtml(firstExtra[m.id] || '—')}</td>`;
            for(let a of ALLERGEN_FIELDS) cells += `<td class="allergen-group">${escapeHtml(firstExtra[a.key] || '—')}</td>`;
            for(let z of ZUSATZSTOFF_FIELDS) cells += `<td class="zusatz-group">${escapeHtml(firstExtra[z.key] || '—')}</td>`;
            cells += `<td class="text-left">${escapeHtml(firstExtra.freitext || '—')}</td>`;
            body += `<tr>${cells}</tr>`;
        }
        return `<div class="detail-header"><h1>🍹 ${escapeHtml(getraenkName)} <span style="font-size:1rem;">${rows.length} Varianten</span></h1></div><div class="table-wrapper"><table class="nutrition-master-table">${header}<tbody>${body}</tbody></table></div>`;
    }
    function attachSortHandlers() {
        const milkHead = document.getElementById('sortableMilkHeader');
        const sortHead = document.getElementById('sortableSortDbHeader');
        const refresh = () => { if(currentGetraenk && drinkToVariants.has(currentGetraenk)){ document.getElementById('detailContent').innerHTML = renderFullTable(currentGetraenk); attachSortHandlers(); highlightTreeForGetraenk(currentGetraenk); } };
        if(milkHead){ let newMilk = milkHead.cloneNode(true); milkHead.parentNode.replaceChild(newMilk, milkHead); newMilk.addEventListener('click',()=>{ currentSortColumn="milk"; currentSortOrder=currentSortOrder==="asc"?"desc":"asc"; refresh(); }); }
        if(sortHead){ let newSort = sortHead.cloneNode(true); sortHead.parentNode.replaceChild(newSort, sortHead); newSort.addEventListener('click',()=>{ currentSortColumn="sort_db"; currentSortOrder=currentSortOrder==="asc"?"desc":"asc"; refresh(); }); }
    }
    function highlightTreeForGetraenk(name) { document.querySelectorAll('.node.selected').forEach(n=>n.classList.remove('selected')); document.querySelector(`.node[data-type="getraenk"][data-name="${CSS.escape(name)}"]`)?.classList.add('selected'); }
    function setCurrentGetraenkAndRender(name) { if(!drinkToVariants.has(name)) return; currentGetraenk=name; document.getElementById('detailContent').innerHTML = renderFullTable(currentGetraenk); attachSortHandlers(); highlightTreeForGetraenk(name); document.getElementById('getraenkSearchInput').value=name; }
    function buildTreeHtml(){ let html='<ul class="tree">'; for(let main of Array.from(structuredData.keys()).sort()){ let getraenkeMap=structuredData.get(main); html+=`<li><div class="node" data-type="main"><span class="toggle-icon">▼</span><span class="node-content">📂 ${escapeHtml(main)}<span class="node-badge">${getraenkeMap.size}</span></span></div><ul class="children">`; for(let getraenk of Array.from(getraenkeMap.keys()).sort()){ html+=`<li><div class="node" data-type="getraenk" data-name="${escapeHtml(getraenk)}"><span class="toggle-icon">▼</span><span class="node-content">🍹 ${escapeHtml(getraenk)}<span class="node-badge">${getraenkeMap.get(getraenk).size}</span></span></div><ul class="children">`; for(let milk of Array.from(getraenkeMap.get(getraenk).keys()).sort()) html+=`<li><div class="node" data-type="milch"><span class="toggle-icon" style="visibility:hidden;">&nbsp;</span><span class="node-content">🥛 ${escapeHtml(milk)}<span class="node-badge">${getraenkeMap.get(getraenk).get(milk).size}</span></span></div></li>`; html+=`</ul></li>`; } html+=`</ul></li>`; } html+='</ul>'; return html; }
    function bindTreeEvents(){ document.getElementById('treeContainer')?.addEventListener('click',(e)=>{ let node=e.target.closest('.node'); if(!node) return; let toggle=node.querySelector('.toggle-icon'); let li=node.closest('li'); let childrenUl=li?.querySelector(':scope > .children'); if(toggle && (e.target===toggle || toggle.contains(e.target))){ if(childrenUl){ let vis=childrenUl.style.display!=='none'; childrenUl.style.display=vis?'none':'block'; toggle.textContent=vis?'▶':'▼'; } return; } if(node.dataset.type==='getraenk') setCurrentGetraenkAndRender(node.dataset.name); }); let input=document.getElementById('getraenkSearchInput'); if(input){ input.onchange=()=>{ let val=input.value.trim(); if(allGetraenkNames.includes(val)) setCurrentGetraenkAndRender(val); else if(val){ let match=allGetraenkNames.find(n=>n.toLowerCase()===val.toLowerCase()); if(match) setCurrentGetraenkAndRender(match); else input.value=''; } }; input.oninput=()=>{ let val=input.value.trim(); if(allGetraenkNames.includes(val)) setCurrentGetraenkAndRender(val); }; } }
    function updateTab1UI(){ document.getElementById('getraenkList').innerHTML=allGetraenkNames.map(n=>`<option value="${escapeHtml(n)}">`).join(''); document.getElementById('drinkCountBadge').innerText=allGetraenkNames.length; document.getElementById('treeContainer').innerHTML=buildTreeHtml(); document.querySelectorAll('.children').forEach(ul=>ul.style.display='block'); bindTreeEvents(); if(allGetraenkNames.length) setCurrentGetraenkAndRender(allGetraenkNames[0]); }
    
    // ================= TAB 2: FLAT TABLE mit Such- und Sortierfunktion =================
    function buildFlatTableHeaders() {
        if(!flatRawData.length) return [];
        const allKeys = new Set();
        flatRawData.forEach(item => { Object.keys(item).forEach(k => allKeys.add(k)); });
        const priority = ["PK_STAR_STARBUCKS_GETRAENKE_SIMPLE","MAIN_GETRAENK","GETRAENK","MILCHART","flavoured","getraenk_groesse","kalorien_einh_kcal","fett_total_einh_g","kohlenhydrate_total_einh_g","zucker","eiweiss_einh_g"];
        let ordered = Array.from(allKeys);
        ordered.sort((a,b)=>{
            let ia=priority.indexOf(a), ib=priority.indexOf(b);
            if(ia!==-1 && ib!==-1) return ia-ib;
            if(ia!==-1) return -1; if(ib!==-1) return 1;
            return a.localeCompare(b);
        });
        return ordered;
    }
    function renderFlatTable(searchTerm="", sortField=flatSortField, sortDir=flatSortDirection) {
        if(!flatRawData.length) { document.getElementById("flatTableWrapper").innerHTML='<div class="empty-message">📭 Keine Daten vom Webservice empfangen.</div>'; return; }
        let filtered = flatRawData.filter(row => {
            if(!searchTerm) return true;
            const haystack = Object.values(row).map(v=>String(v??"")).join(" ").toLowerCase();
            return haystack.includes(searchTerm.toLowerCase());
        });
        filtered.sort((a,b)=>{
            let valA = a[sortField] ?? "", valB = b[sortField] ?? "";
            let numA = parseFloat(String(valA).replace(",",".")), numB = parseFloat(String(valB).replace(",","."));
            if(!isNaN(numA) && !isNaN(numB)) return sortDir==="asc" ? numA-numB : numB-numA;
            return sortDir==="asc" ? String(valA).localeCompare(String(valB)) : String(valB).localeCompare(String(valA));
        });
        filteredFlatData = filtered;
        const headers = buildFlatTableHeaders();
        const thHtml = headers.map(h => `<th data-field="${escapeHtml(h)}">${escapeHtml(h)} ${flatSortField===h ? (flatSortDirection==="asc"?"▲":"▼") : "↕️"}</th>`).join('');
        let tbody = '';
        for(let row of filtered){
            let cells = headers.map(h => `<td style="white-space: nowrap;">${escapeHtml(String(row[h] ?? "—"))}</td>`).join('');
            tbody += `<tr>${cells}</tr>`;
        }
        const html = `<div style="overflow-x:auto;"><table class="flat-data-table"><thead><tr>${thHtml}</tr></thead><tbody>${tbody || '<tr><td colspan="100" class="empty-message">Keine Einträge gefunden.</td></tr>'}</tbody></table></div>`;
        document.getElementById("flatTableWrapper").innerHTML = html;
        document.getElementById("flatRecordCount").innerText = `${filtered.length} / ${flatRawData.length} Einträge`;
        document.querySelectorAll(".flat-data-table th").forEach(th => {
            th.addEventListener("click", (e) => {
                const field = th.dataset.field;
                if(field === flatSortField) flatSortDirection = flatSortDirection==="asc" ? "desc" : "asc";
                else { flatSortField = field; flatSortDirection = "asc"; }
                const searchVal = document.getElementById("flatSearchInput").value;
                renderFlatTable(searchVal, flatSortField, flatSortDirection);
            });
        });
    }
    
    // Daten laden
    async function init() {
        const statusBadge = document.getElementById('apiStatusBadge');
        const treeContainer = document.getElementById('treeContainer');
        const detailDiv = document.getElementById('detailContent');
        try {
            const controller = new AbortController(); setTimeout(()=>controller.abort(),10000);
            const res = await fetch(API_URL, { signal: controller.signal });
            if(!res.ok) throw new Error(`HTTP ${res.status}`);
            let data = await res.json();
            if(data && Array.isArray(data.data)) allItems = data.data;
            else if(Array.isArray(data)) allItems = data;
            else throw new Error('API-Format ungültig');
            if(allItems.length===0) throw new Error('Keine Datensätze');
            flatRawData = [...allItems];
            buildDataStructures(allItems);
            updateTab1UI();
            // Flat table initial render
            renderFlatTable("", flatSortField, flatSortDirection);
            statusBadge.innerHTML = '✅ Live verbunden';
            statusBadge.style.background = '#c8e6d9';
        } catch(err) {
            console.error(err);
            treeContainer.innerHTML = `<div class="error-message">❌ Webservice nicht erreichbar.<br>${err.message}</div>`;
            detailDiv.innerHTML = `<div class="error-message">Daten konnten nicht geladen werden.</div>`;
            document.getElementById("flatTableWrapper").innerHTML = `<div class="error-message">❌ Fehler: ${err.message}<br>Starten Sie den Star-Starbucks-API-Server.</div>`;
            statusBadge.innerHTML = '❌ API offline';
        }
    }
    
    // Tab switching
    document.querySelectorAll('.tab-button').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-button').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            const tabId = btn.dataset.tab;
            document.querySelectorAll('.pane').forEach(pane=>pane.classList.remove('active'));
            if(tabId === 'tab1') document.getElementById('paneExplorer').classList.add('active');
            else document.getElementById('paneAllData').classList.add('active');
        });
    });
    document.getElementById('flatSearchInput')?.addEventListener('input', (e) => {
        renderFlatTable(e.target.value, flatSortField, flatSortDirection);
    });
    init();
</script>
