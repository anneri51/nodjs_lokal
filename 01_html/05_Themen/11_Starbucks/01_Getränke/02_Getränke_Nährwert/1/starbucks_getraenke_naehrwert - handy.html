<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Starbucks® Explorer – Rote Hintergründe bei Allergenen/Zusatzstoffen (true)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f5efe9;
            color: #2c221b;
            height: 100vh;
            overflow: hidden;
        }
        .tab-bar {
            background: white;
            border-bottom: 1px solid #e2d9d2;
            padding: 0 12px;
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            overflow-x: auto;
        }
        .tab-button {
            background: none;
            border: none;
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 700;
            color: #5e4b38;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            white-space: nowrap;
        }
        .tab-button.active {
            color: #1e5a3a;
            border-bottom-color: #1e7b4b;
            background: #fefcf9;
        }
        .panes { flex: 1; overflow: hidden; }
        .pane { width: 100%; height: 100%; overflow: hidden; display: none; }
        .pane.active { display: flex; flex-direction: column; }
        
        /* Tab 1: vertikal gestapelt */
        .app-container { display: flex; flex-direction: column; height: 100%; }
        .sidebar {
            background: white;
            border-bottom: 1px solid #e2d9d2;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            max-height: 45vh;
            flex-shrink: 0;
        }
        .sidebar-header { padding: 12px 16px 8px; border-bottom: 2px solid #1e7b4b; }
        .sidebar-header h2 { font-size: 1.2rem; font-weight: 800; color: #1e5a3a; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .filter-section { padding: 10px 12px; background: #fefcf9; border-bottom: 1px solid #e9e0d8; }
        .searchable-dropdown input, .tree-filter input { width: 100%; padding: 10px 14px; border-radius: 60px; border: 1px solid #d6cbbc; font-size: 0.9rem; background: #fff9f5; }
        .multiselect-actions { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
        .multiselect-actions button { background: #ede3db; border: none; border-radius: 60px; padding: 8px 16px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
        .selected-counter { background: #1e7b4b; color: white; border-radius: 40px; padding: 6px 14px; font-size: 0.75rem; font-weight: bold; }
        .tree-container { padding: 8px 12px; flex: 1; overflow-y: auto; font-size: 0.85rem; }
        .tree, .tree ul { list-style: none; padding-left: 18px; }
        .tree { padding-left: 0; }
        .tree li { margin: 6px 0; }
        .tree .node { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 50px; cursor: pointer; }
        .tree .node:active { background: #ede3db; }
        .toggle-icon { width: 24px; cursor: pointer; color: #1e7b4b; font-size: 0.9rem; text-align: center; }
        .getraenk-checkbox { width: 20px; height: 20px; accent-color: #1e7b4b; }
        .node-badge { background: #e2d9d2; border-radius: 40px; padding: 2px 10px; font-size: 0.7rem; }
        
        /* Hauptbereich: Getränkekarten mit Größen-Blöcken */
        .main-content { flex: 1; overflow-y: auto; padding: 16px 12px; background: #faf7f3; }
        .grouped-drinks-container { display: flex; flex-direction: column; gap: 24px; }
        .drink-card { background: white; border-radius: 28px; border: 1px solid #e2d9d2; overflow: hidden; }
        .drink-card h2 {
            background: #fef3e8; margin: 0; padding: 14px 16px; font-size: 1.3rem;
            font-weight: 800; color: #1e5a3a; display: flex; justify-content: space-between;
            flex-wrap: wrap; gap: 8px;
        }
        .drink-actions { display: flex; gap: 8px; }
        .sort-btn { background: #e2d9d2; border: none; border-radius: 40px; padding: 6px 14px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .size-filter-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 16px; }
        .size-filter-btn { background: #ede3db; border: none; border-radius: 60px; padding: 6px 14px; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
        .size-filter-btn.active { background: #1e7b4b; color: white; }
        
        /* Vertikale Größen-Blöcke */
        .size-blocks-container { display: flex; flex-direction: column; gap: 16px; margin: 0 12px 16px 12px; }
        .size-block {
            background: #fefaf5;
            border-radius: 24px;
            border: 1px solid #e9dfd6;
            overflow: hidden;
        }
        .size-header {
            background: #f3ede7;
            padding: 12px 16px;
            font-weight: 800;
            font-size: 1rem;
            color: #1e5a3a;
            border-bottom: 1px solid #e2d9d2;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }
        .size-badge { background: #1e7b4b20; padding: 4px 12px; border-radius: 60px; font-size: 0.7rem; }
        
        /* Info-Zeilen (Allergene, Zusatzstoffe, Weitere Merkmale) */
        .info-lines {
            background: #fffdf9;
            padding: 10px 16px;
            border-bottom: 1px solid #ede3db;
        }
        .info-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.7rem;
        }
        .info-line:last-child { margin-bottom: 0; }
        .line-label {
            font-weight: 800;
            color: #2c5a2e;
            min-width: 90px;
            background: #e8dfd7;
            padding: 2px 10px;
            border-radius: 40px;
            text-align: center;
        }
        .line-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1;
        }
        .info-chip {
            background: #f3ede7;
            padding: 4px 12px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: 0.1s;
        }
        /* TRUE (✅) – roter Hintergrund */
        .info-chip.chip-true {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        /* FALSE (❌) – neutraler grauer Hintergrund (optional) */
        .info-chip.chip-false {
            background-color: #e9ecef;
            color: #495057;
        }
        .value-yes { /* wird nicht mehr direkt für Hintergrund verwendet, bleibt aber für eventuelle Textfarben */
            font-weight: 700;
        }
        .nutrient-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            padding: 12px;
            background: white;
        }
        .nutrient-item {
            background: #fefcf9;
            border-radius: 20px;
            padding: 8px 8px;
            text-align: center;
            font-size: 0.7rem;
            border: 1px solid #ede3db;
        }
        .nutrient-label { font-weight: 700; color: #5e4b38; margin-bottom: 4px; }
        .nutrient-value { font-size: 0.9rem; font-weight: 800; }
        
        /* Farbklassen für Nährwerte */
        .grade-1 { background-color: #a3e4a7; } .grade-2 { background-color: #c8f0c0; }
        .grade-3 { background-color: #fff2b5; } .grade-4 { background-color: #ffe68f; }
        .grade-5 { background-color: #ffcc80; } .grade-6 { background-color: #ffb74d; }
        .grade-7 { background-color: #ffa270; } .grade-8 { background-color: #ff8a6f; }
        .grade-9 { background-color: #f56c4e; } .grade-10 { background-color: #e33b2c; color: white; }
        .grade-na { background-color: #e9e0d8; }
        
        /* Tab 2: Rohdaten */
        .flat-data-container { display: flex; flex-direction: column; height: 100%; padding: 12px; gap: 12px; background: #faf7f3; overflow: hidden; }
        .stats-grid { display: flex; flex-wrap: wrap; gap: 8px; background: white; padding: 10px; border-radius: 24px; max-height: 110px; overflow-y: auto; }
        .stat-card { background: #fef6ef; padding: 4px 12px; border-radius: 32px; font-size: 0.7rem; font-weight: 600; }
        .filter-row { background: white; border-radius: 24px; padding: 10px; border: 1px solid #e2d9d2; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .filter-row label { font-size: 0.75rem; font-weight: bold; color: #2c5a2e; }
        .dropdown-search { flex: 1; min-width: 140px; }
        .dropdown-search input { width: 100%; padding: 8px 12px; border-radius: 60px; border: 1px solid #d6cbbc; font-size: 0.8rem; }
        .switch-group { background: white; border-radius: 24px; padding: 12px; border: 1px solid #e2d9d2; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        .switch-item { display: inline-flex; align-items: center; gap: 6px; background: #f3ede7; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; }
        .switch-item input { width: 32px; height: 18px; appearance: none; background: #ccc; border-radius: 20px; position: relative; cursor: pointer; transition: 0.2s; }
        .switch-item input:checked { background: #1e7b4b; }
        .switch-item input::before { content: ""; width: 16px; height: 16px; background: white; border-radius: 50%; position: absolute; top: 1px; left: 2px; transition: 0.2s; }
        .switch-item input:checked::before { left: 14px; }
        .column-filters-bar { background: white; border-radius: 24px; padding: 10px; border: 1px solid #e2d9d2; max-height: 130px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 8px; }
        .col-filter-input { display: inline-flex; align-items: center; gap: 5px; background: #f3ede7; border-radius: 40px; padding: 4px 10px; font-size: 0.7rem; }
        .col-filter-input input { width: 80px; border: none; background: transparent; padding: 5px; font-size: 0.75rem; }
        .flat-search-bar { background: white; border-radius: 60px; padding: 6px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .flat-search-bar input { flex: 1; border: none; padding: 10px 6px; font-size: 0.85rem; }
        .flat-table-wrapper { flex: 1; overflow: auto; background: white; border-radius: 20px; border: 1px solid #e2d9d2; }
        .flat-data-table { width: 100%; border-collapse: collapse; font-size: 0.7rem; min-width: 800px; }
        .flat-data-table th { position: sticky; top: 0; background: #2c5a2e; color: white; padding: 10px 6px; }
        .flat-data-table td { padding: 8px 6px; border-bottom: 1px solid #ecdfd5; }
        .record-count { background: #e9dfd7; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem; font-weight: bold; }
        .status-badge { background: #e9dfd7; border-radius: 30px; padding: 4px 12px; font-size: 0.7rem; }
        .reset-switches-btn { background: #ede3db; border: none; border-radius: 40px; padding: 6px 14px; font-size: 0.7rem; font-weight: 600; cursor: pointer; margin-left: auto; }
        @media (max-width: 560px) {
            .line-label { min-width: 70px; }
        }
        @media (min-width: 768px) { .app-container { flex-direction: row; } .sidebar { max-height: 100%; width: 380px; border-right: 1px solid #e2d9d2; border-bottom: none; } }
        .empty-message { padding: 24px; text-align: center; color: #8b694a; background: #fef3e8; border-radius: 28px; }
        button { touch-action: manipulation; }
    </style>
</head>
<body>
<div style="display: flex; flex-direction: column; height: 100vh;">
    <div class="tab-bar">
        <button class="tab-button active" data-tab="tab1">🍹 Getränke (rote Marker bei Allergenen/Zusatzstoffen)</button>
        <button class="tab-button" data-tab="tab2">📊 Rohdaten + Filter</button>
    </div>
    <div class="panes">
        <!-- TAB 1: Vertikale Größen-Blöcke mit roten Hintergründen bei true -->
        <div id="paneExplorer" class="pane active">
            <div class="app-container">
                <div class="sidebar">
                    <div class="sidebar-header"><h2>📁 Getränke-Baum <span id="apiStatusBadge" class="status-badge">⚡ Live</span></h2></div>
                    <div class="filter-section">
                        <div class="searchable-dropdown"><input type="text" id="getraenkSearchInput" placeholder="🔍 Direktauswahl" list="getraenkList"><datalist id="getraenkList"></datalist></div>
                        <div class="tree-filter"><input type="text" id="treeFilterInput" placeholder="🔎 Baum filtern"></div>
                        <div class="multiselect-actions"><button id="selectAllBtn">✅ Alle auswählen</button><button id="clearAllBtn">❌ Alle abwählen</button><span id="selectedCountBadge" class="selected-counter">0</span></div>
                    </div>
                    <div class="tree-container" id="treeContainer">🌿 Lade Daten...</div>
                </div>
                <div class="main-content" id="mainContentArea"><div id="detailContent">✨ Wählen Sie Getränke aus – jedes Allergen / jeder Zusatzstoff mit ✅ erhält einen roten Hintergrund.</div></div>
            </div>
        </div>
        <!-- TAB 2: Rohdaten mit Allergen-/Zusatzstoff-Filtern -->
        <div id="paneAllData" class="pane">
            <div class="flat-data-container">
                <div class="stats-grid" id="statsGrid"></div>
                <div class="filter-row">
                    <label>📁 MAIN_GETRAENK:</label><div class="dropdown-search"><input type="text" id="mainGetraenkFilter" list="mainGetraenkList"><datalist id="mainGetraenkList"></datalist></div>
                    <label>🥤 GETRAENK:</label><div class="dropdown-search"><input type="text" id="getraenkFlatFilter" list="getraenkFlatList"><datalist id="getraenkFlatList"></datalist></div>
                    <button id="clearMainGetraenkBtn" style="background:#ede3db; border:none; border-radius:40px; padding:6px 12px;">❌ Reset</button>
                </div>
                <div class="switch-group" id="allergenSwitchesContainer"><span>🌾 Allergene</span><button id="resetAllergenSwitches" class="reset-switches-btn">Reset</button></div>
                <div class="switch-group" id="additiveSwitchesContainer"><span>🧪 Zusatzstoffe</span><button id="resetAdditiveSwitches" class="reset-switches-btn">Reset</button></div>
                <div class="flat-search-bar"><input type="text" id="flatGlobalSearch" placeholder="🌍 Global suchen"><span id="flatRecordCount" class="record-count">0</span><button id="clearColumnFiltersBtn" style="background:#ede3db; border:none; border-radius:40px; padding:6px 12px;">🗑️ Reset Filter</button></div>
                <div class="column-filters-bar" id="columnFiltersContainer"></div>
                <div class="flat-table-wrapper" id="flatTableWrapper"><div class="empty-message">📡 Wird geladen ...</div></div>
            </div>
        </div>
    </div>
</div>
<script>
    const API_URL = 'http://localhost:5000/star_starbucks_getraenke/full';
    let allItems = [], structuredData = new Map(), drinkToVariants = new Map(), milkNutritionMap = new Map(), extraAttributesMap = new Map();
    let allGetraenkNames = [], selectedGetraenke = new Set(), currentTreeFilter = "", drinkSortMap = new Map(), visibleSizesPerDrink = new Map(), flatRawData = [], columnFilters = {}, globalFilterFlat = "", globalNutrientValues = {};
    let mainGetraenkFilterValue = "", getraenkFlatFilterValue = "", allergenFilters = {}, additiveFilters = {};

    const SIZE_ORDER = ["mini","short","single","doppio","tall","grande","venti","1 Pump","2 Pump","3 Pump","4 Pump","5 Pump","ohne"];
    const SIZE_LABELS = { mini:"Mini", short:"Short", single:"Single", doppio:"Doppio", tall:"Tall", grande:"Grande", venti:"Venti", "1 Pump":"1 Pump","2 Pump":"2 Pump","3 Pump":"3 Pump","4 Pump":"4 Pump","5 Pump":"5 Pump", ohne:"Ohne" };
    const NUTRIENT_MAPPING = [
        { dbField: "groesse_kilojoules_einh_kj", label: "kJ", unit: "kJ", format: v => v ? Math.round(v) : "—" },
        { dbField: "kalorien_einh_kcal", label: "kcal", unit: "kcal", format: v => v ? Math.round(v) : "—" },
        { dbField: "fett_total_einh_g", label: "Fett", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "davon_gesaettigte_fettsaeuren_einh_g", label: "ges.Fetts.", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "kohlenhydrate_total_einh_g", label: "Kohlenhydr.", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "davon_zucker_einh_g", label: "Zucker", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "ballaststoffe_einh_g", label: "Ballastst.", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "eiweiss_einh_g", label: "Eiweiß", unit: "g", format: v => v ? v.toFixed(1) : "—" },
        { dbField: "salzgeh_alt_einh_g", label: "Salz", unit: "g", format: v => v ? v.toFixed(2) : "—" },
        { dbField: "koffein_einh_mg", label: "Koffein", unit: "mg", format: v => v ? Math.round(v) : "—" }
    ];
    const META_COLUMNS = [{ id: "VEGAN", label: "🌱 Vegan" },{ id: "VEGETARISCH", label: "🥚 Vegetarisch" },{ id: "koffeinhinweis", label: "☕ Koff." },{ id: "flavoured_flag", label: "🍬 Flavoured" },{ id: "latte", label: "🥛 Latte" },{ id: "seasonal", label: "🎄 Seasonal" },{ id: "season", label: "📅 Season" },{ id: "sugar_free", label: "🚫 Zuckerfrei" },{ id: "protein", label: "💪 Protein" },{ id: "sahne", label: "🍦 Sahne" }];
    const ALLERGEN_FIELDS = [{ key: "ALLERGENE_Glutenhaltige_Getreide", label: "Gluten", icon: "🌾" },{ key: "ALLERGENE_Milch_Laktose", label: "Milch", icon: "🥛" },{ key: "ALLERGENE_Ei", label: "Ei", icon: "🥚" },{ key: "ALLERGENE_Soja", label: "Soja", icon: "🫘" },{ key: "ALLERGENE_Schalenfrüchte", label: "Schalenfr.", icon: "🌰" },{ key: "ALLERGENE_SO2_und_Sulphite", label: "SO2", icon: "⚗️" },{ key: "ALLERGENE_Sesam", label: "Sesam", icon: "🌿" },{ key: "ALLERGENE_Erdnuesse", label: "Erdnuss", icon: "🥜" },{ key: "ALLERGENE_Senf", label: "Senf", icon: "🌱" },{ key: "ALLERGENE_Sellerie", label: "Sellerie", icon: "🥬" },{ key: "ALLERGENE_Lupinen", label: "Lupinen", icon: "🌼" }];
    const ZUSATZSTOFF_FIELDS = [{ key: "ZUSATZSTOFFE_Konservierungsmittel", label: "Konserv.", icon: "🧪" },{ key: "ZUSATZSTOFFE_geschwaerzt", label: "geschwärzt", icon: "⚫" },{ key: "ZUSATZSTOFFE_Geschmacksverstaerker", label: "Geschm.", icon: "👅" },{ key: "ZUSATZSTOFFE_Antioxidationsmittel", label: "Antioxid", icon: "🛡️" },{ key: "ZUSATZSTOFFE_Farbstoffe", label: "Farbstoff", icon: "🎨" },{ key: "ZUSATZSTOFFE_geschwefelt", label: "geschwefelt", icon: "💨" },{ key: "ZUSATZSTOFFE_Phosphat", label: "Phosphat", icon: "🧂" },{ key: "ZUSATZSTOFFE_mit_Suessungsmitteln", label: "Süßungsm.", icon: "🍬" }];
    
    function escapeHtml(s) { return s ? String(s).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])) : ''; }
    function parseNumber(v) { if(v===undefined||v===null) return null; let n=parseFloat(String(v).trim().replace(',','.')); return isNaN(n)?null:n; }
    function formatBooleanFlag(v){ if(v===undefined||v===null||v==='') return '—'; let s=String(v).toLowerCase(); if(s==='ja'||s==='true'||s==='1'||s==='3'||s==='4') return '✅'; if(s==='nein'||s==='false'||s==='2'||s==='0') return '❌'; return String(v); }
    function extractSizeKey(sizeRaw){ if(!sizeRaw) return null; let raw=String(sizeRaw).trim().toLowerCase(); if(raw.includes('mini')) return 'mini'; if(raw.includes('short')) return 'short'; if(raw.includes('single')) return 'single'; if(raw.includes('doppio')) return 'doppio'; if(raw.includes('tall')) return 'tall'; if(raw.includes('grande')) return 'grande'; if(raw.includes('venti')) return 'venti'; if(raw.includes('ohne')) return 'ohne'; let pm=raw.match(/(\d+)\s*pump/i); if(pm){ let num=pm[1]; if(num>=1&&num<=5) return `${num} Pump`; return '1 Pump';} return null; }
    function extractAllAttributes(row){ let attrs={}; for(let m of META_COLUMNS) attrs[m.id]=(row[m.id]!==undefined&&row[m.id]!==null&&row[m.id]!=='')?formatBooleanFlag(row[m.id]):'—'; attrs.temperatur=(row.temperature||row.Temperatur)?formatBooleanFlag(row.temperature||row.Temperatur):'—'; attrs.sort_db=(row.sort_db!==undefined&&row.sort_db!==null&&row.sort_db!=='')?String(row.sort_db):'—'; for(let a of ALLERGEN_FIELDS) attrs[a.key]=(row[a.key]!==undefined&&row[a.key]!==null&&row[a.key]!=='')?formatBooleanFlag(row[a.key]):'—'; for(let z of ZUSATZSTOFF_FIELDS) attrs[z.key]=(row[z.key]!==undefined&&row[z.key]!==null&&row[z.key]!=='')?formatBooleanFlag(row[z.key]):'—'; let c=[]; if(row.Merkmale) c.push(row.Merkmale); if(row.Allergene) c.push(row.Allergene); attrs.freitext=c.join(' · ')||'—'; return attrs; }
    function rebuildGlobalNutrientRanges() { globalNutrientValues={}; for(let nut of NUTRIENT_MAPPING) globalNutrientValues[nut.dbField]=[]; for(let row of allItems) for(let nut of NUTRIENT_MAPPING){ let val=parseNumber(row[nut.dbField]); if(val!==null&&!isNaN(val)) globalNutrientValues[nut.dbField].push(val); } for(let nut of NUTRIENT_MAPPING) globalNutrientValues[nut.dbField].sort((a,b)=>a-b); }
    function getGradeClass(nutrientDbField, value) { if(value===null||value==='—'||isNaN(value)) return 'grade-na'; let numeric=parseFloat(value); let arr=globalNutrientValues[nutrientDbField]; if(!arr.length) return 'grade-na'; let rank=arr.findIndex(v=>v>=numeric); if(rank===-1) rank=arr.length-1; let percentile=(rank+1)/arr.length; let grade=Math.min(10,Math.max(1,Math.ceil(percentile*10))); const map={1:'grade-1',2:'grade-2',3:'grade-3',4:'grade-4',5:'grade-5',6:'grade-6',7:'grade-7',8:'grade-8',9:'grade-9',10:'grade-10'}; return map[grade]; }
    
    function buildDataStructures(items) {
        structuredData.clear(); drinkToVariants.clear(); milkNutritionMap.clear(); extraAttributesMap.clear();
        let tempDrinkSet = new Set();
        for(let row of items){
            let pk = row.PK_STAR_STARBUCKS_GETRAENKE_SIMPLE || row.pk; if(!pk) continue;
            let getraenk = (row.GETRAENK || row.getraenk || 'Unbekannt').trim();
            let mainGroup = row.MAIN_GETRAENK || row.main_getraenk || 'Andere';
            let milk = row.MILCHART || row.milchart || '---';
            let flavouredRaw = (row.flavoured !== undefined && row.flavoured !== null) ? String(row.flavoured) : '';
            let sizeKey = extractSizeKey(row.getraenk_groesse || row.groesse || ''); if(!sizeKey) continue;
            tempDrinkSet.add(getraenk);
            let nutrition = {}; for(let n of NUTRIENT_MAPPING) { let val=parseNumber(row[n.dbField]); nutrition[n.dbField]=(val!==null&&!isNaN(val))?val:null; }
            milkNutritionMap.set(`${pk}|${milk}|${sizeKey}`, nutrition);
            extraAttributesMap.set(`${pk}|${milk}|${sizeKey}|${flavouredRaw}`, extractAllAttributes(row));
            if(!structuredData.has(mainGroup)) structuredData.set(mainGroup, new Map());
            let getraenkMap = structuredData.get(mainGroup);
            if(!getraenkMap.has(getraenk)) getraenkMap.set(getraenk, new Map());
            let milkMap = getraenkMap.get(getraenk);
            if(!milkMap.has(milk)) milkMap.set(milk, new Set());
            milkMap.get(milk).add(flavouredRaw);
            if(!drinkToVariants.has(getraenk)) drinkToVariants.set(getraenk, new Map());
            let variantMap = drinkToVariants.get(getraenk);
            if(!variantMap.has(milk)) variantMap.set(milk, new Map());
            let flavMap = variantMap.get(milk);
            if(!flavMap.has(flavouredRaw)) flavMap.set(flavouredRaw, { pk, sizes: new Set(), extraBySize: new Map() });
            let info = flavMap.get(flavouredRaw);
            info.sizes.add(sizeKey);
            info.extraBySize.set(sizeKey, `${pk}|${milk}|${sizeKey}|${flavouredRaw}`);
        }
        for(let [getraenk, milkMap] of drinkToVariants.entries())
            for(let [milk, flavMap] of milkMap.entries())
                for(let [flav, info] of flavMap.entries())
                    info.sizesArray = Array.from(info.sizes).sort((a,b)=>SIZE_ORDER.indexOf(a)-SIZE_ORDER.indexOf(b));
        allGetraenkNames = Array.from(tempDrinkSet).sort();
        rebuildGlobalNutrientRanges();
    }
    
    // Baum (identisch)
    function renderTree() { let html='<ul class="tree">'; for(let main of Array.from(structuredData.keys()).sort()){ let getraenkeMap=structuredData.get(main); let filtered=Array.from(getraenkeMap.keys()).filter(n=>currentTreeFilter===""||n.toLowerCase().includes(currentTreeFilter.toLowerCase())).sort(); if(!filtered.length) continue; html+=`<li><div class="node"><span class="toggle-icon">▶</span><span class="node-content">📂 ${escapeHtml(main)}<span class="node-badge">${filtered.length}</span></span></div><ul class="children" style="display:none;">`; for(let g of filtered){ let checked=selectedGetraenke.has(g)?'checked':''; html+=`<li><div class="node"><span class="toggle-icon">▶</span><input type="checkbox" class="getraenk-checkbox" value="${escapeHtml(g)}" ${checked}><span class="node-content">🍹 ${escapeHtml(g)}</span></div><ul class="children" style="display:none;">`; for(let milk of Array.from(getraenkeMap.get(g).keys()).sort()) html+=`<li><div class="node"><span class="toggle-icon" style="visibility:hidden;">&nbsp;</span><span class="node-content">🥛 ${escapeHtml(milk)}</span></div></li>`; html+=`</ul></li>`; } html+=`</ul></li>`; } html+='</ul>'; document.getElementById('treeContainer').innerHTML=html; attachTreeEvents(); }
    function attachTreeEvents(){ document.querySelectorAll('.toggle-icon').forEach(icon=>icon.addEventListener('click',(e)=>{ e.stopPropagation(); let li=icon.closest('li'); let ul=li?.querySelector(':scope > .children'); if(ul){ let vis=ul.style.display!=='none'; ul.style.display=vis?'none':'block'; icon.textContent=vis?'▶':'▼'; } })); document.querySelectorAll('.getraenk-checkbox').forEach(cb=>cb.addEventListener('change',()=>{ let name=cb.value; if(cb.checked) selectedGetraenke.add(name); else selectedGetraenke.delete(name); renderSelectedTables(); updateTreeCheckboxes(); document.getElementById('selectedCountBadge').innerText=`${selectedGetraenke.size}`; })); }
    function updateTreeCheckboxes(){ document.querySelectorAll('.getraenk-checkbox').forEach(cb=>{ cb.checked=selectedGetraenke.has(cb.value); }); }
    
    // Neu: Drei Info-Zeilen oberhalb der Nährstoffe mit roter Hintergrundfarbe bei true (✅)
    function renderSelectedTables() {
        let container = document.getElementById('detailContent');
        if (selectedGetraenke.size === 0) { container.innerHTML = '<div class="empty-message">✨ Keine Getränke ausgewählt.</div>'; return; }
        let html = '<div class="grouped-drinks-container">';
        for (let drink of Array.from(selectedGetraenke).sort()) if (drinkToVariants.has(drink)) html += renderDrinkCardVertical(drink);
        html += '</div>';
        container.innerHTML = html;
        document.querySelectorAll('.size-filter-btn').forEach(btn => btn.addEventListener('click', (e) => {
            let drink = btn.dataset.drink, size = btn.dataset.size;
            let vis = visibleSizesPerDrink.get(drink) || new Set();
            vis.has(size) ? vis.delete(size) : vis.add(size);
            visibleSizesPerDrink.set(drink, vis);
            renderSelectedTables();
        }));
    }
    
    function renderDrinkCardVertical(drinkName) {
        let variantMap = drinkToVariants.get(drinkName);
        let allSizesSet = new Set();
        for (let [milk, flavMap] of variantMap.entries()) for (let [flav, info] of flavMap.entries()) info.sizesArray.forEach(s => allSizesSet.add(s));
        let availableSizes = SIZE_ORDER.filter(s => allSizesSet.has(s));
        let visibleSet = visibleSizesPerDrink.get(drinkName) || new Set(availableSizes);
        let sortOrder = drinkSortMap.get(drinkName);
        
        let rows = [];
        for (let [milk, flavMap] of variantMap.entries()) {
            for (let [flavouredRaw, { pk, sizesArray, extraBySize }] of flavMap.entries()) {
                for (let sizeKey of sizesArray) {
                    let extra = extraBySize.has(sizeKey) ? extraAttributesMap.get(extraBySize.get(sizeKey)) || {} : {};
                    let nutrition = milkNutritionMap.get(`${pk}|${milk}|${sizeKey}`) || {};
                    rows.push({ milk, flavouredRaw, sizeKey, pk, extra, nutrition });
                }
            }
        }
        if (sortOrder === 'asc' || sortOrder === 'desc') {
            rows.sort((a,b) => { let va=a.extra.sort_db||'—', vb=b.extra.sort_db||'—'; let na=parseFloat(String(va).replace(',','.')), nb=parseFloat(String(vb).replace(',','.')); let aN=!isNaN(na)&&va!=='—', bN=!isNaN(nb)&&vb!=='—'; if(aN&&bN) return sortOrder==='asc' ? na-nb : nb-na; if(aN) return -1; if(bN) return 1; return 0; });
        } else rows.sort((a,b)=> a.milk.localeCompare(b.milk) || a.flavouredRaw.localeCompare(b.flavouredRaw) || SIZE_ORDER.indexOf(a.sizeKey)-SIZE_ORDER.indexOf(b.sizeKey));
        
        let filteredRows = rows.filter(r => visibleSet.has(r.sizeKey));
        let sizeButtons = `<div class="size-filter-buttons">${availableSizes.map(sz => `<button class="size-filter-btn ${visibleSet.has(sz)?'active':''}" data-drink="${escapeHtml(drinkName)}" data-size="${sz}">${SIZE_LABELS[sz]||sz}</button>`).join('')}</div>`;
        let indicator = sortOrder ? (sortOrder==='asc'?'▲':'▼') : '⚬';
        
        let blockHtml = `<div class="size-blocks-container">`;
        for (let row of filteredRows) {
            let sizeLabel = SIZE_LABELS[row.sizeKey] || row.sizeKey;
            
            // Helper: Chip mit rotem Hintergrund wenn Wert === '✅'
            const createChip = (icon, label, value) => {
                const isTrue = value === '✅';
                const chipClass = isTrue ? 'info-chip chip-true' : 'info-chip chip-false';
                return `<span class="${chipClass}"><span>${icon} ${label}</span> <span>${value}</span></span>`;
            };
            
            // 1. Allergene Zeile
            let allergenChips = ALLERGEN_FIELDS.map(a => createChip(a.icon, a.label, row.extra[a.key] || '—')).join('');
            // 2. Zusatzstoffe Zeile
            let zusatzChips = ZUSATZSTOFF_FIELDS.map(z => createChip(z.icon, z.label, row.extra[z.key] || '—')).join('');
            // 3. Weitere Merkmale (Metadaten)
            let metaChips = META_COLUMNS.map(m => createChip('', m.label, row.extra[m.id] || '—')).join('');
            
            // Nährstoffe
            let nutrientItems = NUTRIENT_MAPPING.map(nut => {
                let val = row.nutrition[nut.dbField];
                let display = nut.format(val);
                let gradeClass = getGradeClass(nut.dbField, val);
                return `<div class="nutrient-item ${gradeClass}"><div class="nutrient-label">${nut.label}</div><div class="nutrient-value">${display} ${nut.unit}</div></div>`;
            }).join('');
            
            blockHtml += `
                <div class="size-block">
                    <div class="size-header">
                        <span>📏 ${sizeLabel}</span>
                        <span class="size-badge">🥛 ${escapeHtml(row.milk)} ${row.flavouredRaw ? ' / 🍬 '+escapeHtml(row.flavouredRaw) : ''}</span>
                        <span class="size-badge">🌡️ ${escapeHtml(row.extra.temperatur||'—')}</span>
                        <span class="size-badge">⚙️ sort_db: ${escapeHtml(row.extra.sort_db||'—')}</span>
                    </div>
                    <div class="info-lines">
                        <div class="info-line"><div class="line-label">🌾 Allergene</div><div class="line-items">${allergenChips || '—'}</div></div>
                        <div class="info-line"><div class="line-label">🧪 Zusatzstoffe</div><div class="line-items">${zusatzChips || '—'}</div></div>
                        <div class="info-line"><div class="line-label">📋 Weitere Merkmale</div><div class="line-items">${metaChips || '—'}</div></div>
                    </div>
                    <div class="nutrient-grid">
                        ${nutrientItems}
                    </div>
                </div>
            `;
        }
        blockHtml += `</div>`;
        return `<div class="drink-card"><h2>🍹 ${escapeHtml(drinkName)}<div class="drink-actions"><button class="sort-btn" onclick="window.toggleSortForDrink('${escapeHtml(drinkName)}')">Sortieren ${indicator}</button><button class="sort-btn" onclick="window.resetSortForDrink('${escapeHtml(drinkName)}')">Reset</button></div></h2>${sizeButtons}${blockHtml}</div>`;
    }
    window.toggleSortForDrink = function(drink) { let cur = drinkSortMap.get(drink); if(cur==='asc') drinkSortMap.set(drink,'desc'); else if(cur==='desc') drinkSortMap.set(drink,'asc'); else drinkSortMap.set(drink,'asc'); renderSelectedTables(); };
    window.resetSortForDrink = function(drink) { drinkSortMap.delete(drink); renderSelectedTables(); };
    
    // ---------- TAB 2 (unverändert) ----------
    function computeStats() { let kcalVals = flatRawData.map(r=>parseNumber(r.kalorien_einh_kcal)).filter(v=>v!==null); let avgKcal = kcalVals.length ? (kcalVals.reduce((a,b)=>a+b,0)/kcalVals.length).toFixed(0) : 0; document.getElementById('statsGrid').innerHTML = `<div class="stat-card">🔢 Datensätze: ${flatRawData.length}</div><div class="stat-card">🔥 Ø kcal: ${avgKcal}</div><div class="stat-card">🥤 Getränke unique: ${allGetraenkNames.length}</div>`; let mainValues = [...new Set(flatRawData.map(r=>r.MAIN_GETRAENK||r.main_getraenk).filter(v=>v))].sort(); let getraenkValues = [...new Set(flatRawData.map(r=>r.GETRAENK||r.getraenk).filter(v=>v))].sort(); document.getElementById('mainGetraenkList').innerHTML = mainValues.map(v=>`<option value="${escapeHtml(v)}">`).join(''); document.getElementById('getraenkFlatList').innerHTML = getraenkValues.map(v=>`<option value="${escapeHtml(v)}">`).join(''); }
    function buildAllergenSwitches() { let container = document.getElementById('allergenSwitchesContainer'); let html = `<span>🌾 Allergene</span>`; for(let a of ALLERGEN_FIELDS) html+=`<div class="switch-item"><label>${a.icon} ${a.label}</label><input type="checkbox" data-allergen="${a.key}" ${allergenFilters[a.key]?'checked':''}></div>`; html+=`<button id="resetAllergenSwitches" class="reset-switches-btn">Reset</button>`; container.innerHTML = html; document.querySelectorAll('#allergenSwitchesContainer input').forEach(inp=>inp.addEventListener('change',()=>{ allergenFilters[inp.dataset.allergen]=inp.checked; renderFlatTable(); })); document.getElementById('resetAllergenSwitches')?.addEventListener('click',()=>{ for(let a of ALLERGEN_FIELDS) allergenFilters[a.key]=false; buildAllergenSwitches(); renderFlatTable(); }); }
    function buildAdditiveSwitches() { let container = document.getElementById('additiveSwitchesContainer'); let html = `<span>🧪 Zusatzstoffe</span>`; for(let z of ZUSATZSTOFF_FIELDS) html+=`<div class="switch-item"><label>${z.icon} ${z.label}</label><input type="checkbox" data-additive="${z.key}" ${additiveFilters[z.key]?'checked':''}></div>`; html+=`<button id="resetAdditiveSwitches" class="reset-switches-btn">Reset</button>`; container.innerHTML = html; document.querySelectorAll('#additiveSwitchesContainer input').forEach(inp=>inp.addEventListener('change',()=>{ additiveFilters[inp.dataset.additive]=inp.checked; renderFlatTable(); })); document.getElementById('resetAdditiveSwitches')?.addEventListener('click',()=>{ for(let z of ZUSATZSTOFF_FIELDS) additiveFilters[z.key]=false; buildAdditiveSwitches(); renderFlatTable(); }); }
    function buildColumnFilters() { let headers = Array.from(new Set(flatRawData.flatMap(r=>Object.keys(r)))).sort(); let container = document.getElementById('columnFiltersContainer'); container.innerHTML = headers.map(h => `<div class="col-filter-input"><label>${escapeHtml(h.substring(0,10))}</label><input type="text" data-col="${escapeHtml(h)}" placeholder="Filter" value="${escapeHtml(columnFilters[h]||'')}"></div>`).join(''); document.querySelectorAll('.col-filter-input input').forEach(inp => inp.addEventListener('input', (e) => { columnFilters[inp.dataset.col] = inp.value; renderFlatTable(); })); }
    function renderFlatTable() { if(!flatRawData.length) return; let filtered = flatRawData.filter(row => { let globalMatch = globalFilterFlat === "" || Object.values(row).map(v=>String(v??"")).join(" ").toLowerCase().includes(globalFilterFlat.toLowerCase()); if(!globalMatch) return false; for(let [col, fv] of Object.entries(columnFilters)) if(fv && !String(row[col]??"").toLowerCase().includes(fv.toLowerCase())) return false; if(mainGetraenkFilterValue && (row.MAIN_GETRAENK || row.main_getraenk) !== mainGetraenkFilterValue) return false; if(getraenkFlatFilterValue && (row.GETRAENK || row.getraenk) !== getraenkFlatFilterValue) return false; for(let [key,active] of Object.entries(allergenFilters)) if(active && !String(row[key]??"").includes('✅')) return false; for(let [key,active] of Object.entries(additiveFilters)) if(active && !String(row[key]??"").includes('✅')) return false; return true; }); let headers = Array.from(new Set(flatRawData.flatMap(r=>Object.keys(r)))).sort(); let thHtml = headers.map(h => `<th>${escapeHtml(h)}</th>`).join(''); let tbody = filtered.map(row => `<tr>${headers.map(h=>{ let val=row[h]; let display=val!==undefined&&val!==null?String(val):'—'; let gradeClass='grade-na'; if(NUTRIENT_MAPPING.some(nut=>nut.dbField===h)){ let num=parseNumber(val); gradeClass=getGradeClass(h,num); } return `<td class="${gradeClass}" style="white-space:nowrap;">${escapeHtml(display)}</td>`; }).join('')}</tr>`).join(''); document.getElementById('flatTableWrapper').innerHTML = `<div style="overflow-x:auto;"><table class="flat-data-table"><thead><tr>${thHtml}<tr></thead><tbody>${tbody||'<tr><td colspan="100" class="empty-message">Keine Treffer<tr></tr>'}</tbody></table></div>`; document.getElementById('flatRecordCount').innerText = `${filtered.length} / ${flatRawData.length}`; }
    
    async function init() {
        try {
            let res = await fetch(API_URL);
            if(!res.ok) throw new Error(`HTTP ${res.status}`);
            let data = await res.json();
            allItems = (data.data && Array.isArray(data.data)) ? data.data : (Array.isArray(data) ? data : []);
            flatRawData = [...allItems];
            buildDataStructures(allItems);
            renderTree();
            renderSelectedTables();
            computeStats();
            buildAllergenSwitches();
            buildAdditiveSwitches();
            buildColumnFilters();
            renderFlatTable();
            document.getElementById('apiStatusBadge').innerHTML = '✅ Live';
            document.getElementById('treeFilterInput').addEventListener('input', (e) => { currentTreeFilter = e.target.value; renderTree(); });
            document.getElementById('selectAllBtn').addEventListener('click', () => { for(let g of allGetraenkNames) selectedGetraenke.add(g); renderTree(); renderSelectedTables(); document.getElementById('selectedCountBadge').innerText = `${selectedGetraenke.size}`; });
            document.getElementById('clearAllBtn').addEventListener('click', () => { selectedGetraenke.clear(); renderTree(); renderSelectedTables(); document.getElementById('selectedCountBadge').innerText = `0`; });
            document.getElementById('flatGlobalSearch').addEventListener('input', (e) => { globalFilterFlat = e.target.value; renderFlatTable(); });
            document.getElementById('clearColumnFiltersBtn').addEventListener('click', () => { columnFilters = {}; buildColumnFilters(); renderFlatTable(); });
            document.getElementById('mainGetraenkFilter').addEventListener('input', (e) => { mainGetraenkFilterValue = e.target.value; renderFlatTable(); });
            document.getElementById('getraenkFlatFilter').addEventListener('input', (e) => { getraenkFlatFilterValue = e.target.value; renderFlatTable(); });
            document.getElementById('clearMainGetraenkBtn').addEventListener('click', () => { mainGetraenkFilterValue = ""; getraenkFlatFilterValue = ""; document.getElementById('mainGetraenkFilter').value = ""; document.getElementById('getraenkFlatFilter').value = ""; renderFlatTable(); });
            let datalist = document.getElementById('getraenkList');
            datalist.innerHTML = allGetraenkNames.map(n => `<option value="${escapeHtml(n)}">`).join('');
            document.getElementById('getraenkSearchInput').addEventListener('change', (e) => { let val = e.target.value.trim(); let match = allGetraenkNames.find(n => n.toLowerCase() === val.toLowerCase()); if(match && !selectedGetraenke.has(match)) { selectedGetraenke.add(match); renderTree(); renderSelectedTables(); e.target.value = ''; } });
        } catch(err) { document.getElementById('treeContainer').innerHTML = `<div class="empty-message">❌ Fehler: ${err.message}<br>API nicht erreichbar? Starte Server auf ${API_URL}</div>`; }
    }
    document.querySelectorAll('.tab-button').forEach(btn => btn.addEventListener('click', () => { document.querySelectorAll('.tab-button').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active')); if(btn.dataset.tab === 'tab1') document.getElementById('paneExplorer').classList.add('active'); else { document.getElementById('paneAllData').classList.add('active'); if(flatRawData.length) { computeStats(); buildColumnFilters(); renderFlatTable(); } } }));
    init();
</script>
</body>
</html>
