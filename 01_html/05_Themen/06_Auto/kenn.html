<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>KA KLO 00 Kennzeichen</title>
  <style>
    body {
      background: #ccc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .plate-wrapper {
      margin: 40px;
    }

    .plate {
      display: inline-flex;
      align-items: center;
      background: #fdfdfd;
      border: 4px solid #111;
      border-radius: 10px;
      padding: 8px 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
      gap: 14px;
    }

    .eu-band {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0044aa;
      color: #ffffff;
      width: 40px;
      height: 80px;
      border-radius: 6px 0 0 6px;
      box-sizing: border-box;
      padding-top: 4px;
    }

    .eu-stars {
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 4px;
      opacity: 0.9;
    }

    .country-code {
      font-weight: 700;
      font-size: 16px;
    }

    .text-area {
      font-family: "DIN Condensed", "Arial Narrow", system-ui, sans-serif;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 4px;
      color: #111;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .city-code {
      margin-right: 4px;
    }

    .dot {
      font-size: 20px;
      margin: 0 2px;
    }

    .number {
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="plate-wrapper">
    <div class="plate">
      <div class="eu-band">
        <div class="eu-stars">★</div>
        <div class="country-code">D</div>
      </div>
      <div class="text-area">
        <span class="city-code">KA</span>
        <span class="dot">•</span>
        <span class="number">ES&nbsp;00</span>
      </div>
    </div>
  </div>
</body>
</html>
