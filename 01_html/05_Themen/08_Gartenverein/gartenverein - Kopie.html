<body>
<div class="card">
    <div class="header">
        <h1>
            🌻 Grundstück & Eigentümer
            <span>Kleingartenverein „Am Wiesenring“</span>
        </h1>
        <div class="status-hint">
            ⚠️ Rote Zeilen = FlurStatus = 3 | 🔴 Dunkelrot = FlurStatus = 4 | 📅 EINTRAG_VOM | 🔄 ANSTELLE_VON | 📅 MITGLIED_BIS | 🔍 Erweiterte Filter
        </div>
    </div>

    <!-- Tab-Navigation -->
    <div class="tab-bar">
        <button class="tab active" id="tabAlle">📋 Alle Daten (sortiert nach Mitgl.Nr)</button>
        <button class="tab" id="tabFlurstueck">🗂️ Gruppiert nach Flurstück</button>
    </div>

    <div class="toolbar">
        <div class="search-wrapper">
            <i class="emoji-icon">🔍</i>
            <input type="text" id="searchInput" placeholder="Volltextsuche (Name, Adresse, Kontakt...)" autofocus>
        </div>
        
        <div class="filter-section">
            <div class="filter-item">
                <label>🔖 Version:</label>
                <select id="versionFilter">
                    <option value="all">Alle Versionen</option>
                </select>
            </div>
            
            <div class="filter-item">
                <label>🆔 Mitglieds-Nr:</label>
                <input type="text" id="mitgliedsnummerFilter" placeholder="z.B. 1234" title="Mitgliedsnummer eingeben">
            </div>
            
            <div class="filter-item">
                <label>🗺️ Flurstück:</label>
                <select id="flurstueckFilter">
                    <option value="all">Alle Flurstücke</option>
                </select>
            </div>
            
            <div class="filter-item">
                <label>🚦 Status:</label>
                <select id="statusFilter">
                    <option value="all">Alle Status</option>
                    <option value="3">Status 3 (Rot)</option>
                    <option value="4">Status 4 (Dunkelrot)</option>
                </select>
            </div>
            
            <div class="stats" id="tableStats">… lädt</div>
        </div>
    </div>

    <div class="active-filters" id="activeFilters">
        <span class="filter-badge">Aktive Filter:</span>
        <span id="filterDisplay"></span>
    </div>

        <div id="dynamicContent">
            <div class="loader-overlay"><div class="loader"></div></div>
        </div>

    <div class="footer-note">
        <div>
            ⚡ <span id="resultCount">0</span> Datensätze angezeigt
        </div>
        <button class="reset-btn" id="resetFiltersBtn">⌫ Alle Filter zurücksetzen</button>

</div>

<!-- Image Modal -->

    <span class="image-modal-close" onclick="closeImageModal()">&times;</span>
    <img class="image-modal-content" id="modalImage">
</div>

<!-- Image Cache (versteckt für Preloading) -->
<div id="imageCache" class="image-cache"></div>

<script>
    (function() {
        // DOM-Elemente
        const searchInput = document.getElementById('searchInput');
        const resetBtn = document.getElementById('resetFiltersBtn');
        const tableStats = document.getElementById('tableStats');
        const resultCountSpan = document.getElementById('resultCount');
        const dynamicContainer = document.getElementById('dynamicContent');
        const tabAlle = document.getElementById('tabAlle');
        const tabFlurstueck = document.getElementById('tabFlurstueck');
        const versionFilter = document.getElementById('versionFilter');
        const mitgliedsnummerFilter = document.getElementById('mitgliedsnummerFilter');
        const flurstueckFilter = document.getElementById('flurstueckFilter');
        const statusFilter = document.getElementById('statusFilter');
        const filterDisplay = document.getElementById('filterDisplay');
        const imageModal = document.getElementById('imageModal');
        const modalImage = document.getElementById('modalImage');
        const imageCache = document.getElementById('imageCache');

        // Status
        let allData = [];
        let currentSearchFilter = '';
        let currentVersion = 'all';
        let currentMitgliedsnummer = '';
        let currentFlurstueck = 'all';
        let currentStatus = 'all';
        let activeTab = 'alle';
        
        // Verfügbare Optionen
        let availableVersions = new Set();
        let availableFlurstuecke = new Set();

        // Image Cache für geladene Bilder
        let imageCacheMap = new Map();

        // Service URLs
        const SERVICE_URL = 'http://localhost:5000/gartenverein/grundstueck_eigentuemer';
        const IMAGE_BASE_URL = 'http://localhost:5000/rel_person_bild';

        // Globale Funktion zum Öffnen des Modals
        window.openImageModal = function(imageUrl) {
            modalImage.src = imageUrl;
            imageModal.style.display = 'block';
        };

        window.closeImageModal = function() {
            imageModal.style.display = 'none';
            modalImage.src = '';
        };

        // Bild laden und cachen
        async function loadPersonImage(personId) {
            if (!personId || personId === '—' || personId === 'null' || personId === 'undefined') {
                return null;
            }

            // Prüfen ob bereits im Cache
            if (imageCacheMap.has(personId)) {
                return imageCacheMap.get(personId);
            }

            try {
                const response = await fetch(`${IMAGE_BASE_URL}/${personId}`);
                
                if (!response.ok) {
                    imageCacheMap.set(personId, null);
                    return null;
                }

                const data = await response.json();
                
                if (!data || data.length === 0) {
                    imageCacheMap.set(personId, null);
                    return null;
                }

                // Finde das Hauptbild (MAIN_BILD = 1) oder nimm das erste
                const mainImage = data.find(img => img.MAIN_BILD === 1) || data[0];
                
                // Konvertiere die bytea Daten
                let byteArray;
                if (mainImage.FILECONTENT?.data) {
                    if (mainImage.FILECONTENT.data instanceof Array) {
                        byteArray = new Uint8Array(mainImage.FILECONTENT.data);
                    } else if (mainImage.FILECONTENT.data instanceof Uint8Array) {
                        byteArray = mainImage.FILECONTENT.data;
                    } else if (typeof mainImage.FILECONTENT.data === 'string') {
                        // Base64 dekodieren
                        const binaryString = atob(mainImage.FILECONTENT.data);
                        byteArray = new Uint8Array(binaryString.length);
                        for (let i = 0; i < binaryString.length; i++) {
                            byteArray[i] = binaryString.charCodeAt(i);
                        }
                    } else {
                        return null;
                    }

                    // Erstelle Blob und URL
                    const blob = new Blob([byteArray], { type: 'image/jpeg' });
                    const imageUrl = URL.createObjectURL(blob);
                    
                    // Cache die URL
                    imageCacheMap.set(personId, imageUrl);
                    
                    // Zum sichtbaren Cache hinzufügen für Preloading
                    const cacheImg = document.createElement('img');
                    cacheImg.src = imageUrl;
                    cacheImg.style.display = 'none';
                    imageCache.appendChild(cacheImg);
                    
                    return imageUrl;
                }
                
                return null;
            } catch (error) {
                console.error('Fehler beim Laden des Bildes:', error);
                imageCacheMap.set(personId, null);
                return null;
            }
        }

        // Hilfsfunktionen
        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function compareMitgliedsnummer(a, b) {
            const numA = a.MITGLIEDSNUMMER ?? a.mitgliedsnummer ?? '';
            const numB = b.MITGLIEDSNUMMER ?? b.mitgliedsnummer ?? '';
            return String(numA).localeCompare(String(numB), undefined, { numeric: true });
        }

        function isFlurStatusThree(item) {
            const status = item.FK_STD_KATA_FLURSTUECK_VERE_VEREINSMITGLIED_STATUS ??

        // Filter-Optionen aktualisieren
        function updateFilterOptions() {
            availableVersions.clear();
            availableFlurstuecke.clear();
            
            allData.forEach(item => {
                const version = getItemVersion(item);
                if (version) availableVersions.add(String(version));
                
                const flurstueck = getItemFlurstueck(item);
                if (flurstueck) availableFlurstuecke.add(String(flurstueck));
            });

            // Versionen
            const sortedVersions = Array.from(availableVersions).sort((a, b) => {
                const numA = parseInt(a) || 0;
                const numB = parseInt(b) || 0;
                return numA - numB;
            });

            versionFilter.innerHTML = '<option value="all">Alle Versionen</option>';
            sortedVersions.forEach(version => {
                const option = document.createElement('option');
                option.value = version;
                option.textContent = `Version ${version}`;
                versionFilter.appendChild(option);
            });

            // Flurstücke
            const sortedFlurstuecke = Array.from(availableFlurstuecke).sort((a, b) => {
                return String(a).localeCompare(String(b), undefined, { numeric: true });
            });

            flurstueckFilter.innerHTML = '<option value="all">Alle Flurstücke</option>';
            sortedFlurstuecke.forEach(flurstueck => {
                const option = document.createElement('option');
                option.value = flurstueck;
                option.textContent = `Flurstück ${flurstueck}`;
                flurstueckFilter.appendChild(option);
            });

            // Aktuelle Auswahl wiederherstellen
            if (currentVersion !== 'all' && sortedVersions.includes(currentVersion)) {
                versionFilter.value = currentVersion;
            } else {
                currentVersion = 'all';
            }
            
            if (currentFlurstueck !== 'all' && sortedFlurstuecke.includes(currentFlurstueck)) {
                flurstueckFilter.value = currentFlurstueck;
            } else {
                currentFlurstueck = 'all';
            }
            
            mitgliedsnummerFilter.value = currentMitgliedsnummer;
            statusFilter.value = currentStatus;
            updateFilterDisplay();
        }

        // Filter-Anzeige aktualisieren
        function updateFilterDisplay() {
            const activeFilters = [];
            
            if (currentVersion !== 'all') {
                activeFilters.push(`<span class="filter-tag">🔖 Version ${currentVersion} <button onclick="window.clearVersionFilter()" title="Entfernen">✕</button></span>`);
            }
            
            if (currentMitgliedsnummer) {
                activeFilters.push(`<span class="filter-tag">🆔 Nr: ${currentMitgliedsnummer} <button onclick="window.clearMitgliedsnummerFilter()" title="Entfernen">✕</button></span>`);
            }
            
            if (currentFlurstueck !== 'all') {
                activeFilters.push(`<span class="filter-tag">🗺️ Flurst. ${currentFlurstueck} <button onclick="window.clearFlurstueckFilter()" title="Entfernen">✕</button></span>`);
            }
            
            if (currentStatus !== 'all') {
                const statusText = currentStatus === '3' ? 'Status 3 (Rot)' : 'Status 4 (Dunkelrot)';
                activeFilters.push(`<span class="filter-tag">🚦 ${statusText} <button onclick="window.clearStatusFilter()" title="Entfernen">✕</button></span>`);
            }
            
            if (currentSearchFilter) {
                activeFilters.push(`<span class="filter-tag">🔍 "${currentSearchFilter}" <button onclick="window.clearSearchFilter()" title="Entfernen">✕</button></span>`);
            }
            
            filterDisplay.innerHTML = activeFilters.length ? activeFilters.join(' ') : 
                '<span class="filter-tag" style="background: #e9f2e2;">Keine aktiven Filter</span>';

        // Filter-Funktion
        function filterData() {
            return allData.filter(item => {
                // Version
                if (currentVersion !== 'all') {
                    const itemVersion = getItemVersion(item);
                    if (!itemVersion || String(itemVersion) !== currentVersion) return false;
                }

                // Mitgliedsnummer
                if (currentMitgliedsnummer) {
                    const itemMitgl = getItemMitgliedsnummer(item);
                    if (!itemMitgl || !String(itemMitgl).toLowerCase().includes(currentMitgliedsnummer.toLowerCase())) {
                        return false;
                    }
                }

                // Flurstück
                if (currentFlurstueck !== 'all') {
                    const itemFlurstueck = getItemFlurstueck(item);
                    if (!itemFlurstueck || String(itemFlurstueck) !== currentFlurstueck) return false;
                }

                // Status Filter
                if (currentStatus !== 'all') {
                    const itemStatus = getItemStatus(item);
                    if (!itemStatus || String(itemStatus).trim() !== currentStatus) return false;
                }

                // Volltextsuche
                if (currentSearchFilter) {
                    const searchLower = currentSearchFilter.toLowerCase().trim();
                    const searchable = [
                        item.MITGLIEDSNUMMER, item.mitgliedsnummer,
                        item.VORNAME, item.vorname,
                        item.NACHNAME, item.nachname,
                        item.flurstueck_nummer, item.flurstuecknummer,
                        item.STRASSE, item.strasse,
                        item.ORT, item.ort,
                        item.EMAIL, item.email,
                        item.MOBILNUMMER, item.mobilnummer,
                        item.FESTNETZNUMMER, item.festnetznummer,
                        item.EINTRAG_VOM, item.eintrag_vom,
                        item.ANSTELLE_VON, item.anstelle_von,
                        item.GEBURTSDATUM, item.geburtsdatum,
                        item.TITEL, item.titel,
                        item.BEMERKUNG, item.bemerkung
                    ].filter(v => v != null).map(v => String(v).toLowerCase()).join(' ');
                    
                    if (!searchable.includes(searchLower)) return false;
                }

                return true;
            });
        }

                    row.appendChild(tdEintrag);
                    row.appendChild(tdAnstelle);
                    row.appendChild(tdKontakt);

                    fragment.appendChild(row);
                });
            });

            return fragment;
        }

        // Rendern
        function renderTable() {
            const filtered = filterData();

            let table = document.querySelector('#dynamicContent table');
            if (!table) {
                table = document.createElement('table');
                table.id = 'propertyTable';
                dynamicContainer.innerHTML = '';
                dynamicContainer.appendChild(table);
            }

            const thead = document.createElement('thead');
            if (activeTab === 'alle') {
                thead.innerHTML = `<tr>
                    <th>Bild</th>
                    <th>Verein + Mitgl.Nr + Version</th>
                    <th>Person</th>
                    <th>Geburt</th>
                    <th>Gruppe</th>
                    <th>Flur/Flurst</th>
                    <th>seit</th>
                    <th>bis</th>
                    <th>Status</th>
                    <th>Typ</th>
                    <th>Fortl.Nr</th>
                    <th>FlurStatus</th>
                    <th>Eig.Nr</th>
                    <th>Anteile</th>
                    <th>Eintrag</th>
                    <th>Anstelle</th>
                    <th>Kontakt</th>
                </tr>`;
            } else {
                thead.innerHTML = `<tr>
                    <th>Bild</th>
                    <th>Mitgl.Nr</th>
                    <th>Name</th>
                    <th>Geburt</th>
                    <th>Gruppe</th>
                    <th>Flurst-ID</th>
                    <th>seit</th>
                    <th>bis</th>
                    <th>Status</th>
                    <th>Typ</th>
                    <th>Fortl.Nr</th>
                    <th>FlurStatus</th>
                    <th>Eig.Nr</th>
                    <th>Anteile</th>
                    <th>Eintrag</th>
                    <th>Anstelle</th>
                    <th>📞</th>
                </tr>`;
            }
            
            table.innerHTML = '';
            table.appendChild(thead);
            const tbody = document.createElement('tbody');
            table.appendChild(tbody);

            if (activeTab === 'alle') {
                filtered.sort(compareMitgliedsnummer);
                const fragment = document.createDocumentFragment();
                filtered.forEach(item => {
                    const row = createRowAlle(item);
                    if (currentSearchFilter) row.classList.add('highlight');
                    fragment.appendChild(row);
                });
                tbody.appendChild(fragment);
                tableStats.innerText = `${filtered.length} von ${allData.length} Einträgen`;
                resultCountSpan.innerText = filtered.length;
            } else {
                if (filtered.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 17;
                    td.textContent = 'Keine Einträge';
                    td.style.textAlign = 'center';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    tableStats.innerText = `0 von ${allData.length} Mitgliedern`;
                    resultCountSpan.innerText = '0';
                } else {
                    tbody.appendChild(createFlurstueckTable(filtered));
                    const groupCount = new Set(filtered.map(i => i.flurstueck_nummer ?? i.flurstuecknummer)).size;
                    tableStats.innerText = `${filtered.length} von ${allData.length} Mitgliedern (${groupCount} Gruppen)`;
                    resultCountSpan.innerText = filtered.length;
                }
            }

            updateFilterDisplay();
        }

        // Daten laden
        async function loadDataFromService() {
            dynamicContainer.innerHTML = `<div class="loader-overlay"><div class="loader"></div></div>`;
            tableStats.innerText = 'lädt …';

            try {
                const response = await fetch(SERVICE_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const data = await response.json();
                allData = Array.isArray(data) ? data : 
                         (data.data || data.rows || []);

                updateFilterOptions();
                allData.sort(compareMitgliedsnummer);
                renderTable();
                resetBtn.disabled = false;
            } catch (error) {
                dynamicContainer.innerHTML = `
                    <div class="error-message">
                        <span style="font-size:2rem;">⚠️</span>
                        <div>
                            <strong>Fehler beim Laden:</strong><br>
                            ${escapeHtml(error.message)}
                        </div>
                    </div>`;
                tableStats.innerText = 'Fehler';
                resultCountSpan.innerText = '0';
            }
        }

        // Event-Listener
        searchInput.addEventListener('input', (e) => {
            currentSearchFilter = e.target.value;
            renderTable();
        });

        versionFilter.addEventListener('change', (e) => {
            currentVersion = e.target.value;
            renderTable();
        });

        mitgliedsnummerFilter.addEventListener('input', (e) => {
            currentMitgliedsnummer = e.target.value;
            renderTable();
        });

        flurstueckFilter.addEventListener('change', (e) => {
            currentFlurstueck = e.target.value;
            renderTable();
        });

        statusFilter.addEventListener('change', (e) => {
            currentStatus = e.target.value;
            renderTable();
        });

        resetBtn.addEventListener('click', () => {
            currentSearchFilter = '';
            currentVersion = 'all';
            currentMitgliedsnummer = '';
            currentFlurstueck = 'all';
            currentStatus = 'all';
            
            searchInput.value = '';
            versionFilter.value = 'all';
            mitgliedsnummerFilter.value = '';
            flurstueckFilter.value = 'all';
            statusFilter.value = 'all';
            
            updateFilterDisplay();
            renderTable();
            searchInput.focus();
        });

        tabAlle.addEventListener('click', () => {
            tabAlle.classList.add('active');
            tabFlurstueck.classList.remove('active');
            activeTab = 'alle';
            renderTable();
        });

        tabFlurstueck.addEventListener('click', () => {
            tabFlurstueck.classList.add('active');
            tabAlle.classList.remove('active');
            activeTab = 'flurstueck';
            renderTable();
        });

        // Modal schließen bei Klick außerhalb
        window.onclick = function(event) {
            if (event.target === imageModal) {
                closeImageModal();
            }
        };

        // Escape-Taste zum Schließen
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && imageModal.style.display === 'block') {
                closeImageModal();
            }
        });

        // Start
        loadDataFromService();
    })();
</script>
</body>
</html>
