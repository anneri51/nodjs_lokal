<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clickable Map</title>

<style>
  body {
    margin: 0;
    background: #f5f5f5;
    font-family: sans-serif;
  }

  .map {
    position: relative;
    width: 800px;      /* adjust to your preferred size */
    height: 500px;
    margin: 40px auto;
    background: #e0e0e0;
  }

  .region {
    position: absolute;
    background: #1e88e5;
    color: white;
    font-size: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    outline: 4px solid #ffffff;   /* clean borders between areas */
  }
</style>
</head>

<body>

<div class="map">
  <!-- Coordinates approximating your figure -->
  <div class="region" data-id="1" style="left:0; top:0; width:260px; height:260px;">1</div>
  <div class="region" data-id="2" style="left:260px; top:0; width:200px; height:130px;">2</div>
  <div class="region" data-id="3" style="left:460px; top:0; width:340px; height:260px;">3</div>
  <div class="region" data-id="4" style="left:260px; top:130px; width:100px; height:130px;">4</div>
  <div class="region" data-id="5" style="left:360px; top:130px; width:100px; height:260px;">5</div>
  <div class="region" data-id="6" style="left:0; top:260px; width:130px; height:240px;">6</div>
  <div class="region" data-id="7" style="left:130px; top:260px; width:230px; height:240px;">7</div>
  <div class="region" data-id="8" style="left:360px; top:390px; width:300px; height:110px;">8</div>
  <div class="region" data-id="9" style="left:660px; top:260px; width:140px; height:240px;">9</div>
</div>

<script>
  document.querySelectorAll('.region').forEach(r => {
    r.addEventListener('click', () => {
      alert("Clicked region " + r.dataset.id);
    });
  });
</script>

</body>
</html>
