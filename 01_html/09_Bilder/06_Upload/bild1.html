<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Base64 PDF Viewer</title>
<style>
    body { font-family: sans-serif; margin: 20px; }
    #viewer { width: 100%; height: 90vh; border: 1px solid #ccc; }
    textarea { width: 100%; height: 200px; }
</style>
</head>
<body>

<h2>PDF aus Base64 anzeigen</h2>

<textarea id="b64" placeholder="Hier Base64-PDF einfügen..."></textarea>
<br><br>
<button id="show">PDF anzeigen</button>

<iframe id="viewer"></iframe>

<script>
document.getElementById("show").addEventListener("click", () => {
    const base64 = document.getElementById("b64").value.trim();
    if (!base64) return;

    // Falls "data:application/pdf;base64," enthalten ist → entfernen
    const clean = base64.replace(/^data:application\/pdf;base64,/, "");

    // Base64 → Bytearray
    const byteChars = atob(clean);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) {
        byteNumbers[i] = byteChars.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);

    // Blob erzeugen
    const blob = new Blob([byteArray], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);

    // PDF anzeigen
    document.getElementById("viewer").src = url;
});
</script>

</body>
</html>
